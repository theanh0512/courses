            card.innerHTML = `
                <div class="module-banner" style="background: ${bgColor}">
                    ${coverImg}
                    <div class="module-banner-title">Chapter ${mIndex + 1}</div>
                </div>
                <div class="module-info">
                    <h3>${mod.title}</h3>
                    <p>${description}</p>
                    <div class="module-progress">
                        <div style="width: ${progressPct}%; height: 100%; background: #000;"></div>
                    </div>
                </div>
            `;

            // Clicking card opens the module: auto-expands accordion and loads first lesson of that module
            card.addEventListener('click', () => {
                group.classList.remove('collapsed');
                if (mod.lessons && mod.lessons.length > 0) {
                    const firstLesson = mod.lessons[0];
                    // Find the UI element in sidebar 
                    const lessonEl = lessonsContainer.querySelector('.lesson-item');
                    if (lessonEl) lessonEl.click();
                } else {
                    // Empty module
                    showHome();
                }
            });

            moduleGrid.appendChild(card);
        });
    }

    // Default: Show Home
    showHome();

    function loadLesson(lesson) {
        // Switch view
        homeView.style.display = 'none';
        lessonView.style.display = 'block';

        // Update Title
        lessonTitleEl.textContent = lesson.title;

        // Update Video
        if (lesson.videos && lesson.videos.length > 0 && lesson.videos[0].localPath) {
            // Pick first video for now, ensure we URL encode the path to handle spaces
            const videoPath = 'downloads/' + encodeURIComponent(lesson.videos[0].localPath);
            const ext = videoPath.split('.').pop().toLowerCase();
            const mimeType = ext === 'webm' ? 'video/webm' : 'video/mp4';

            videoContainer.style.display = 'block';
            const localPath = lesson.videos[0].localPath;
            const ytId = (window.VIDEO_YOUTUBE_IDS || {})[localPath];
            const driveId = (window.VIDEO_DRIVE_IDS || {})[localPath];
            if (ytId) {
                videoContainer.innerHTML = `
                    <iframe src="https://www.youtube-nocookie.com/embed/${ytId}?modestbranding=1&rel=0"
                            allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen
                            style="width:100%; aspect-ratio:16/9; border:0; border-radius:12px; background:#000;"></iframe>
                `;
            } else if (driveId) {
                videoContainer.innerHTML = `
                    <iframe src="https://drive.google.com/file/d/${driveId}/preview"
                            allow="autoplay; encrypted-media; fullscreen" allowfullscreen
                            style="width:100%; aspect-ratio:16/9; border:0; border-radius:12px; background:#000;"></iframe>
                `;
            } else {
                videoContainer.innerHTML = `
                    <video controls controlsList="nodownload">
                        <source src="${videoPath}" type="${mimeType}">
                        Your browser does not support the video tag.
                    </video>
                `;
            }
        } else {
            videoContainer.style.display = 'block';
            videoContainer.innerHTML = '<div class="video-placeholder">No video available</div>';
        }

        // Update Documents (downloaded files)
        if (lesson.documents && lesson.documents.length > 0) {
            materialsSection.style.display = 'block';
            materialsList.innerHTML = '';
            lesson.documents.forEach(doc => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = 'downloads/' + encodeURIComponent(doc.localPath);
                a.target = '_blank';
                a.textContent = doc.localPath.split(' - ').slice(1).join(' - ') || doc.localPath;
                li.appendChild(a);
                materialsList.appendChild(li);
            });
        } else {
            materialsSection.style.display = 'none';
            materialsList.innerHTML = '';
        }

        // Update Resource Links (Skool resource blocks)
        const rLinks = (lesson.resourceLinks || []).filter(r => r.url);
        if (rLinks.length > 0) {
            resourcesSection.style.display = 'block';
            resourcesList.innerHTML = '';
            rLinks.forEach(res => {
                const li = document.createElement('li');
                li.className = 'resource-item';

                if (res.type === 'localfile') {
                    // Render as expandable inline file viewer
                    const btn = document.createElement('button');
                    btn.className = 'resource-file-btn';
                    btn.innerHTML = '📄 ' + res.title + ' <span class="resource-expand-hint">(click to view)</span>';
                    const codeBlock = document.createElement('div');
                    codeBlock.className = 'resource-code-block';
                    codeBlock.style.display = 'none';
                    btn.addEventListener('click', () => {
                        if (codeBlock.style.display === 'none') {
                            if (!codeBlock.dataset.loaded) {
                                const text = res.content || '(no content)';
                                const pre = document.createElement('pre');
                                const code = document.createElement('code');
                                code.textContent = text;
                                pre.appendChild(code);
                                const copyBtn = document.createElement('button');
                                copyBtn.className = 'resource-copy-btn';
                                copyBtn.textContent = 'Copy';
                                copyBtn.addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    navigator.clipboard.writeText(text).then(() => {
                                        copyBtn.textContent = 'Copied!';
                                        setTimeout(() => copyBtn.textContent = 'Copy', 2000);
                                    });
                                });
                                codeBlock.appendChild(copyBtn);
                                codeBlock.appendChild(pre);
                                codeBlock.dataset.loaded = 'true';
                            }
                            codeBlock.style.display = 'block';
                            btn.querySelector('.resource-expand-hint').textContent = '(click to hide)';
                        } else {
                            codeBlock.style.display = 'none';
                            btn.querySelector('.resource-expand-hint').textContent = '(click to view)';
                        }
                    });
                    li.appendChild(btn);
                    li.appendChild(codeBlock);
                } else {
                    const a = document.createElement('a');
                    a.href = res.url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.innerHTML = '🔗 ' + res.title;
                    li.appendChild(a);
                }

                resourcesList.appendChild(li);
            });
        } else {
            resourcesSection.style.display = 'none';
            resourcesList.innerHTML = '';
        }

        // Community Posts (pinned to this lesson)
        const postsSection = document.getElementById('posts-section');
        const postsList = document.getElementById('posts-list');
        const postsSectionTitle = document.getElementById('posts-section-title');
        const posts = lesson.posts || [];
        if (posts.length > 0) {
            postsSection.style.display = 'block';
            postsSectionTitle.textContent = posts.length + ' Community Post' + (posts.length === 1 ? '' : 's');
            postsList.innerHTML = '';
            function timeAgo(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                const sec = Math.floor((Date.now() - d.getTime()) / 1000);
                if (sec < 60) return sec + 's ago';
                if (sec < 3600) return Math.floor(sec/60) + 'm ago';
                if (sec < 86400) return Math.floor(sec/3600) + 'h ago';
                if (sec < 86400*30) return Math.floor(sec/86400) + 'd ago';
                if (sec < 86400*365) return Math.floor(sec/(86400*30)) + 'mo ago';
                return Math.floor(sec/(86400*365)) + 'y ago';
            }
            function escHtml(s) {
                return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }
            posts.forEach(p => {
                const card = document.createElement('div');
                card.className = 'post-card';
                const avatarSrc = p.authorAvatarLocal ? 'downloads/' + p.authorAvatarLocal : (p.authorAvatarUrl || '');
                const thumbSrc = p.thumbnailLocal ? 'downloads/' + p.thumbnailLocal : (p.thumbnailUrl || '');
                const body = escHtml(p.content || '').replace(/\n/g, '<br/>');
                const isLong = (p.content || '').length > 400;
                let html = '';
                html += '<div class="post-card-header">';
                if (avatarSrc) {
                    html += '<img class="post-card-avatar" src="' + escHtml(avatarSrc) + '" alt="" onerror="this.style.display=\'none\'">';
                } else {
                    html += '<div class="post-card-avatar"></div>';
                }
                html += '<div>';
                html += '<div class="post-card-author">' + escHtml(p.author || 'Anonymous') + '</div>';
                html += '<div class="post-card-time">' + timeAgo(p.createdAt) + '</div>';
                html += '</div></div>';
                if (p.title) {
                    html += '<div class="post-card-title">' + escHtml(p.title) + '</div>';
                }
                html += '<div class="post-card-body"><div>';
                html += '<div class="post-card-text ' + (isLong ? 'collapsed' : '') + '">' + body + '</div>';
                if (isLong) {
                    html += '<span class="post-card-expand">Show more</span>';
                }
                html += '</div>';
                if (thumbSrc) {
                    html += '<img class="post-card-thumb" src="' + escHtml(thumbSrc) + '" alt="" onerror="this.style.display=\'none\'">';
                }
                html += '</div>';
                html += '<div class="post-card-stats">';
                html += '<span>👍 ' + (p.upvotes || 0) + '</span>';
                html += '<span>💬 ' + (p.comments || 0) + '</span>';
                if (p.postUrl) {
                    html += '<a href="' + escHtml(p.postUrl) + '" target="_blank" rel="noopener">View on Skool ↗</a>';
                }
                html += '</div>';
                card.innerHTML = html;
                const expandBtn = card.querySelector('.post-card-expand');
                if (expandBtn) {
                    expandBtn.addEventListener('click', () => {
                        const text = card.querySelector('.post-card-text');
                        if (text.classList.contains('collapsed')) {
                            text.classList.remove('collapsed');
                            text.classList.add('expanded');
                            expandBtn.textContent = 'Show less';
                        } else {
                            text.classList.add('collapsed');
                            text.classList.remove('expanded');
                            expandBtn.textContent = 'Show more';
                        }
                    });
                }
                postsList.appendChild(card);
            });
        } else {
            postsSection.style.display = 'none';
            postsList.innerHTML = '';
        }

        // Update Text Content
        function renderMarks(node) {
            if (!node || !node.text) return '';
            let t = node.text;
            if (node.marks) {
                node.marks.forEach(m => {
                    if (m.type === 'bold') t = '<strong>' + t + '</strong>';
                    if (m.type === 'italic') t = '<em>' + t + '</em>';
                    if (m.type === 'code') t = '<code>' + t + '</code>';
                    if (m.type === 'link') t = '<a href="' + m.attrs.href + '" target="_blank">' + t + '</a>';
                });
            }
            return t;
        }

        function renderBlock(block) {
            if (!block) return '';
            if (block.type === 'paragraph') {
                if (!block.content) return '<br/>';
                return '<p>' + block.content.map(renderMarks).join('') + '</p>';
            }
            if (block.type === 'heading') {
                const level = block.attrs && block.attrs.level ? block.attrs.level : 3;
                return '<h' + level + '>' + (block.content ? block.content.map(renderMarks).join('') : '') + '</h' + level + '>';
            }
            if (block.type === 'unorderedList' || block.type === 'orderedList') {
                const tag = block.type === 'orderedList' ? 'ol' : 'ul';
                const items = (block.content || []).map(li => {
                    const liContent = li.content ? li.content.map(renderBlock).join('') : '';
                    return '<li>' + liContent + '</li>';
                }).join('');
                return '<' + tag + '>' + items + '</' + tag + '>';
            }
            if (block.type === 'horizontalRule') return '<hr style="margin: 24px 0; border: 0; border-top: 1px solid var(--border-color);" />';
            if (block.type === 'image') return '<img src="' + block.attrs.src + '" alt="image" style="max-width:100%; border-radius:8px; margin: 16px 0;" />';
            
            // recursively handle nested content if unrecognized wrapper
            if (block.content) return block.content.map(renderBlock).join('');
            return '';
        }

        if (lesson.domContent) {
            lessonTextEl.innerHTML = lesson.domContent;
            lessonTextEl.style.display = 'block';
        } else if (lesson.textContent && lesson.textContent.startsWith('[v2]')) {
            try {
                const blocks = JSON.parse(lesson.textContent.substring(4));
                const html = blocks.map(renderBlock).join('');
                lessonTextEl.innerHTML = html;
                lessonTextEl.style.display = 'block';
            } catch(e) {
                lessonTextEl.style.display = 'none';
            }
        } else if (lesson.textContent && lesson.textContent.length > 5 && !lesson.textContent.startsWith('[v2]')) {
            // Process line by line to handle headings, images, links
            function slugToTitle(s) {
                return s.split('-').map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
            }
            var lines = lesson.textContent.split(String.fromCharCode(10));
            var html = '';
            for (var li = 0; li < lines.length; li++) {
                var rawLine = lines[li];
                var line = rawLine.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                line = line.replace(/!\[([^\]]*)\]\(([^)]*)\)/g, '<img src="$2" alt="$1" style="max-width:100%; border-radius:8px; margin: 16px 0;" />');
                line = line.replace(/\[([^\]]*)\]\(([^)]*)\)/g, '<a href="$2" target="_blank">$1</a>');
                line = line.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                line = line.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                var h1 = line.match(/^# (.+)$/);
                var h2 = line.match(/^## (.+)$/);
                var h3 = line.match(/^### (.+)$/);
                if (h1) {
                    var t = (h1[1].indexOf('-') >= 0 && h1[1].indexOf(' ') < 0) ? slugToTitle(h1[1]) : h1[1];
                    html += '<h2 style="margin:24px 0 12px; font-size:20px; font-weight:700;">' + t + '</h2>';
                } else if (h2) {
                    var t = (h2[1].indexOf('-') >= 0 && h2[1].indexOf(' ') < 0) ? slugToTitle(h2[1]) : h2[1];
                    html += '<h3 style="margin:20px 0 10px; font-size:17px; font-weight:600;">' + t + '</h3>';
                } else if (h3) {
                    var t = (h3[1].indexOf('-') >= 0 && h3[1].indexOf(' ') < 0) ? slugToTitle(h3[1]) : h3[1];
                    html += '<h4 style="margin:16px 0 8px; font-size:15px; font-weight:600;">' + t + '</h4>';
                } else if (line.trim() === '' || line.trim() === '-----' || line.trim() === '---') {
                    html += '<br/>';
                } else {
                    html += '<p style="margin:8px 0;">' + line + '</p>';
                }
            }
            lessonTextEl.innerHTML = html;
            lessonTextEl.style.display = 'block';
        } else {
            lessonTextEl.style.display = 'none';
        }
    }
});
</script>
