 cả pipeline sáng tạo vào một con máy rồi.\nKhông cần studio, không cần ekip đông, không cần ngồi đúng một chỗ.\n\nAnh em ai từng làm AI ở chỗ nào \"lạ lạ\" không — quán cafe, quê, hay đang đi đâu đó? Drop xuống cho mình xem với. 🌊\nNhân tiện cũng thông báo là meet tuần sẽ diễn ra vào thứ 2 tuần tới nha - thông tin về buổi offline cũng private cũng sẽ note trong hôm đấy, ae chờ nhá.","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-05-22T11:27:20.150825Z","updatedAt":"2026-05-24T13:17:43.179546Z","upvotes":22,"comments":12,"thumbnailUrl":"https://image.video.skool.com/winJXgShY8G2uTXzqoBcyAHpMKTfz1ArxfIuwE8ulRk/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTMzMTM1NjQwLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoid2luSlhnU2hZOEcydVRYenFvQmN5QUhwTUtUZnoxQXJ4Zkl1d0U4dWxSayIsIndpZHRoIjoxMjgwfQ.G_JA1v_7siZalQOYWcYu32Efo43uZ8-Dl_Omi7fM292V0qdL12bYAFEqKUPqny8oFmUjRIPtjXAVpETkhq8xqlA3B4Ya5Tqjg8AEiJ6lTgdu-MDDy6ivIjQX9PSctfYjOrhWJLj1F0bgFhjRgf28lAItn2F1sg_0VXQ8v_kZrWz5M0I6OC8Jx6HzkgKKELMGaMeNdHZii27J-D8lYyHpHuVr98zW3KeqBaj1kGQv0bTBVktzXLxZF7OqKLJFrxt_OXqjfyqnfOAjS4XpTxHLC1EnEeHqXpfGMvd5Wx3kDYqRFwgUpGSVOOATS7QBKRR3quc52Vs3LrlmFwHSytwW0Q","thumbnailLocal":"post-thumbs/a559f32121de4eea.png","videoIds":"dc94e773933146f0b6f43b82c27dc42c","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/view-lam-viec-trong-vai-ngay-toi-o-ao-van-chay-uoc-ai"},{"id":"c2cdce49d8304e45b4fea9e3b9b608b5","slug":"google-io-2026-tom-gon-cho-dan-ai-creative","title":"📢 Google I/O 2026 — Tóm gọn cho dân AI Creative","content":"Halo cả nhà Đêm qua Google I/O 2026 trực tiếp thì T đang chạy 1 quả job ở Nha Trang. Mình tóm tắt nhanh phần ảnh hưởng trực tiếp đến mn làm AI Creative.\n\n🎬 Gemini Omni — model multimodal mới, hợp nhất Veo + Nano Banana + Genie thành một engine. Sinh được mọi thứ từ mọi input.\n\nĐiểm đáng chú ý:\n[ul][li]Conversational video editing — gõ câu lệnh tự nhiên để thêm/xóa object, đổi camera angle[li]Giữ character & scene consistency qua nhiều clip[li]Hiểu physics đúng — không còn cảnh vật rơi vô lý[li]SynthID watermark mặc định\n\nOmni Flash đã rollout trên Gemini app + Google Flow cho user AI Plus/Pro/Ultra. Omni Pro cho filmmaker/marketer sẽ ra sau.\n\n🎥 Google Flow update khủng — phần đáng chú ý nhất cho dân AI video:\n[ul][li]Flow Agent — creative partner plan + reason xuyên suốt project[li]Flow Tools — tự build tool / workflow bằng natural language, không cần code[li]Mobile app Android \\(beta\\), iOS sắp ra\n\n⚡ Vài cái khác: Gemini Spark \\(AI agent 24/7, AI Ultra $100/tháng\\) — Nano Banana đã sinh 50 tỷ ảnh — Gemini 3.5 Flash nhanh gấp 4 lần.\n👉 AI Creative đang bước qua giai đoạn \"test tool lẻ\" để đi vào workflow integration thật sự.\nCuộc chơi sắp tới không phải \"ai dùng tool nào\", mà là ai có workflow tối ưu nhất với taste tốt nhất.\nMn ai đã thử Omni Flash hay Flow update mới chưa? Drop kết quả bên dưới nhé. 🔥","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-05-20T04:32:42.888633Z","updatedAt":"2026-05-23T13:49:46.927733Z","upvotes":28,"comments":11,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/0a8d5a5a75ae4f5a97645093f425df534f4404a6430947998b9e6f247a06fc22.png","thumbnailLocal":"post-thumbs/bb0c3188a071f41c.png","videoIds":"","attachments":"4175726ebe1e449f965c34c1f1dfb8ae,0e937d43192d49d59d32447018863e9a","postUrl":"https://www.skool.com/ai-ker-8924/google-io-2026-tom-gon-cho-dan-ai-creative"},{"id":"9c789339217944e785cd18e882a018a9","slug":"ai-worker-community-vua-co-1-update-moi-at-ten-cho-9-level","title":"✨ AI Worker Community vừa có 1 update mới — đặt tên cho 9 level","content":"Halo ae, Mình ngồi nhìn lại cộng đồng và nhận ra: anh em đã đi cùng nhau qua rất nhiều game, nhiều workflow, nhiều cột mốc.\n\nĐến lúc mỗi level trong community xứng đáng có một cái tên đàng hoàng.\nĐây là 9 level mới của AI Worker Community:\n1️⃣ AI Beginner\n2️⃣ AI Explorer\n3️⃣ AI Creator\n4️⃣ AI Worker ⭐\n5️⃣ AI Pro Worker ⚡\n6️⃣ AI Senior 🔥\n7️⃣ AI Expert 💎\n8️⃣ AI Master 👑\n9️⃣ AI Legend 🏆\nMỗi level là một bước trong hành trình của bạn với AI Creative.\nVà Level 4 — AI Worker — là cột mốc đặc biệt nhất.\nVì khi bạn đạt level này, bạn không còn chỉ \"tham gia\" AI Worker Community nữa. Bạn chính thức LÀ một AI Worker.\nHiện tại 75% anh em vẫn đang ở Level 1. Mình mong mọi người sớm leo lên Level 4 và xa hơn nữa.\nVì sao phải sớm?\n\n👉 Sắp tới, các level từ AI Worker \\(L4\\) trở đi sẽ có những điều rất thú vị đang được mình chuẩn bị.\nChưa thể bật mí sớm — nhưng chắc chắn xứng đáng để anh em phấn đấu.\nCách leo level rất đơn giản: post sản phẩm, comment trong các thread, tham gia game, đóng góp giá trị cho cộng đồng. Mỗi tương tác chất lượng là một bước tiến.\n\nAI Worker không phải nơi để xem. Đây là nơi để làm.\nAnh em ai đang ở level mấy rồi? Drop level của bạn xuống dưới và tag mình khi bạn lên được AI Worker nhé — mình muốn ăn mừng cùng từng người. Update cuối tuần vậy thôi kkk\n\nKeep going AI Worker. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-05-16T10:44:54.79144Z","updatedAt":"2026-05-23T13:51:13.252753Z","upvotes":54,"comments":41,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/94b9880c20184e84a03a1af5ef5e78e37a0bb3d874c24d31b2b249809c443367.png","thumbnailLocal":"post-thumbs/1a7712b965c2d288.png","videoIds":"","attachments":"582c54514a7a48cfa1da2cbe3297ac4f","postUrl":"https://www.skool.com/ai-ker-8924/ai-worker-community-vua-co-1-update-moi-at-ten-cho-9-level"},{"id":"1c116ed9654b4c5cad82105d0b216b1b","slug":"video-course-moi-higgsfield-canvas","title":"🎬 Video course mới: Higgsfield Canvas","content":"Halo mn, mình vừa update video course mới về Higgsfield Canvas — một trong những node-based AI tool thú vị nhất ở thời điểm này.\nKhi mn quen được với tư duy node, tốc độ và độ kiểm soát output sẽ ở một level khác hẳn cách làm thông thường.\n\nTrong course này mình chia sẻ:\n[ul][li]Higgsfield Canvas là gì & dành cho ai[li]Các node cơ bản và cách đọc workflow[li]Build workflow đầu[li]Lưu ý để tránh sai lầm phổ biến[li]5 pro tips từ trải nghiệm thực tế của mình\n\nNói thật, node-based workflow đang dần thành kỹ năng chuẩn của AI Worker trong 6 tháng tới. Ai làm quen sớm sẽ đi trước một nhịp khi pipeline AI bắt đầu được setup bài bản trong các team.\nMn xem trước khi cả community ngồi lên cái này nhé — mình muốn thấy các workflow đầu tiên của anh em hiện ra trong group sớm. 🔥\n\nLink course: [https://www.skool.com/ai-ker-8924/classroom/38519dbf?md=03c1eae1a003453098dc0e72add098e2](https://www.skool.com/ai-ker-8924/classroom/38519dbf?md=03c1eae1a003453098dc0e72add098e2)","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-05-13T05:24:53.748396Z","updatedAt":"2026-05-23T14:49:39.587008Z","upvotes":53,"comments":25,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/41b3f3dbc23744f29d43e130467833f0aadc03456a984e46af945f64c283cafb.png","thumbnailLocal":"post-thumbs/bb1a0131665529e5.png","videoIds":"","attachments":"bf78e65ce47b488aa0befe75cae8d7e9","postUrl":"https://www.skool.com/ai-ker-8924/video-course-moi-higgsfield-canvas"},{"id":"1f3fe3ed73584cee9ca4a1dad16f8632","slug":"ai-worker-minh-tu-offline-cuoi-thang-nay-nhe","title":"🌴 AI Worker mình tụ offline cuối tháng này nhé?","content":"Mấy nay Sài Gòn vào hè nóng kinh khủng mn ơi. Bước ra đường là muốn quay xe về luôn 🥵\nMà ngày 19–20/05, Google I/O lại sắp drop một loạt đồ chơi mới nữa. Chưa kể nửa năm 2026 cũng sắp đi qua rồi — nhanh thật.\nMình nhìn lại thì thấy đây là một dịp quá hoàn hảo để…\n👉 AI Worker mình gặp nhau offline. Giải khát, update đồ chơi mới, chém gió chuyện sáng tạo nửa năm vừa rồi đã làm được gì kkk\n\nMình đang plan vào cuối tháng này.\nTối nay anh em rảnh thì vô meet cùng mình bàn sâu hơn nha — từ địa điểm, format đến những gì mình muốn cùng chia sẻ với nhau hôm đó.\n\nAi đang ở SG mà hứng thú thì drop \"1\" bên dưới để mình note lại nhé 🙌","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-05-15T06:28:39.870069Z","updatedAt":"2026-05-25T03:58:19.372689Z","upvotes":39,"comments":32,"thumbnailUrl":"https://image.video.skool.com/Mejr76srmegwbvUnuMveM4vOCmg9OgrBQhSeZMFupSw/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTMyNTEyOTE5LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiTWVqcjc2c3JtZWd3YnZVbnVNdmVNNHZPQ21nOU9nckJRaFNlWk1GdXBTdyIsIndpZHRoIjoxMjgwfQ.mfLK99d1KNEA3Szz0_m_fPTohT3rZ-3TDg7xjhWnBkLt1rw1Mgv3BGVbCJDC5UVFU-Iif-3yEuOE-7K51o0CGvGdnJR2r4qfx7nxMdDsqSP_47ATz2cavzADY7oH6OhiqX_wNMLAT16aCMD7q6S-6Ps-ox2ekbVftUfZgc4LGbxQq7fiAKhlTyx2SPeWd-m2dPL-lrHCvKuXoRcdhYFrZh4scJgPNlRU-T1IrD30yUZXjOgQ28WGVlmjEYD9W23Ac83Z46EtUsUxUjylWXsT2nR9bLdrVhqKcKzFHjiXo7E2_c3eHCwuTU09pIVL2wsJSVn8g7OCdOSJAjjpeW2wWg","thumbnailLocal":"post-thumbs/d8ad6bf5c51dcc4e.png","videoIds":"c2f21a5e96004e69aeeece107ca4cb77","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/ai-worker-minh-tu-offline-cuoi-thang-nay-nhe"},{"id":"c6ceedb6af654926bd05755ed5480fcb","slug":"update-course-phong-marketing-bang-ai-ai-agent","title":"Update course: PHÒNG MARKETING BẰNG AI (AI AGENT)","content":"Halo mn, T vừa update video course mới — và lần này thực sự khác. Mình vừa kết nối Higgsfield MCP vào Claude. Tức là toàn bộ phòng marketing giờ gói gọn trong 1 chat. Và nó đang ngày càng dễ dùng hơn rất nhiều so với trước đây!\n\nBạn nào đang làm content sản phẩm, brand owner, hoặc agency creator thì nên xem trước khi quy trình này phổ biến hơn. Workflow càng ít người biết thì lợi thế của mn càng lớn. Hy vọng nó giúp mn rút ngắn quy trình và tự tin nhận project bigger.\n\nLink video course: [https://www.skool.com/ai-ker-8924/classroom/38519dbf?md=3c1fc4a0059347ec990741b97d37fa6b](https://www.skool.com/ai-ker-8924/classroom/38519dbf?md=3c1fc4a0059347ec990741b97d37fa6b)\n\nDrop câu hỏi bên dưới — mình reply trực tiếp từng người trong tuần này. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-05-04T13:44:03.501381Z","updatedAt":"2026-05-11T02:45:10.78493Z","upvotes":52,"comments":39,"thumbnailUrl":"https://image.video.skool.com/x3iBOCRtiLC4LiL2AwUxsgz4wDTQ2Up1xh4GhPgSxPo/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTMxNTg4NjQzLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoieDNpQk9DUnRpTEM0TGlMMkF3VXhzZ3o0d0RUUTJVcDF4aDRHaFBnU3hQbyIsIndpZHRoIjoxMjgwfQ.T3BZvUR1aQMjuo-7P5VV6y9hbFP4VDJBteOp1r5rc7OBUrvqB1YAkeq4j3vwTEnMKCamCCzysFkqteqAA3YJQMy4lkzzDMBYak-xBRY7qmgpFxveWG1gPuJOZYbhaeBvKQbhcQTbP0INrslCFKG5D3SbU1YHI6Caf6q1-t2UcPnwKDdpa1DU_89X8fZCsH3rJjUoTxRs613HkigQ5JYCkRtahw4KD2X-bzUhXtoACV5peDdOROemzPlLmvVIuZwk6Ef-5OhcwxkFKrhJ6o-2rRA-Yw_fVkNbNJOX7Z_l9JAhDXGWXEDvmpH-_LfoApL48FTODUDwQH8KKH91Gw6HRg","thumbnailLocal":"post-thumbs/ce3d14966f91038a.png","videoIds":"62362fbc5b884c7db94a3ca30997709c","attachments":"498d4a5d78514bfdbcc250b1465b0cf7","postUrl":"https://www.skool.com/ai-ker-8924/update-course-phong-marketing-bang-ai-ai-agent"},{"id":"750570c1d9cd46868c2fbbd0c9a3057f","slug":"het-le-roi-anh-em-minh-quay-lai-uong-ua-thoi","title":"🚀 Hết lễ rồi, anh em mình quay lại đường đua thôi","content":"Halo cả nhà, kì nghĩ lễ của anh em thế nào rồi? Mình mới cũng vừa kết thúc kì lễ từ Trung Quốc về sau một loạt sự kiện lớn nhỏ — từ Google, đến talk ở trường đại học chính quy, workshop với Samsung, hay làm vài job nhỏ cùng Red Bull...\n\nMay thay chúng ta vẫn còn 2 ngày cuối tuần để dọn lại đầu, sắp xếp lịch và chuẩn bị tinh thần cho chặng mới. Anh em nào còn đang lưng chừng giữa \"nghỉ\" và \"bắt đầu\" thì tranh thủ 2 ngày này nhé — vì sắp tới sẽ rất sôi động.\n\nLý do là vì mấy tháng vừa rồi, các model \"khủng bố\" liên tục ra mắt:\n[ul][li]GPT 2 \\(image\\)[li]Seedance 2.0[li]Higgsfield x Canva[li]Higgsfield x Claude[li]Kling 4K\n... và còn nữa\n\nMỗi model mới ra là một lần workflow AI Creative phải viết lại. Cái hôm qua còn là \"best practice\" thì hôm nay đã có cách làm nhanh hơn, đẹp hơn, kiểm soát tốt hơn.\n👉 Vì vậy thời gian tới mình sẽ tập trung update các biến thể mới của workflow AI Creative trong cộng đồng — để anh em không bị lạc giữa rừng tool, mà có một cái khung rõ ràng để áp dụng vào job thật.\nNhân tiện, mình muốn nghe từ anh em một chút:\n\nĐịnh hướng của mn với AI Creative trong thời gian tới là gì?\n[ul][li]Đi sâu vào một ngách \\(AI MV, AI TVC, product ad, character...\\)?[li]Build portfolio để pitch agency / brand?[li]Hay đang muốn chuyển hẳn nghề sang AI Creative?\n\nDrop vài dòng bên dưới để cả cộng đồng cùng đọc nhé. Mình sẽ dựa vào đó để chọn workflow ưu tiên update trước.\nLàm nóng lại đi anh em. Chuẩn bị chiến. 🔥","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44b ECAP BUỔI MEET ONLINE TUẦN TRƯỚC","content":"Bạn nào lỡ hẹn với buổi gặp gỡ tuần rồi thì có thể xem lại recap tại đây nhé!\nTrong buổi meet, chúng ta đã:\n[ul][li]Cập nhật xu hướng thị trường AI Creative mới nhất[li]Chia sẻ kinh nghiệm thật từ các thành viên đã làm job AI ngoài thị trường[li]Trò chuyện về những thay đổi lớn trong ngành thời gian gần đây[li]\n🎉 Và đừng quên: Tối thứ 7 này là Year End Party của AI Worker!\nMột buổi offline ấm cúng, dễ kết nối và cực chất để:\n[ul][li]Gặp gỡ trực tiếp mình và các thành viên kỳ cựu[li]Trò chuyện chuyên sâu hơn về các hướng đi với AI Creative[li]Ăn uống, chill nhẹ và kết nối thực sự!\nAi chưa có vé thì tranh thủ nhanh tay nhé vì số lượng có hạn: [https://forms.gle/q8KB5oricMJVZBfM6](https://forms.gle/q8KB5oricMJVZBfM6)\n\nHẹn gặp lại mọi người tại party 🥂Cảm ơn cả nhà!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-01-19T12:44:13.218326Z","updatedAt":"2026-03-24T04:49:16.992699Z","upvotes":19,"comments":12,"thumbnailUrl":"https://image.video.skool.com/x6IMMso02Q02TZRchFUnGkZHj168pJ9O1jTRGDvil1cZU/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTIyNTEzMDUzLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoieDZJTU1zbzAyUTAyVFpSY2hGVW5Ha1pIajE2OHBKOU8xalRSR0R2aWwxY1pVIiwid2lkdGgiOjEyODB9.pnmC-Ri517xF3q_7odHLBPzp1PsN-oKntuE3vNrZtpASaqWJ7D3hoNeS63YbWj_Do-a6-VYNlnkRob-L0mQSAXIxej3cU-w7L5PZrMH-ReAoO3qybIQireQdduouEQCzi1Qvc4cXC2QeJ97jt9xoKiAiDCKhiMhph6uioux2mXrlN_eADowyJhc-AKOUtMKbrjPfabofJd41tpMgPTEBvUnzliGAJIu3tN_rzKVo7SgubcekjkTtQ-Ff2WmZ2q6ZGI6F_ab0HQAg5gT0GLQNPrLoaT5zguFj2slhlIft9DGu6J7jWvuBaVxwEtV2YphgCnIq8T19nABR0dvR91vpPw","thumbnailLocal":"post-thumbs/474d01aef8a64725.png","videoIds":"fc3f404127ef435287f5810c184984bf","attachments":"","postUrl":"https://www.sk wWC6nR-jL4Ur_2qTbA","thumbnailLocal":"post-thumbs/6fd61bddebe5a78b.png","videoIds":"78d34b93cae74874ad95ff8e3c4de210","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/recap-meeting-tuan-nay"},{"id":"836af0352d6147a9917c3d66ae458c03","slug":"recap-ai-worker-meet-toi-nay-phan-ghi-hinh-bi-loi-minh-tom-tat-bang-text","title":"🎬 Recap AI Worker meet tối nay — phần ghi hình bị lỗi, mình tóm tắt bằng text","content":"🎬 Recap AI Worker meet tối nay — phần ghi hình bị lỗi, mình tóm tắt bằng text\nHalo mn, buổi meet tối nay rất đông và nhiều câu hỏi hay. Tiếc là phần ghi hình bị lỗi giữa chừng nên mình chỉ up được 1 phần video lên cộng đồng thôi.\nBù lại, mình tóm tắt nhanh 3 tin AI Creative nổi bật tuần này mình đã chia sẻ trong meet — và các câu hỏi cực thú vị từ anh em.\n\n[ul][li]Google Omni — đang được đồn đoán sẽ xuất hiện\n\nTestingCatalog \\(2/5\\) phát hiện Google đang test \"Omni model\"\nNative multimodal: sinh video kèm spatial audio đồng bộ. Tạo cảnh sấm sét → tự ra tiếng sấm và mưa khớp hình\nReveal chính thức tại Google I/O 2026 sắp tới\n👉 Đây sẽ là đối trọng trực tiếp với Seedance 2.0 từ ByteDance. Cuộc đua audio-visual sync chính thức bắt đầu — và mình nghĩ đây mới là chiến trường thật của AI video sắp tới, không còn chỉ là độ đẹp khung hình nữa.\n\n[ul][li]Midjourney V8.1 + V8.2 sắp ra\n\nV8.1 đã có trên Discord và web — sharper, HD rõ hơn, đặc biệt với SREF và Moodboard\nV8.2 với hệ thống aesthetics mới dự kiến cuối tháng 5\nNiji 7 đã có Personalization + Moodboards\nWeb personalization interface mới với image-driven profiles\n\nPhần thú vị nhất tối nay là các câu hỏi anh em đặt ra:\n❓ Thoại hỏi: \"Nếu AI càng ngày càng dễ dùng thì là bất lợi hay có lợi cho mình?\"\nMình nghĩ câu này đáng để cả cộng đồng cùng ngẫm. Khi AI dễ dùng, rào cản kỹ thuật biến mất. Cũng có nghĩa là taste, tư duy sáng tạo, và workflow mới là thứ phân biệt creator giỏi với người dùng phổ thông. Tool ai cũng cầm được. Nhưng output có concept, có cảm xúc, có ngôn ngữ riêng thì không phải ai cũng làm được. Đó cũng chính là lý do AI Worker tồn tại.\n❓ Nam Nguyễn hỏi: Workflow storyboard với Seedance 2.0\nHướng đi cực đáng đào sâu. Seedance 2.0 mạnh ở motion control và character consistency. Kết hợp với storyboard truyền thống thì pre-vis trở nên nhanh khủng khiếp — agency hoặc indie filmmaker đều dùng được.\nMình sẽ dành 1 buổi riêng để đi sâu workflow này. Anh em nào quan tâm drop comment bên dưới để mình prep nội dung sát hơn nhé.","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-05-08T14:33:45.320515Z","updatedAt":"2026-05-19T04:35:01.762431Z","upvotes":23,"comments":14,"thumbnailUrl":"https://image.video.skool.com/VuuvddEmQtJVsmZcAp1FiPe02LB7Dh1k9ATjJOSr4pSI/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTMxOTM3MjI1LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiVnV1dmRkRW1RdEpWc21aY0FwMUZpUGUwMkxCN0RoMWs5QVRqSk9TcjRwU0kiLCJ3aWR0aCI6MTI4MH0.gct6TVHNRVYbs4PZYdMIe8BS5PjN7cDoC17fjDv5P2qWZEgBi483145YAfLPPvblaWLjV_CmiYqHO1xABPY78cZpXnycJAO0RVJF6RMMGHBF5_EDCcPKaUh53VdjO_0Zm5fvOcgnDGYYLSPITrz3miCPjSeJlL1ukCAIW2CgMOKD1YKqwOCNjLtzf9GV_v4GpaHhyrkERqYVYaBOtvuwTvmRMsArBPrYOBTy1qp30RzxSzuajXWrOMKuQWrEijyRHSrQbkFKQCp-wpImG8ZGbELk9wjar8Zw9EqSXHXbJ1G8XtwWe6NZEkVIAnCVnl9R-rf24yUhaXoVq6F_4C8JYw","thumbnailLocal":"post-thumbs/8192f088581ef204.png","videoIds":"05f042789f6049c9b59270cc0d8297fb","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/recap-ai-worker-meet-toi-nay-phan-ghi-hinh-bi-loi-minh-tom-tat-bang-text"},{"id":"9b6d0940a9044005bdbbd0d5d1aa4488","slug":"recap-meeting-weekly-chuan-bi-sau-le","title":"Recap Meeting Weekly - Chuẩn bị sau lễ!","content":"Halo anh em, cuối tuần vui vẻ nha, Toàn tranh thủ tổng hợp thị trường và tình hình cộng đồng để mn catchup trước khi  đầu tiên được tiếp cận. T cũng được là một trong những người đầu tiên được sử dụng Seedance 2.0 cách đây hơn 1 tháng trước, và cũng rất vui vì sau nhiều lần thử nghiệm thì Model này cuối cùng cũng drop thị trường VN.\nSeedance 2.0 được đánh giá là bước nhảy vọt về chất lượng video — và khi nó nằm ngay trong CapCut, tức là anh em không cần app riêng, không cần credit phức tạp.\n👉 Đây là lần đầu tiên một AI video model hàng đầu được phân phối trực tiếp qua một editing tool mà cộng đồng mình đang dùng hàng ngày.\n\n📍 Update từ cộng đồng AI Worker\nTuần này mình đi công tác Hà Nội nguyên tuần — speaker tại Yango Live Ads, gặp gỡ anh em ngoài Bắc\nTin vui:\nTháng 4 mình sẽ tổ chức buổi offline tại Sài Gòn 🔥\nAnh em SG và các tỉnh lân cận chú ý theo dõi để đăng ký sớm nha.\n\nGóc nhìn của mình:\nSora ra đi — Seedance 2.0 vào CapCut, Dreamina\nTất cả xảy ra trong một tuần.\nAI video đang không còn là cuộc đua \"ai generate đẹp hơn\" nữa.\nNó đang trở thành cuộc đua ai tích hợp vào workflow của người dùng tốt hơn.\nVà người thắng sẽ không phải tool xịn nhất — mà là tool anh em thực sự dùng được mỗi ngày.\nAnh em đang dùng AI video tool nào trong workflow hiện tại?\nDrop xuống dưới để mình biết nhé 👇","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-29T04:06:24.551945Z","updatedAt":"2026-03-31T14:39:30.28541Z","upvotes":33,"comments":22,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/4254f76a8e2f4315ba2f76a9aa245ff9fce0e59b2074447990543226fc3b8709.jpg","thumbnailLocal":"post-thumbs/0b01253fe9923578.jpg","videoIds":"","attachments":"beea8da5fd9a4da19dfa49ec81308715,20abb68cf6f248e7b4d66b85abea2038,870745f2261f4dc5a6b5310795faad58,c02576c82fd944d1800eb06b1e0ae962,7b4381c283304f548caab845513f9e89,e80824acd0424abbae10d6a2476d30ff","postUrl":"https://www.skool.com/ai-ker-8924/ai-creative-weekly-tuan-122026-222903"},{"id":"eb956b967c604b5f87d5189d3c68faf0","slug":"recap-meeting-toi-qua-tuan-nay-co-nhieu-thu-hay-lam-mn-oi","title":"📋 Recap Meeting tối qua — Tuần này có nhiều thứ hay lắm mn ơi","content":"Với anh em nào bận chưa join được tối qua, đây là những gì đã diễn ra 👇\n\nTuần vừa rồi thật sự là một tuần thú vị của ngành AI Creative.\nMình và cả nhóm đã dành một phần lớn buổi meeting để nhìn lại những xu hướng AI marketing nổi lên trong tuần — từ cách các brand đang ứng dụng AI vào production quảng cáo, đến những công cụ mới đang thay đổi quy trình làm việc của người làm creative.\nKhông khí tối qua rất sôi nổi vì mọi người đều có gì đó để chia sẻ.\n\nPhần mình thấy ý nghĩa nhất tối qua:\nCác thành viên lâu năm trong nhóm đã chia sẻ thật về hành trình của họ — cụ thể là làm sao để bắt đầu xây dựng personal brand với AI, cách lên kế hoạch cá nhân theo từng giai đoạn, và những bài học từ những lần thử sai thực tế.\nKhông phải lý thuyết. Là trải nghiệm thật.\nVà phần Q&A cuối buổi cũng có rất nhiều câu hỏi hay — từ chuyện chọn niche, đến cách đo lường tăng trưởng khi mới bắt đầu.\n\nMình sẽ tổng hợp thêm các nội dung chi tiết hơn trong thời gian tới.\nCòn với anh em đã tham gia tối qua — cảm ơn mn đã giữ energy xuyên suốt buổi. Những buổi như vậy là lý do mình xây cộng đồng này 🙏\n\nAnh em nào có câu hỏi còn dang dở từ tối qua thì drop bên dưới nhé. Mình sẽ trả lời từng người 👇\nKeep going AI Worker. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-21T07:25:53.201357Z","updatedAt":"2026-04-13T16:00:27.285272Z","upvotes":32,"comments":5,"thumbnailUrl":"https://image.video.skool.com/2i1k01wN4T58OelQdVpkpCi5rsSs2rr7565nR9acG3wU/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI3NzY0MzU IaJeD9tFjKDhTWSTNIOrq1y2iomx9mKk5GbzY1c6L4YvH6JDObHoyYNjkeopiMR78ptjqMTfhC8BZtaYQqvaOe8WQ","localPath":"9.1.1 - t_i_sao_l_i_ph_i_ch_i_game_trong_ai-ker_.mp4"}],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"1. Luyện tập là cách duy nhất để nâng trình\"},{\"type\":\"hardBreak\"},{\"type\":\"text\",\"text\":\"Không có lý thuyết nào giỏi bằng việc thực hành. Game giúp bạn biến kỹ năng thành phản xạ.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"2. Có đề bài, có deadline = có động lực tạo ra sản phẩm\"},{\"type\":\"hardBreak\"},{\"type\":\"text\",\"text\":\"Không còn trì hoãn. Có chủ đề rõ ràng để bắt tay làm ngay.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"3. Được học từ sản phẩm của người khác\"},{\"type\":\"hardBreak\"},{\"type\":\"text\",\"text\":\"Xem các video AI từ các thành viên khác giúp mở góc nhìn \\u0026 sáng tạo hơn.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"4. Cơ hội được feedback, sửa bài \\u0026 cải thiện\"},{\"type\":\"hardBreak\"},{\"type\":\"text\",\"text\":\"Game không chỉ thi mà còn là nơi để bạn nhận góp ý, biết mình đang làm đúng hay sai.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"5. Cơ hội nhận phần quà từ các thương hiệu AI lớn\"},{\"type\":\"hardBreak\"},{\"type\":\"text\",\"text\":\"Tham gia là có thể nhận \"},{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"credit miễn phí\"},{\"type\":\"text\",\"text\":\" từ các nền tảng AI nổi bật trên thị trường.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"6. Cơ hội được chọn vào team chính thức của AI-KER or các Brand lớn\"},{\"type\":\"hardBreak\"},{\"type\":\"text\",\"text\":\"Tụi mình đang tìm các thành viên giỏi, năng động từ các game để mời cộng tác sâu hơn.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"7. Được ghi nhận trong cộng đồng\"},{\"type\":\"hardBreak\"},{\"type\":\"text\",\"text\":\"Game là nơi để bạn “lên sóng”, thể hiện năng lực thật sự của mình!\"}]},{\"type\":\"horizontalRule\"},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"👉 \"},{\"type\":\"text\",\"marks\":[{\"type\":\"bold\"}],\"text\":\"Tham gia game = đầu tư vào kỹ năng AI của chính bạn.\"}]}]","domContent":"<div class=\"styled__EditorInnerWrapper-sc-1cnx5by-1 htfMPD\"><div class=\"styled__EditorContentWrapper-sc-1cnx5by-2 bXbSDs\"><div contenteditable=\"false\" translate=\"no\" class=\"tiptap ProseMirror skool-editor2\"><p><strong>1. Luyện tập là cách duy nhất để nâng trình</strong><br>Không có lý thuyết nào giỏi bằng việc thực hành. Game giúp bạn biến kỹ năng thành phản xạ.</p><p><strong>2. Có đề bài, có deadline = có động lực tạo ra sản phẩm</strong><br>Không còn trì hoãn. Có chủ đề rõ ràng để bắt tay làm ngay.</p><p><strong>3. Được học từ sản phẩm của người khác</strong><br>Xem các video AI từ các thành viên khác giúp mở góc nhìn &amp; sáng tạo hơn.</p><p><strong>4. Cơ hội được feedback, sửa bài &amp; cải thiện</strong><br>Game không chỉ thi mà còn là nơi để bạn nhận góp ý, biết mình đang làm đúng hay sai.</p><p><strong>5. Cơ hội nhận phần quà từ các thương hiệu AI lớn</strong><br>Tham gia là có thể nhận <strong>credit miễn phí</strong> từ các nền tảng AI nổi bật trên thị trường.</p><p><strong>6. Cơ hội được chọn vào team chính thức của AI-KER or các Brand lớn</strong><br>Tụi mình đang tìm các thành viên giỏi, năng động từ các game để mời cộng tác sâu hơn.</p><p><strong>7. Được ghi nhận trong cộng đồng</strong><br>Game là nơi để bạn “lên sóng”, thể hiện năng lực thật sự của mình!</p><hr contenteditable=\"false\"><p>👉 <strong>Tham gia game = đầu tư vào kỹ năng AI của chính bạn.</strong></p></div></div></div>"},{"title n\"Căn nhà đầu tiên\" .\n\"Hành trình về nhà\" .\n\"Ước mơ trong tầm tay\"\n\n🔥 Đây là brief thật – cơ hội thật:\nMột sân chơi nghiêm túc dành cho những ai muốn đưa AI sáng tạo ra thị trường. Tập trung vào insight khách hàng, truyền cảm hứng qua hình ảnh và câu chuyện.\n\nDeadline của dự án này là ngày 16/11/2025 - mọi người sắp xếp lịch để chiến nhé!!!\nChi tiết hơn về đề bài: [https://docs.google.com/document/d/1heX7iOqkKo7pXfoxyDcgVim1tQknFnDsFWXm_JlESyg/edit?usp=sharing](https://docs.google.com/document/d/1heX7iOqkKo7pXfoxyDcgVim1tQknFnDsFWXm_JlESyg/edit?usp=sharing)\n\nMọi người có câu hỏi gì có thể để ở phần cmt!!! Chúc mọi người enjoin game!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-11-04T06:19:47.470623Z","updatedAt":"2026-03-09T15:55:21.536828Z","upvotes":81,"comments":108,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/57254573d13e47b5bb76d0039f14dd3678ce8464e9f944be8fead3a6cab52e92.png","thumbnailLocal":"post-thumbs/c7207eb15d7b43f1.png","videoIds":"","attachments":"1fb7edceffaf4b7cadb482cdcdf23c3c","postUrl":"https://www.skool.com/ai-ker-8924/game-3-techcombank-x-ai-ker-community"}]},{"title":"Game 4: AI Yourself","url":"https://www.skool.com/ai-ker-8924/classroom/75a6e1f6?md=1454ef1e0280435396f9b5a8ddfa4ba1","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\"}]","domContent":"","posts":[{"id":"d275fe30f591491583c23f67d70efc05","slug":"game-4-ai-yourself-tao-dau-an-ca-nhan-voi-ai","title":"🎮 GAME 4: AI YOURSELF – TẠO DẤU ẤN CÁ NHÂN VỚI AI","content":"Đầu tuần đầy hiệu suất với con Game 4 nhé cả nhà! Như lần meetoff trước, các anh trong ngành đã chia sẻ về tính quan trọng của Portfolio trong thị trường AI Creative rất mới này. T quyết định tổ chức 1 game khá nhẹ nhàng nhưng cực thú vị và liên quan - đó là:\nGame 4: AI Yourself tạo ra bộ ảnh mang đậm dấu ấn cá nhân – vừa dùng cho portfolio, vừa thể hiện phong cách riêng của bạn trong thế giới sáng tạo. Các hình tham gia sẽ được cùng lên một tấm hình lớn và trưng bày ở AI hub của cộng đồng trong tương lai gần!\n\n📌 Yêu cầu bài dự thi:\nTạo 2 hình ảnh AI về chính bạn, gồm:\n\n1️⃣ Ảnh Nghệ thuật \\(Artistic Vibe\\)\nẢnh thể hiện phong cách riêng, vibe bạn muốn truyền tải.\nTự do chọn concept: fantasy, retro, futuristic,... miễn là đúng “chất” của bạn.\n\n2️⃣ Ảnh Hồ sơ \\(Formal Portrait\\)\nChân dung rõ mặt, ánh sáng studio, nền trắng hoặc màu trung tính.\nDành để làm hồ sơ cá nhân, portfolio chuyên nghiệp.\n\n\\(Ai nhiều ảnh muốn show quá thì cứ để ở dưới cmt bài thi của mình ha \\)\nTiêu đề phải có cụm từ \"Game 4\" và đăng trong mục Creative work🎨\n\n📅 Thời gian:\nBắt đầu: Hôm nay\nKết thúc: 23h59 ngày Thứ Hai, 01/12/2025\n\n🎁 Giải thưởng:\n1 người thắng cuộc sẽ nhận:\n👉 Đăng ký công cụ AI bất kỳ trong 1 tháng do AI Worker tài trợ \\(tối đa $50\\)\n\n📚 Không biết bắt đầu từ đâu?\nVào ngay khóa học “AI Yourself” trong mục Classroom, bạn có thể dụng bất kì model AI nào tuỳ thích để thể hiện \\(Midjourney, Nano Pro, Seedream, Higg,...\\).\nRất mong chờ các hình ảnh đầy tính cá nhân hoá của thành viên AI-Woker 🙌","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-11-24T05:56:08.119703Z","updatedAt":"2026-02-24T15:06:04.224066Z","upvotes":72,"comments":74,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/4310cc2e8dd14d08ae6d32352b5f1e8b6314443d705942e9b0f2618e2cd0d299.png","thumbnailLocal":"post-thumbs/9bd0eac8409e8fc5.png","videoIds":"","attachments":"278d40354ce84175a4f2ccffca62a534,0561f7de984b436e9c5c097fa7172316,1bde28113e8a4abfad7be6931e61cb66","postUrl":"https://www.skool.com/ai-ker-8924/game-4-ai-yourself-tao-dau-an-ca-nhan-voi-ai"},{"id":"fe8f45941f1d4cebbb71205595b15e75","slug":"chuc-mung-khai-pham-nguoi-chien-thang-game-4-ai-yourself","title":"🎉 Chúc mừng Khải Phạm – Người chiến thắng Game 4: AI Yourself!","content":"Bài dự thi của [@Khải Phạm](obj://user/fac5db566ffb4a1ea622702479217939) thật sự rất \"đã\" — không chỉ bởi độ đẹp, mà vì sự nguyên bản, sáng tạo, dựa trên chính trải nghiệm cá nhân từ nhỏ và phong cách đặc trưng của Khải.\nTrong thời đại AI, việc giữ được \"chất riêng\" lại càng quý giá – và Khải đã làm rất tốt điều đó.\n\n🏆 Phần thưởng dành cho Khải: Free bất kỳ model AI nào trong 1 tháng – xứng đáng cho 1 bài thi mang nhiều cảm hứng.\n\n👏 Và cũng xin chúc mừng toàn bộ anh em AI Worker đã tham gia Game 4 – góp mặt trong bảng Billboard ver 1.\nBảng này sẽ được in ra & trưng bày tại không gian AI Worker Hub trong thời gian tới.\nAi chưa có dịp tham gia? Đừng lo – ver 2 sẽ sớm mở, và còn nhiều cơ hội khác dành cho mọi người.\n\nGame 4 là một game \"nhẹ nhàng – vui vẻ – mang tính cá nhân cao\".\n🔥 Và giờ thì… chuẩn bị tinh thần cho Game 5 – siêu thú vị luôn. Ai sẵn sàng rồi? Comment lên cho nóng nào! 💥","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-05T12:59:07.074478Z","updatedAt":"2026-03-11T12:39:46.637939Z","upvotes":36,"comments":47,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/c3383a3081cf42829fac08f663a20c6f18c533b8336b486e89fb00dbb331d46b.png","thumbnailLocal":"post-thumbs/5f1fb5b9c7416830.png","videoIds":"","attachments":"cae3c5aad4e24acd933a53a4dc7c5643,e50f432a6fcb48b5bb8e67039dff70c2","postUrl":"https://www.skool.com/ai-ker-8924/chuc-mung-khai-pham-nguoi-chien-thang-game-4-ai-yourself"}]},{"title":"Game 5: Coca-cola Christmas Ads","url":"https://www.skool.com/ai-ker-8924/classroom/75a6e1f6?md=75488ca9669d4806924bda37098150ed","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\"}]","domContent":"","posts":[{"id":"7f80d1cab26c4a878b6b3285e57279ba","slug":"game-5-remake-ai-coca-cola-ads-mua-giang-sinh","title":"🎄 GAME 5: REMAKE AI COCA-COLA ADS MÙA GIÁNG SINH  🎄","content":"Hello mọi người,\nChắc hẳn nhiều bạn đã từng xem qua video quảng cáo Coca-Cola bằng AI năm nay – nếu chưa, có thể xem lại ở dưới post để cảm nhận.\n\n🎯 Nhiệm vụ lần này:\nRemake lại video quảng cáo Coca-Cola Giáng Sinh, nhưng bằng chính ý tưởng của bạn và các công cụ AI hiện đại hơn như NanoBanana Pro, Kling O1, Storyboard ltx... \\(ít ràng buộc hơn rất nhiều so với sản phẩm gốc\\).\n\n📌 YÊU CẦU BÀI THI:\nThời lượng video: 30–60 giây.\nBắt buộc:\n[ul][li]Phải có chai Coca-Cola rõ ràng trong video.[li]Phải có tinh thần Giáng Sinh: tuyết, đèn lấp lánh, ông già Noel, không khí ấm áp,...[li]Ý tưởng: câu chuyện có chiều sâu, cảm xúc hoặc hài hước, bất ngờ \\(tùy bạn chọn\\).\n\n📅 THỜI HẠN NỘP BÀI:\nTừ hôm nay đến hết ngày 20/12/2025.\n\n🎁 GIẢI THƯỞNG:\n🎉 Free 1 tháng sử dụng bất kỳ model AI nào \\(tối đa $50\\)\n\nCách phát triển trong thời đại AI này là dành thời gian để hiểu nó, và các Game AI-Ker tạo ra để chúng ta cùng nhau đạt điều đó. Rất mong chờ được thấy các bài thi của nhà mình 🙌","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-07T06:17:08.122831Z","updatedAt":"2026-03-11T12:41:01.780237Z","upvotes":84,"comments":66,"thumbnailUrl":"https://i.ytimg.com/vi/Yy6fByUmPuE/hqdefault.jpg","thumbnailLocal":"post-thumbs/a066e71936336154.jpg","videoIds":"","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/game-5-remake-ai-coca-cola-ads-mua-giang-sinh"},{"id":"23b24f8e1e854c0eb836915e99cd7510","slug":"ket-qua-game-5-thang-tran-x-coca-cola-christmas","title":"🎉 KẾT QUẢ GAME 5 – THẮNG TRẦN X COCA-COLA CHRISTMAS 🎄","content":"Chúc mừng [@Thắng Trần](obj://user/3bf92c8d9c15446db979b48240af1496) đã mang đến một phiên bản remake TVC Coca-Cola rất sáng tạo và tinh tế – không chỉ đúng tinh thần đề bài mà còn mang đậm cá tính riêng, cho tất cả lên trực thăng và đi phát quà kkk.\n\n🏆 Bài thi thể hiện kỹ năng dàn dựng hình ảnh với AI cực kỳ tốt, ánh sáng, chuyển cảnh, màu sắc đều có chiều sâu – không thua gì TVC gốc! Chúc mừng Thắng đã win 01 suất đăng ký một model AI bất kỳ trên nền tảng Web!\n\nBên cạnh đó, dù không đạt giải chính thức \\(video vượt 2phút\\), bài dự thi của [@Nguyen Lam](obj://user/e6745e49d63e428e9aef8a8f74e5163a) đã được Kling AI repost lại trên kênh chính thức của họ! Một chiến thắng đáng tự hào cho cộng đồng AI-Ker 🏆🔥\n\n✨ Tất cả những bạn đã tham gia Game lần này đều để lại dấu ấn riêng. T thật sự thấy được sự phát triển rõ rệt qua từng video, từng khung hình. Và đặc biệt, những bài thi lần này hoàn toàn xứng đáng nằm trong portfolio cá nhân của bạn!\n\n🎅 Cuối cùng, chúc cả nhà Giáng sinh an lành, và sẵn sàng đón chào năm mới cùng cộng đồng AI Worker! Chuẩn bị đón bữa tất niên AI-Ker sắp tới nhé 😎","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-23T15:33:39.531729Z","updatedAt":"2026-01-08T15:43:16.548963Z","upvotes":34,"comments":38,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/3ca04d8bb0d948209cf2ec5828afcba86fdef723770b41af8a05d674c0aa27ab.png","thumbnailLocal":"post-thumbs/ccafda69abb5994b.png","videoIds":"","attachments":"f93bff0434464a10b716e4af273f4e3b,f7e13de13e20468d9e3e4e330efa9434","postUrl":"https://www.skool.com/ai-ker-8924/ket-qua-game-5-thang-tran-x-coca-cola-christmas"}]},{"title":"Game 6: Recap AI 2025","url":"https://www.skool.com/ai-ker-8924/classroom/75a6e1f6?md=1891aac2abb7412ebafa5dbd068ffd7d","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\"}]","domContent":"","posts":[{"id":"c0bcf9c5304841f989ca7ad8a0b81278","slug":"game-6-nhin-lai-hanh-trinh-ai-creative-2025-cua-ban","title":"🎬 GAME 6: NHÌN LẠI HÀNH TRÌNH AI CREATIVE 2025 CỦA BẠN?","content":"Hello cả nhà AI-Worker, Chúng ta đang ở những ngày cuối cùng của năm 2025 – một năm đặc biệt với rất nhiều biến chuyển trong thế giới AI Creative. Mình biết, nhiều bạn đã có những lúc thấy mệt mỏi, thấy mình \"tụt lại\", không đủ giỏi, không bắt kịp tốc độ phát triển quá nhanh của AI.\n\nNhưng tin mình đi: bạn đã tiến rất xa ❤️\nVà có lẽ, bạn chưa nhận ra điều đó… cho đến khi bạn thử nhìn lại hành trình của chính mình.\n\nVậy nên, Game 6 lần này chúng ta sẽ cùng làm điều đó:\nNHÌN LẠI – và ĂN MỪNG 🙌\n\n🎯 Thể lệ:\nTạo một video ngắn, gồm 2 phần:\n[ol:1][li]Tác phẩm AI đầu tiên bạn từng làm trong năm 2025[li]Tác phẩm AI mới nhất của bạn gần đây\nVà cuối cùng đôi chút cảm nhận của các bạn về hành trình này!\n\nThời lượng: Khoảng 30–60 giây, có thể edit đơn giản hoặc lấy template trên CapCut.\nPro tips: chọn nhạc sao cho có đoạn chuyển contract cao để highlight những tác phẩm cuối năm, sẽ thu hút người xem hơn nhiều đấy! \\([Bài T sử dụng đây](https://www.youtube.com/shorts/AGnIsu8FsJk)\\)\nNội dung: Không cần hoàn hảo, chỉ cần là thật – là bạn\n\n📅 Deadline: 05/01/2025\n🎁 Phần thưởng: 1 tháng dùng bất kỳ AI web nào bạn chọn \\(dưới $50\\)\nVà đừng quên: tag ít nhất 1 người bạn trong cộng đồng để cùng tham gia thử thách này!🫂\n\nT đi trước game này rồi nhé, nên mạnh dạn thách cả cộng đồng @AI Worker join game này 🙌\n\nHãy nhìn lại để thấy: Bạn đã trưởng thành ra sao trong năm qua.\nVà năm mới – mình tin bạn sẽ còn bùng nổ hơn thế nữa.\n🔥 Let’s go, AI-Worker!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-28T07:19:20.557541Z","updatedAt":"2026-03-11T12:42:36.831212Z","upvotes":75,"comments":73,"thumbnailUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/56acb8131fd949c8ba02ce9acf444fdb8a68dbe995b94b71be7153bfb7199e4e.png","thumbnailLocal":"post-thumbs/531513fd2d352778.png","videoIds":"8161051d36d842f1a0baf0897ad3be5e","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/game-6-nhin-lai-hanh-trinh-ai-creative-2025-cua-ban"},{"id":"75706542e3a94e3cbc1b279cc4449941","slug":"chuc-mung-winner-game-6-quoc-anh-vu","title":"🎉 CHÚC MỪNG WINNER GAME 6 – QUỐC ANH VŨ 🎉","content":"Xin chúc mừng người chiến thắng Game 6: [@Quoc Anh Vu](obj://user/cd14903a41554c659f973c6b07e1e9a2)\nThật sự rất vui khi thấy hành trình của Quốc Anh với AI Creative phát triển rõ rệt qua video Game 6.\n\nT vẫn nhớ khi bạn mới vào cộng đồng AI Worker – và bây giờ nhìn lại, những sản phẩm AI của bạn không chỉ đẹp hơn mà còn sâu sắc hơn, chỉnh chu hơn. Điều mình ấn tượng nhất là bạn thực sự quan tâm tới việc phát triển “con mắt thẩm mỹ\" và cải thiện từng ngày. Đó chính là tinh thần của một AI-Ker thực thụ!\n\n🏆 Với chiến thắng Game 6, bạn đã nhận được phần thưởng: 1 tháng sử dụng miễn phí bất kỳ công cụ AI Web Tool nào bạn chọn.\n\n🎁 Và đặc biệt hơn – vì đây là Game cuối cùng của năm 2025 – bạn sẽ là người đầu tiên nhận món quà giới hạn: AI Worker Cap \\(mẫu giới hạn, đang được sản xuất hoàn thiện\\). T sẽ gửi quà này kèm với những bạn chiến thắng các game trước \\( [@Nguyen Le](obj://user/b3ccbf4d82ac45668cb1a62b68816a89) [@Lucas Zorro](obj://user/dfabeac8383841679a235486492f2a33) [@Nguyen Lam](obj://user/e6745e49d63e428e9aef8a8f74e5163a) [@Khải Phạm](obj://user/fac5db566ffb4a1ea622702479217939) [@Thắng Trần](obj://user/3bf92c8d9c15446db979b48240af1496) \\), Tất cả những ai đã join đủ 5 games \\(ai đủ 5 game nhắn tin T check nhá kk\\) & game tương lai nữa nha! Một món đồ để AI-Ker chúng ta nhận diện nhau trên đường kkk \\(thank u [@Khải Phạm](obj://user/fac5db566ffb4a1ea622702479217939) đã thiết kế nón cho cộng đồng\\)\n\n🔥 Game 7 sẽ sớm được khởi động trong tuần này.\nVà mình tin rằng: “mỗi video các bạn làm ra chính là cách các bạn trưởng thành cùng AI”.\nReady chưa AI-Kers?","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-01-07T11:22:12.757785Z","updatedAt":"2026-01-19T02:11:37.484689Z","upvotes":77,"comments":62,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/e3b4ec99c074469786b8e1ed3a37e0c25342bdf303e445cb97697017c4aaa3e4.jpg","thumbnailLocal":"post-thumbs/066cccb520e915f7.jpg","videoIds":"","attachments":"c5a9b636ee4c48d7973ecca1c0aeead7","postUrl":"https://www.skool.com/ai-ker-8924/chuc-mung-winner-game-6-quoc-anh-vu"}]},{"title":"Game 7: TVC Sản phẩm trong suốt","url":"https://www.skool.com/ai-ker-8924/classroom/75a6e1f6?md=94d48d90ad874c4ebf7fcbeb1a203844","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\"}]","domContent":"","posts":[{"id":"9d9b75b20361446e8656aab05fc0a128","slug":"game-7-tvc-san-pham-trong-suot","title":"🎯 GAME 7: TVC SẢN PHẨM TRONG SUỐT","content":"Hello cả nhà! Game 7 đã chính thức mở!\nLần này, chúng ta sẽ cùng luyện tập kỹ năng Workflow Transparent Glass – một trong những lesson mới được update mới và cực kỳ quan trọng để rèn luyện khả năng làm visual cho sản phẩm.\n\n🧊 Bạn có thể làm bất kỳ sản phẩm nào có chất liệu kính trong suốt – không chỉ ô tô đâu nhé! Sản phẩm công nghệ, Iphone, packaging, vật dụng... đều được. Làm sao cho showcase được bên trong sản phẩm.\n🔥 Link lesson: [https://www.skool.com/ai-ker-8924/classroom/38519dbf?md=d66ccee90b5c4bcfae863e37b871fbb8](https://www.skool.com/ai-ker-8924/classroom/38519dbf?md=d66ccee90b5c4bcfae863e37b871fbb8)\n\n📈 Game này sẽ rèn được khả năng ứng dụng AI trong visual hoá sản phẩm, không chỉ bên ngoài mà còn bên trong nữa, giúp mn làm chủ tốt hơn khả năng kiểm soát sản phẩm.\n\n🎁 Giải thưởng cho người chiến thắng:\n\n[ul][li]1 tháng sử dụng miễn phí bất kỳ AI Web Tool \\(giá dưới $50\\)\n\n[ul][li]1 chiếc AI Worker Cap – phiên bản giới hạn \\(limited edition\\)\n\n⏰ Deadline: 20.01.2026\n\nLưu ý:\n✅ Mỗi lần bạn hoàn thành 1 game là bạn đang tiến xa hơn một bước!\n🎉 Khi bạn tham gia đủ 5 game, bạn sẽ nhận được AI Worker Cap chính thức từ team!\n\n📌 Thông báo thêm:\nBuổi meeting tuần này sẽ diễn ra vào 19h tối nay \\(thứ 5 thay vì thứ 6\\)– mình phải đổi lịch vì cuối tuần này có lịch meeting với những người cực kì sáng tạo ở Đà Lạt, sẽ update sau khi buổi gặp đó kết thúc kkk \\(mn check lịch meet hằng tuần tại mục Calendar nhé\\)\n\n👉 Let’s go AI-Kers! Cùng nhau luyện tập, nâng level và tạo thật nhiều sản phẩm chất lượng nào!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-01-08T09:04:37.164632Z","updatedAt":"2026-03-10T06:35:42.184106Z","upvotes":98,"comments":59,"thumbnailUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/d4979ee915f44cf397e1272960defef44bcfc2f872424973a618dd9cde097c8c.png","thumbnailLocal":"post-thumbs/1ac15b5e3e683496.png","videoIds":"502a81946df54b1bbc84a5ffed255652","attachments":"70fbb6342d33423d80997d419e203898","postUrl":"https://www.skool.com/ai-ker-8924/game-7-tvc-san-pham-trong-suot"},{"id":"c221b7058edb4bafbab617d445f1fe3b","slug":"xin-chuc-mung-nguoi-chien-thang-game-7-ba-loc","title":"🎉 Xin chúc mừng người chiến thắng Game 7 – BÁ LỘC! 🎉","content":"Game 7 lần này thật sự khiến mình bất ngờ – có rất nhiều thành viên tham gia và gửi về những video chất lượng cao. Mọi người đã tiến bộ rất nhanh, cả về kỹ thuật lẫn tư duy sáng tạo. Rất nhiều bài thi thật sự ấn tượng và sáng tạo 🔥\n\nNhưng như thường lệ, người chiến thắng chỉ có ùa Tết 2026!\n\nTết là dịp đặc biệt nhất trong năm với người Việt – là hành trình trở về, là những bữa cơm gia đình, là cảm xúc lắng đọng mà không gì có thể thay thế.\n\nVà Game 8 lần này sẽ là cơ hội để bạn kể lại câu chuyện Tết trong bạn, qua một TVC hoặc video ngắn \\(ít nhất 30s\\) mang màu sắc cảm xúc – có thể là:\n✨ Hành trình về quê ăn Tết\n✨ Câu chuyện sum họp gia đình\n✨ Hay đơn giản là một khoảnh khắc nhỏ nhưng đáng nhớ trong mùa lễ\n\n👉 Chủ đề mở, cảm xúc thật, có thể lồng ghép sản phẩm, brand hoặc không\n👉 Hãy đưa câu chuyện cá nhân của bạn vào video – đó chính là thứ khiến tác phẩm chạm đến người xem.\n👉 Cuối video nhớ để lại một thông điệp nhẹ nhàng – mình có đính kèm ví dụ để mọi người tham khảo.\n\n🎁 Giải thưởng:\n– 1 tháng sử dụng công cụ AI bất kỳ dưới $50\n– 1 chiếc mũ AI Worker Cap phiên bản giới hạn\n-- 1 Chiếc gối hỏi chấm được tài trợ bởi [@Dương Trung Nhân](obj://user/ee2ab87a77204d14945b3834a3a09474) [@Bá Lộc](obj://user/366a8250fb5d453da45c3780605f0aaf) \\(quá xịn kk\\)\n\n🗓 Deadline: 12/02/2026 \\(25 âm lịch\\)\nBạn đã sẵn sàng chinh phục thử thách cảm xúc với AI chưa?\n\nLet’s go – và nhớ tag thêm bạn bè cùng tham gia nhé!\nAI không lạnh lùng – khi người dùng có trái tim. ❤️","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-01-26T05:36:17.441029Z","updatedAt":"2026-03-10T06:35:35.564572Z","upvotes":100,"comments":84,"thumbnailUrl":"https://i.ytimg.com/vi/C96_QvWEIbM/hqdefault.jpg","thumbnailLocal":"post-thumbs/40e1abe07b726eda.jpg","videoIds":"","attachments":"4169a29c2ec44b52a0edce5e8c36cf35","postUrl":"https://www.skool.com/ai-ker-8924/game-8-tet-trong-toi"},{"id":"9916d5fddfac4b87bf36dbcf30524b08","slug":"chuc-mung-ha-nguyen-winner-game-8","title":"🏆 CHÚC MỪNG HA NGUYEN – WINNER GAME 8!","content":"Game 8 thật sự là một thử thách thú vị, và [@Ha Nguyen](obj://user/ba5a88047e324a48803fbafe8ef48238) đã mang đến một bài thi rất ấn tượng.\n\nConcept rõ ràng, phong cách cartoon độc đáo, storytelling mạch lạc và cách bạn ấy sử dụng AI Creative để kể câu chuyện thật sự rất cuốn hút. Không chỉ là kỹ thuật, mà là cách xây dựng vibe và cảm xúc xuyên suốt video – đó là điều khiến bài thi nổi bật.\n\nMột lần nữa, chúc mừng Ha Nguyen! 👏\nBạn nhận được:\n– 1 tháng subscription bất kỳ công cụ AI \\(tối đa $50\\)\n– 1 chiếc AI Worker Cap vol.1 phiên bản giới hạn\n\nĐây cũng là game cuối cùng của 2025, và mình rất tự hào khi nhìn thấy sự trưởng thành của mọi người qua từng game.\n\n🚀 Bước sang 2026, chúng ta sẽ bắt đầu Game 9 với một thử thách còn “đã” hơn nữa.\n\nChuẩn bị tinh thần nhé.\nAI Worker – chúng ta không chỉ chơi game, chúng ta đang build skill thật sự.","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-02-21T05:52:58.3896Z","updatedAt":"2026-03-10T06:35:36.909751Z","upvotes":32,"comments":22,"thumbnailUrl":"","thumbnailLocal":null,"videoIds":"","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/chuc-mung-ha-nguyen-winner-game-8"}]},{"title":"GAME 9: THE STORY OF THE HORSE","url":"https://www.skool.com/ai-ker-8924/classroom/75a6e1f6?md=bb5b3ad9496643ddbe1cbff508787219","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\"}]","domContent":"","posts":[{"id":"1225d0c1630f4f88b0891e75d20d1989","slug":"game-9-the-story-of-the-horse","title":"🐎 GAME 9 – THE STORY OF THE HORSE","content":"Năm con Ngựa đã bắt đầu.\nĐầu năm thường là lúc thị trường chưa quá bận rộn. Ít deadline hơn. Ít áp lực hơn.\nVà đây chính là thời điểm đẹp nhất để… xây tư duy.\nVì vậy mình tạo ra Game 9 – The Story of The Horse.\n\n🎬 Challenge:\nTạo một AI Video tối thiểu 30 giây kể câu chuyện về “con ngựa của bạn” trong năm nay.\nKhông cần quảng cáo cho Brand\nKhông cần phức tạp\nChỉ một điều duy nhất:\n👉 Xây dựng concept - Tập trung vào mặt hình ảnh nhất quán mô tả một chú ngựa và các bạn mô tả câu chuyện của mình qua hình ảnh.\n\nCon ngựa của bạn là gì?\n[ul][li]Một chú ngựa trắng tượng trưng cho sự bứt phá?[li]Một chiến mã đen mang tinh thần mạnh mẽ?[li]Một chú ngựa hoang đại diện cho tự do?[li]Hay một con ngựa mệt mỏi nhưng đang đứng dậy lần nữa?\n\nBạn có thể kể về:\n[ul][li]Hành trình vươn lên[li]Tốc độ và tham vọng[li]Sự bền bỉ[li]Hoặc một năm “phi nước đại”\n\nĐây không phải game kỹ thuật.\nĐây là game để bạn rèn tư duy concept và storytelling.\nBạn có thể sử dụng workflow mình đã chia sẻ để phát triển ý tưởng và biến nó thành hình ảnh sống động.\n\n🎁 Reward:\n[ul][li]1 tháng sử dụng bất kỳ AI web tool \\(< $50\\)[li]1 chiếc AI Worker Cap phiên bản giới hạn\nDeadline: 07/03/2026\n\nĐầu năm không phải để chạy theo model mới.\nĐầu năm là để xây direction.\nMình rất háo hức được xem “con ngựa 2026” của từng người trong cộng đồng này.\nSẵn sàng chưa?\nLet’s build. Let’s run. 🐎🔥","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-02-24T06:28:24.357242Z","updatedAt":"2026-03-12T16:47:27.985689Z","upvotes":127,"comments":76,"thumbnailUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/080ac87cea5e4b47bd9108bc4f4ba93aaf45c3970fd3492a927b095d404ad679.png","thumbnailLocal":"post-thumbs/3e78c0297b92150b.png","videoIds":"b595bf03007144dd9110610f28280b18","attachments":"c56ac292c6534d15b68cbf227bc61997","postUrl":"https://www.skool.com/ai-ker-8924/game-9-the-story-of-the-horse"}]},{"title":"GAME 10: AI MUSIC VIDEO","url":"https://www.skool.com/ai-ker-8924/classroom/75a6e1f6?md=13313cd7cf58461496c642e6b3ddcfcf","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\"}]","domContent":"","posts":[{"id":"29e07949686b4700915973325ffb4d4a","slug":"game-10-ai-music-video-challenge","title":"🎬 GAME 10 – AI MUSIC VIDEO CHALLENGE","content":"Game 10 lần này chúng ta sẽ thử một thử thách rất thú vị: làm một đoạn AI MV - Hãy lôi con người nghệ sĩ của mn ra nào kkk\n\nThử thách:\nTạo một đoạn MV bằng AI dài ít nhất 30 giây.\nBạn có thể chọn bất kỳ bài hát nào – có thể là bài bạn thích, hoặc bài nhạc bạn tự sáng tạo đều được.\n\nMục tiêu của game này không chỉ là làm video đẹp, mà là để luyện các skill quan trọng khi làm AI video:\n\n[ul][li]Kể câu chuyện bằng các shot video[li]Giữ nhân vật và bối cảnh đồng bộ[li]Kết hợp hình ảnh với âm nhạc để tạo cảm xúc\n\nĐây cũng là cơ hội để cộng đồng hiểu thêm về gu âm nhạc và cá tính sáng tạo của bạn.\n\nKhông cần phải quá phức tạp.\nChỉ cần một concept rõ ràng và một câu chuyện thú vị.\n\n🏆 Phần thưởng\n\n[ul][li]1 tháng sử dụng bất kỳ AI model / tool nào \\(< $50\\)[li]1 chiếc AI Worker Cap\n\nDeadline: 27/03\nRất háo hức được xem AI MV của mọi người.\nLet’s create. 🎧🔥","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-13T07:57:53.322066Z","updatedAt":"2026-04-29T06:58:13.584368Z","upvotes":140,"comments":73,"thumbnailUrl":"https://image.video.skool.com/tkOFeve2ZvXtI00Bnt4HqAtL4l9VCCG3AcY9BYsaKqKo/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI3MTAyODY5LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoidGtPRmV2ZTJadlh0STAwQm50NEhxQXRMNGw5VkNDRzNBY1k5QllzYUtxS28iLCJ0aW1lIjoxLjkzNSwid2lkdGgiOjEyODB9.a8Gqk82FaDr3tAXUZ-SteRH0zz-c5X30R2xb4Wv6qERVh_9ZBo77tG2NdeMvqrkeocMqC-Ar-JmnrftT3XZmwTx-UK1pIAF-428rff1gHtJIXbxb2h1dtvl-EKJ8wBzuknCgCZpMMwL9T0-hwimbdr80ddzEdGT4WHc6c9zBJsssvugli8K3bt-SOEsXKBgnNzgcNLgsPepsfz2bVWNWz1tJj7_K8EXdkSggqDste9vcnAAPOI_1tEq a5594318e282","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\"}]","domContent":"","posts":[{"id":"0b6cc4dc31ae432d8809ecb56cca4993","slug":"game-11-ai-ugc-challenge-ai-hoa-hang-tui","title":"🎮 GAME 11 – AI UGC CHALLENGE: AI HOÁ HẰNG TÚI","content":"Game này khác mọi game trước.\nLần này mn không làm để luyện tập — mn làm để giao nộp cho client thật.\n\nBối cảnh:\nGame 11 được đồng hành bởi Accesstrade — nền tảng KOC & affiliate lớn nhất Việt Nam với hơn 1.5 triệu publisher.\nVà KOL xuất hiện trong game lần này là [Hằng Túi](https://www.facebook.com/share/1B6eKGVsvK/?mibextid=wwXIfr) — một trong những KOC bán hàng uy tín và có lượng follow lớn trên thị trường, đã ký văn bản đồng ý cho phép AI hoá hình ảnh và giọng nói.\n\nThử thách:\nDùng AI để tái tạo khuôn mặt Hằng Túi, rồi tạo một video UGC ngắn dưới 60 giây — trong đó Hằng Túi \\(bản AI\\) đang giới thiệu / bán 1 sản phẩm bất kỳ trong danh sách sản phẩm thật của cô ấy.\nDanh sách sản phẩm: [xem tại đây](https://docs.google.com/document/d/1NtwINvOTzvcBS7rUTqb9yET4slb-FacV/edit)\nMn tự chọn sản phẩm mình muốn làm. Không có sản phẩm bắt buộc.\n\nMục tiêu của game không chỉ là video đẹp — mà là video trông như UGC thật có thể dùng được ngoài thị trường:\n[ul][li]Hình ảnh KOL được AI hoá tự nhiên, không bị uncanny[li]Nội dung thuyết phục, đúng tone bán hàng[li]Short-form dưới 60 giây, xem xong muốn mua\n\n🎙️ Bonus \\(không bắt buộc\\): Clone giọng Hằng Túi\nNếu mn muốn đẩy video lên một level nữa — có thể clone luôn giọng nói của Hằng Túi để voiceover\nMình đã chuẩn bị sẵn file voice mẫu để anh em train: [tại đây](https://drive.google.com/drive/folders/1uUvhyKiqD1rDLkp8wpXeZyv_YIkTnxqQ)\nPhần này hoàn toàn optional\n\n🏆 Phần thưởng\n[ul][li]$200 tiền mặt 🤑[li]1 chiếc AI Worker Cap[li]Video của mn sẽ được đăng tải trực tiếp trên kênh chính thức của Hằng Túi — đây là portfolio thật, không phải concept\n\nSubmit: Post video trực tiếp lên cộng đồng Skool tiêu đề có text \"Game 11\"\nDeadline: 20/4\n\nGame này là bằng chứng rõ nhất cho thứ mình hay nói:\nAI Worker không học AI để biết — mà để làm được việc thật.\nLet's go. 🔥","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-04T04:47:55.765514Z","updatedAt":"2026-04-26T12:05:56.976364Z","upvotes":112,"comments":49,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/8fd2da82cd264b72b17a8189674de24ebcbbecb5e4c2446cb82d42cedd7e6aed.jpg","thumbnailLocal":"post-thumbs/74970e412ffc5237.jpg","videoIds":"","attachments":"e63c89011cf14ef8aea9e794d0dbff32,59f52fe9d03a40e48dade30da374fc17,967e61c191574021a8c5c70803fe9004,5b779c7b81264391a51755b24163e3c0,8ce29f19f0154ac79068516b85594b3f","postUrl":"https://www.skool.com/ai-ker-8924/game-11-ai-ugc-challenge-ai-hoa-hang-tui"}]},{"title":"GAME 12: CINEMATIC SHORT STORY","url":"https://www.skool.com/ai-ker-8924/classroom/75a6e1f6?md=13c05963d5f7455db2e11aac8b8cf437","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\"}]","domContent":"","posts":[{"id":"2dcf0bfd76784b119d07013a9021405a","slug":"game-12-cinematic-short-story-challenge","title":"🎬 GAME 12 – CINEMATIC SHORT STORY CHALLENGE","content":"Halo cả nhà! Đầu tuần sau lễ, mn nạp năng lượng bằng game này đi nào.\nVới mình, Game 12 vừa thú vị, vừa thử thách nhất từ trước đến giờ. Mình không cho brief cụ thể — chỉ cho 3 reference, anh em tự build câu chuyện riêng. Cộng đồng mình rất sáng tạo, cùng 1 set ref nhưng mỗi người sẽ ra 1 câu chuyện khác nhau.\n\nĐây cũng là sân để anh em flex sức mạnh của các model AI mới nhất.\n\n3 references \\(đính kèm bên dưới\\):\n1️⃣ Location — Neon Noir Tokyo alley\n2️⃣ Character — Cyber robot\n3️⃣ Object — Đồng hồ cầm tay\n\nThử thách:\nTạo 1 short film cinematic dùng cả 3 ref.\nLocation = color grade xuyên suốt\nRobot bắt buộc xuất hiện\nĐồng hồ phải có vai trò trong câu chuyện\nStoryline + độ dài tự do\n\nLưu ý là có thể Lập nhóm thi được \\(optional\\)\n\nSkill luyện qua game này:\n[ul][li]Kể chuyện từ 3 element rời rạc[li]Giữ tone + color nhất quán[li]Sound design + cinematography portfolio-ready\n\nTiêu chí chấm: sound design, cinematography, creativity, storytelling.\n🏆 Phần thưởng:\n[ul][li]$50 cash[li]1 chiếc AI Worker Cap Vol1\nWinner được ghim lên IG của cộng đồng trong 1 tháng \\(có hơn 100k lượt xem và tương tác mỗi tháng\\)\n\nDeadline: 20/05\nSubmit có tiêu đề Game 12\nSản phẩm cuối có thể đi thẳng vào portfolio. Let's create. 🔥","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-05-04T03:19:51.786471Z","updatedAt":"2026-05-23T08:45:15.397002Z","upvotes":82,"comments":45,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/c30a623845e04142bb76592760b06a067f83c05c410041dcbefc8d55707f8fc4.png","thumbnailLocal":"post-thumbs/ece0261a5f7ff36d.png","videoIds":"","attachments":"6db2e56e51574af4ac74c614404ae64e,bbc114e0dbff4308b13894b2a604787a,2b53f41fcd124013aee59bcd0332de1a,301441f313c04223905b3ab4a72c8c13","postUrl":"https://www.skool.com/ai-ker-8924/game-12-cinematic-short-story-challenge"},{"id":"28ac0a0e6fab4e5bac62c95fe768f31a","slug":"ket-qua-game-12-nguoi-chien-thang-a-co-mat","title":"🏆 Kết quả Game 12 — Người chiến thắng đã có mặt!","content":"Mình phải nói thật — Game 12 là một trong những game khiến mình khó chốt kết quả nhất từ trước đến giờ.\nKhông phải vì thiếu bài đẹp.\nMà vì có quá nhiều bài đẹp.\n\nSố lượng submission lần này không chỉ nhiều — mà chất lượng đồng đều ở mức cao hiếm thấy trong cộng đồng. Mình đọc/xem từng bài và thấy anh em đang tiến bộ rõ rệt. Đó là điều mình tự hào nhất.\n\nVà sau nhiều ngày cân nhắc...\n🥇 Chúc mừng [@Lê Thoại](obj://user/7fcbf1cf1f3a4cc38ff1cd327530220d) — người chiến thắng Game 12!\nBài của Thoại gây ấn tượng không chỉ ở kỹ thuật, tính nhất quán từ đầu đến cuối mà còn là những pha hành động + build thế giới điện ảnh. Rất xứng đáng.\nVà phần thưởng là $50 + 1 nón AI Worker ver 1\n\nNhưng mình cũng muốn nói thêm:\nNhững anh em còn lại — bài của các bạn cũng rất xứng đáng đứng top và mình tin sau game này ae cũng đã rút đc kha khá bài học cho mình. Game 12 chứng minh AI Worker đang ở một level khác rồi.\n\nTiếp tục làm, tiếp tục chia sẻ.\nCộng đồng mạnh là vì có những người như anh em. 🔥\n\nGame 13 bật mí là chúng ta sẽ cùng luyện - AI Workflow - thứ mà bất kì người làm nghề với AI cần phải trải nghiệm qua!\nKeep going AI Worker. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-05-23T08:45:09.375695Z","updatedAt":"2026-05-26T17:32:23.693048Z","upvotes":40,"comments":31,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/1457f7fc36ef4feda8f1ae5d18166dd029b6af4245d54a5db38518f0d10b724f.png","thumbnailLocal":"post-thumbs/02f9541e12cebff5.png","videoIds":"","attachments":"cf2174e3484b40e0a5de24f9a8f58b68","postUrl":"https://www.skool.com/ai-ker-8924/ket-qua-game-12-nguoi-chien-thang-a-co-mat"}]},{"title":"GAME 13: AI TVC WORKFLOW","url":"https://www.skool.com/ai-ker-8924/classroom/75a6e1f6?md=f2c83e4b7728480480d05cfbf5cca0ea","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\"}]","domContent":"","posts":[{"id":"013c644f991a45d0bc9e3c7941747e05","slug":"game-13-ai-tvc-workflow-challenge","title":"🎬 GAME 13 – AI TVC WORKFLOW CHALLENGE","content":"Hello tuần mới cả nhà, thử thách lại tới đâyyy. Sau 12 game, mình tin anh em đã sẵn sàng cho một thử thách mang tính \"chốt kỹ năng\". Game này không khó về tool. Nó khó về tư duy.\n\nThử thách: Tạo một video TVC ngắn \\(<30s\\) bằng AI cho bất kỳ sản phẩm / dịch vụ / người mẫu nào bạn chọn. Điều kiện bắt buộc: nộp kèm workflow trên nền tảng notebase \\(Higgsfield Canvas, Magnific, Weavy...\\) như video/hình workflow của Toàn.\nTại sao lần này phải là notebase? Khi mn dùng các tool riêng lẻ, mn chỉ thấy từng mảnh ghép. Khi mn build workflow trên notebase, mn nhìn được cả bức tranh — input nào → đi qua bước nào → ra output nào. 👉 Đó là khoảng cách giữa người dùng AI và người điều phối AI.\n\nMục tiêu game này không chỉ là một TVC đẹp, mà là để luyện:\n[ul][li]Tư duy hệ thống — nhìn cả pipeline thay vì từng tool rời[li]Khả năng tập trung — gắn nhiều bước thành 1 dòng chảy có lý do[li]Kiểm soát output — biết chính xác mỗi bước đang phục vụ kết quả cuối thế nào\nĐây là game mang tính chốt kỹ năng. Nếu mn pass được, mn đang ở một level rất khác so với 95% người dùng AI ngoài kia — những người mới chỉ dừng ở \"gõ ChatGPT tạo hình\".\n\nVà cũng đừng ngại nếu workflow của bạn chưa hoành tráng, kết quả mới quan trọng\n\nPlatform gợi ý:\n[ul][li]Higgsfield Canvas — giá rẻ, dễ tiếp cận \\(mình recommend thử đầu tiên\\)[li]Magnific \\(Space, Freepik cũ\\) hoặc Weavy nếu mn đã quen\nChưa biết notebase là gì? Xem video này trước rồi vào game: 🔗 [https://www.skool.com/ai-ker-8924/classroom/38519dbf?md=03c1eae1a003453098dc0e72add098e2](https://www.skool.com/ai-ker-8924/classroom/38519dbf?md=03c1eae1a003453098dc0e72add098e2)\n🏆 Phần thưởng\n[ul][li]Tài trợ 1 tháng sử dụng bất kì nền tảng AI web nào \\($50\\)[li]Nón AI Worker ver 1\nDeadline: 10/06/2026\n\nSau Game 12, mình thấy anh em đã đủ \"ngấm\" để chơi cái này. Không phải lúc đứng nhìn nữa — đây là lúc build cái workflow đầu tiên của bạn.\nLet's build. 🔥\n\np/s: Và cũng đừng quên hnay là ngày cuối deal giảm giá 900k dành riêng cho ae AI Woker khoá [AIFlow ](https://aiflowc.com/courses/creative-process-01)trong ngành sáng \\(code AIWORKER\\).","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d94                     item.textContent = lesson.title;
                    item.dataset.lessonIndex = allLessons.length - 1;
                    
                    item.addEventListener('click', () => {
                        document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));

                        group.classList.remove('collapsed');
                        loadLesson(lesson);

            group.appendChild(lessonsContainer);

            nav.appendChild(group);

            // Create Home Grid Card
            const card = document.createElement('div');
