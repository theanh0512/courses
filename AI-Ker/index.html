:"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-02-28T14:04:02.954254Z","updatedAt":"2026-04-10T18:39:36.078388Z","upvotes":52,"comments":24,"thumbnailUrl":"https://image.video.skool.com/csM02ftmV8Uke6kL2ppjFgFLXbK6BGrlW1fu48B8vOTU/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI1OTczODQyLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiY3NNMDJmdG1WOFVrZTZrTDJwcGpGZ0ZMWGJLNkJHcmxXMWZ1NDhCOHZPVFUiLCJ3aWR0aCI6MTI4MH0.abHkK_AR-ElZgm8MNl9UVw_cvi6kd3loU4uDmNXps1gXiZH1s359DcA11l-bzFk74rUpkcgQoUFJ2fMGLr4nC-hT70jYE5kot78d7yrge3pv74E-qQoQbqYDQSHCt66n8FfPN60iJNSvE_yMKmelCJRxMS665pJNL5_G7KBp5deie61cRAw3vvbz9flJPOpbQn2h1_TuBCeouPx0eIu7KqUDwTls8Iy9VdqrOPijHDoIMzWnd9LjhdjOdtcZzbf-zt8C3kAk90V3uQzmFvD7z2qxv8QhzzzlJvz46SNk-emn77eyGU0Q09bt5vl1Dm8Tw20KlPH-phrU6BEsxUoylA","thumbnailLocal":"post-thumbs/6da59f2f9ffd2792.png","videoIds":"da3da6131f304351b03a591c9363db8a","attachments":"a352904c6e8d482a9ea7705073a0cd57,2cdaf327e57e4307840d106dcc53e63e,f7e4755e615243b0923205f2b74a46d5,c53c7430aabd444cb0e98b4f9895ddbb","postUrl":"https://www.skool.com/ai-ker-8924/new-course-coming-so-hoa-ban-thantraining-lora-updated-version"},{"id":"2e8129f18ba44c65a5d7bcc32f6f3893","slug":"hanh-trinh-mang-ai-len-tivi-trong-em-giao-thua","title":"HÀNH TRÌNH MANG AI LÊN TIVI TRONG ĐÊM GIAO THỪA","content":"Hola cả nhà AI Worker,\nChắc hẳn dịp Giao thừa vừa rồi, nhiều người đã thấy màn trình diễn của ZA.I – chàng ca sĩ AI đứng chung sân khấu hòa giọng cùng các Anh Trai thật trên Sóng 26 của DatVietVAC. Hôm nay, mình chính thức lên sóng video \"Behind The Scenes\", kể lại toàn bộ hành trình team đã thực chiến với project khủng này như thế nào.\n\nTạo một đoạn video AI lướt TopTop là một chuyện. Nhưng để AI xuất hiện cạnh người thật, khớp với ánh sáng trường quay đa hướng và đạt chuẩn broadcast trên truyền hình quốc gia lại là một bài toán hoàn toàn khác.\n\nTrong video này, mình không rải hoa hồng. Mình muốn chia sẻ với anh em \"mặt tối\" của việc chạy deadline AI:\n\n[ul][li]Áp lực On-set: Cảm giác bước vào trường quay của DatVietVAC với hàng trăm nhân sự tấp nập. Mọi thứ phải tính toán cực chuẩn ngay từ source quay thật để AI có thể xử lý mượt mà sau đó.\n\n[ul][li]Cuộc chiến đếm ngược: Khi đồng hồ báo còn 10 ngày, rồi 7 ngày... team phải test hàng loạt tech-stack. \n\n[ul][li]Hiểu và chấp nhận hạn chế của AI - Thời điểm cách đây 3 tháng trước thì chưa có quá nhiều model mạnh như đợt bây giờ và ứng dụng cho các khách hàng lớn cần tính bảo mật nên các opensource phải tính toán kĩ lưỡng khi sử dụng cũng là một khó khăn làm cho AI không đã nhất có thể.\n\n[ul][li]Teamwork là cốt lõi: Quá trình chốt 3 options để ra final model Z.AI, thiết kế outfit, xử lý AI motion capture, và những đêm cắm trại studio đến 3-4h sáng cận Tết cùng anh Lâm Vinh để comp màu, upscale cho chuẩn truyền hình. \\(50fps - 4k\\)\n\n💡 Góc nhìn đúc kết sau dự án:\nSóng 26 không chỉ là một tiết mục giải trí. Nó là một bước thử nghiệm thực tế và khốc liệt cho AI Creative tại Việt Nam. Trải qua project này, mình càng tin chắc một điều: AI không thay thế con người. Nó chỉ thực sự có ý nghĩa và tạo ra \"magic\" khi được đặt đúng vai trò, dẫn dắt bởi tư duy sáng tạo và sự khắt khe của con người.\n\nMọi người có câu hỏi gì cứ để ở phần bên dưới nhé","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-02-27T05:41:49.966392Z","updatedAt":"2026-04-10T18:39:37.350516Z","upvotes":70,"comments":32,"thumbnailUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/7eff05d2e0324103b6be2cea047d4128d8afe03e9613429083e9d8f239920a77.png","thumbnailLocal":"post-thumbs/784f290487185d6a.png","videoIds":"79d4dd318b5941e0b9668ceaf1e63766","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/hanh-trinh-mang-ai-len-tivi-trong-em-giao-thua"},{"id":"95b1aa59d40e44449d748b53b0465ef1","slug":"seedance-20-con-quai-vat-moi-cua-ai-video-a-xuat-hien","title":"🔥 Seedance 2.0 – con quái vật mới của AI Video đã xuất hiện","content":"Chào anh em AI Worker, đầu năm khai máy xong rồi thì giờ mình update nhẹ một “con hàng” rất đáng chú ý.\nTrước Tết mình được access sớm một model Video AI mới của ByteDance. Nhưng mình không share ngay vì không muốn anh em đang nghỉ Tết lại FOMO 😅\nGiờ thì có thể nói rồi.\n\nVì sao Seedance 2.0 đáng chú ý?\n\nSau khi test, mình thấy đây không phải nâng cấp nhỏ, mà là bước nhảy vọt:\n\n✅ Nhập đa nguồn cùng lúc: text + tối đa 9 ảnh + 3 video + 3 audio\n✅ Tạo hình ảnh và âm thanh đồng bộ \\(lip-sync + sound effect tự động\\)\n✅ Giữ nhân vật, ánh sáng, bối cảnh nhất quán xuyên suốt nhiều cảnh\n✅ Mô phỏng vật lý rất mượt \\(va chạm, chuyển động nhanh, vải bay…\\)\n✅ Edit video mạnh: thay nhân vật, đổi cốt truyện, extend video…\nNói đơn giản: cảm giác như có một “đạo diễn AI” ngồi cùng mình.\n\nCách dùng có gì hay?\nĐiểm mình thích nhất là hệ thống tag @\nBạn upload tài nguyên lên rồi viết kiểu:\n\nDùng @Image1 làm nhân vật chính, copy camera từ @Video1, dùng @Audio1 làm nền.\n\nPrompt nên viết theo cấu trúc:\nGóc máy + Chủ thể + Ánh sáng + Camera movement + Mood\nAnh em làm quảng cáo, storyboard, hay muốn biến ảnh tĩnh thành video cinematic – cái này cực kỳ đáng thử.\n\nTương lai AI Video?\nSeedance 2.0 cho thấy một điều rõ ràng:\n🎬 Kỷ nguyên “đoàn làm phim một người” đã bắt đầu.\nChi phí giảm cực mạnh. Tốc độ tăng cực nhanh.\n\nNhưng đi kèm là câu chuyện bản quyền, IP, nhân vật nổi tiếng… chắc chắn sẽ còn rất nóng.\n\nHiện tại vẫn đang rollout dần, chưa mở full global.\nAnh em nào test được rồi thì comment chia sẻ trải nghiệm nhé.\nSóng AI Video đang lên rất nhanh.\nNhưng nhớ: tool mạnh tới đâu, tư duy và workflow của mình mới quyết định level.\n\nAI Worker – sẵn sàng chưa? 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-02-23T04:46:08.32356Z","updatedAt":"2026-04-10T18:39:38.656167Z","upvotes":48,"comments":21,"thumbnailUrl":"https://image.video.skool.com/WHWHhXj6i1U1T02YRIBYKKjFNvKDvKAGrtcShXmZCaPs/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI1NTA4MzY4LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiV0hXSGhYajZpMVUxVDAyWVJJQllLS2pGTnZLRHZLQUdydGNTaFhtWkNhUHMiLCJ3aWR0aCI6MTI4MH0.MIWb2M5ujS6-p5j2vzV6tObrO7GSWABjwlIp09H_AIrBTZTjaFHKpahEucJMM48iNXk0koVzimH60wJeKqzMeXt8N4sP4A-bj4ZYPTKfWGkNFjN_UoMtzP8Ngi6FJz2Fe0LyUiHCTvVSUvG5EbzgWqvbju83_mkNv4DfOEJXe_tKgaF6kPeTCXwik7IiyqATLpBCHY9xrDZd0sPUsiY2U5kWFJVPaMPK-jX02Tx_haonn3I7SlVNYk7ZbZ2oG8BL8wB3Hx7JXT0gD97QS4dCveNihuuOZUPdMXryRDRnVR2ltam4vkUYA4-C7n64edGzzAP1ZxbBkyEXhJ01hNSKAA","thumbnailLocal":"post-thumbs/e2aa62c5c2a0efe2.png","videoIds":"5364ab0ed30044fba53ebd0d8025c215,cdf592e74cae42a7a15113b2596b874e,5c7c865ac2bd4478bd5115d5ce736d77","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/seedance-20-con-quai-vat-moi-cua-ai-video-a-xuat-hien"},{"id":"6fbe9ff168314139825fed6646933c1c","slug":"welcome-2026-nam-con-ngua-ai-creative-a-bat-au","title":"🐎 WELCOME 2026 – NĂM CON NGỰA AI CREATIVE ĐÃ BẮT ĐẦU!","content":"Chúc mừng năm mới cả nhà AI Worker!\n\nBước sang 2026, mình có vài điều thật sự muốn chia sẻ với mọi người – vừa là cập nhật, vừa là định hướng cho hành trình tiếp theo của chúng ta.\n\n1️⃣ Cập nhật đầu năm – Một khởi đầu đầy tự hào\n\nNgay trong đêm giao thừa, khi cả nước đang countdown, chúng ta đã có một dấu ấn rất đặc biệt.\n[ul][li]Dự án kết hợp cùng VieON đã tạo ra ZA.I – một AI Singer song ca cùng 2 ca sĩ thật trên sóng truyền hình. Điều đó không chỉ là một sản phẩm thú vị, mà là minh chứng rõ ràng:\nAI Creative đã bắt đầu có những bước đi táo bạo vào ứng dụng thực tế, chạm tới đại chúng \\(đương nhiên vẫn cần thời gian để adapt và model cần tốt hơn nữa - TaiOn đã thực hiện dự án này với các model đã cũ cách đây nhiều tháng trước\\).\n\n[ul][li]Mình cũng rất vinh dự khi được đại diện cộng đồng AI Creative Việt Nam chia sẻ trên truyền hình. Sau đó là rất nhiều cơ hội kết nối mở ra cho AI Worker.\n\nVà mình muốn nói trước:\n👉 Năm 2026 này, mình sẽ chủ động kết nối nhiều project chất lượng hơn vào cộng đồng.\nAnh em hãy sẵn sàng nhé!\nCảm ơn tất cả những lời chúc mừng của mọi người. Thật sự rất trân trọng.\n\n2️⃣ Khai máy đầu năm – Bắt đầu bằng hành động\n\nHôm nay và ngày mai là ngày đẹp để khai máy đầu năm.\nMỗi người hãy tạo một visual AI bất kỳ và post vào cộng đồng với tiêu đề:\n“Khai Máy Đầu Năm”\nKhông cần cầu kỳ.\nChỉ cần bạn bắt đầu.\n\nMột năm mạnh mẽ với AI Creative bắt đầu từ một hành động nhỏ.\n\n3️⃣ Định hướng 2026 – Thực chiến AI Creative\n\nNăm nay, mình sẽ mở một series mới:\nThực chiến AI Creative.\n\nMình sẽ chia sẻ chi tiết các dự án làm việc thật với client:\n– Model đã sử dụng\n– Workflow triển khai\n– Cách làm việc với client\n– Những lưu ý quan trọng\n– Và tư duy phát triển bền vững với AI\n\nTập đầu tiên sẽ chính là case VieON.\nAi hóng series này, comment phía dưới nhé.\n\nCuối cùng, mình chúc tất cả chúng ta một năm 2026 bùng nổ –\nbùng nổ như cách AI Worker được nhắc đến trên TV đêm giao thừa.\n\nChúng ta không chỉ dùng AI.\nChúng ta đang tạo ra một thế hệ sáng tạo mới.\n\nChúng ta là AI Worker. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-02-20T10:46:30.99013Z","updatedAt":"2026-04-10T18:39:40.521462Z","upvotes":45,"comments":55,"thumbnailUrl":"https://i.ytimg.com/vi/aNmdnD1Ql6c/hqdefault.jpg","thumbnailLocal":"post-thumbs/935010fabac0d1ac.jpg","videoIds":"","attachments":"d74c29977beb4d75af40a46d32dd37cd,48aef4b6277544ce80ddfb0cb526fa2e,f85215ac5b7940979cbf3ab83a0938a4,0449a8d60d7041529fd02bc0b254e002","postUrl":"https://www.skool.com/ai-ker-8924/welcome-2026-nam-con-ngua-ai-creative-a-bat-au"},{"id":"0d863df11d5546428eaffa1c4dda2ca8","slug":"taion-va-ai-worker-xuat-hien-trong-song-26-vao-em-giao-thua","title":"📺 TaiOn và AI Worker xuất hiện trong Sóng 26 vào đêm giao thừa","content":"T muốn chia sẻ một tin rất đặc biệt với cả nhà:\nAI Creative và cộng đồng AI Worker sẽ được nhắc đến trong chương trình truyền hình lớn \"Sóng 26\" – phát sóng vào đêm countdown giao thừa Tết năm nay trên VieON & sóng truyền hình quốc gia! Và T sẽ đóng góp 1 tiết mục khá thú vị vào chương trình cùng AI!!!\n\n✨ Đây là một dự án vô cùng đặc biệt mà mình vinh dự được hợp tác cùng VieON. Mình không thể chia sẻ hết quá trình, nhưng ctrinh sẽ đề cập: \"AI Worker, AI Creative được nhắc đến và tạo dấu ấn riêng\" trong chương trình này.\n\n🧢 T rất vui khi đại diện thị trường AI Creative, thật sự tự hào khi nhìn thấy AI Creative từng bước bước ra thế giới thật, chạm vào những sân khấu lớn – không chỉ là “chơi AI” nữa mà là “tạo nên tác động thật”. Và không quên mention tới cộng đồng chúng ta.\n\n👉 Nhớ bật tivi hoặc vào VieON lúc countdown để xem \"Sóng 26\" và ủng hộ cho T nhé cả nhà AI-Woker kkk \\(có thể tag tui zào story nếu mn thấy, T sẽ reup lại hết nà\\)\n—\n📣 Hẹn gặp bạn trên sóng truyền hình – đêm giao thừa nhé!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-02-14T05:24:09.167858Z","updatedAt":"2026-04-10T18:39:41.439316Z","upvotes":61,"comments":42,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/2d218bbb9ec14ba8b083ebd78c9fb43f9ec1927dd0ff411bbb17566f14bf2371.jpg","thumbnailLocal":"post-thumbs/1e3a1920e76b6fd9.jpg","videoIds":"","attachments":"06397ac2870441e5acbe3edbcc1edd8f,58bd3f8d8052496198c88fcf23fe4e58,b9b5fbbce2a846ee9afab1271b687cf2","postUrl":"https://www.skool.com/ai-ker-8924/taion-va-ai-worker-xuat-hien-trong-song-26-vao-em-giao-thua"},{"id":"6b5572cf798f4523ad5cd80affaba7da","slug":"tet-roi-moi-nguoi-a-ve-que-chua","title":"Tết rồi, mọi người đã về quê chưa?","content":"Halo cả nhà T ngay lúc này đang ở sân bay, muốn hỏi thăm ae đã về bên gia đình đón tết hết chưa? Hay vẫn còn đang vội vã với các model mới như Seedance 2.0 \\(vừa mới beta bên Trung\\)? 😅.\n\nMình chỉ muốn nhắc nhẹ: Đừng vì sợ bỏ lỡ \\(FOMO\\) mà bỏ lỡ luôn những khoảnh khắc Tết ý nghĩa bên người thân.\nTất cả những điều cần update – từ TaiOn đến các thành viên khác – sẽ được chia sẻ sau Tết. Mọi người yên tâm nhé.\n\n🧭 Tết này, thay vì “chạy” theo model mới, hãy thử ngồi lại một chút để soi chiếu hành trình 1 năm qua của chính mình với AI.\nBạn đã trưởng thành như thế nào? Điều gì thật sự giúp bạn phát triển?\nLà vì các model AI mới ra? Hay vì bạn đã dành thời gian học, luyện kỹ năng, giữ vững tinh thần sáng tạo?\n\n🐎 2026 là năm con ngựa. Và mình tin ai trong chúng ta cũng có “con ngựa” trong mình – thích thắng nhanh, chạy nhanh, bứt phá liền. Nhưng… không phải lúc nào cũng cần phải thúc dây cương.\nNghỉ một chút để sải dài hơn, đi xa hơn – đó mới là hành trình bền vững.\n\nChúc bạn và “chú ngựa 2026” sẽ không chỉ chạy nhanh, mà còn đi thật xa!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-02-11T00:04:55.561503Z","updatedAt":"2026-04-10T18:39:43.256502Z","upvotes":54,"comments":18,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/67506632417e48f087b2906121abf585cdbf093b3e024851954b377a939969c1.png","thumbnailLocal":"post-thumbs/24f367838ce3a01a.png","videoIds":"","attachments":"44cea3e878b04376b7b36ab4608a8643,4954d55842ad4b0d9349633f148fcf86","postUrl":"https://www.skool.com/ai-ker-8924/tet-roi-moi-nguoi-a-ve-que-chua"},{"id":"7576877e091b43c49fc1982e56bf5ea3","slug":"cap-nhat-model-moi-kling-ai-30-chinh-thuc-ra-mat","title":"📣 [CẬP NHẬT MODEL MỚI] Kling AI 3.0 chính thức ra mắt!","content":"Hello cả nhà đêm khuya :\\)\\)\\)\nNhư mình đã chia sẻ trong buổi meeting gần nhất, hôm nay Kling AI 3.0 – model video AI được mong chờ nhất – đã chính thức mở test. Đây cũng là model video AI được nhiều người quan tâm nhất hiện nay. Vậy nên lượng truy cập hiện tại là siêu lớn, rất nhiều người đang test thử. T chờ cũng 20 phút rồi nhưng chưa cho chạy cái Video đầu tiên nữa :\\)\n\nNếu mình có kết quả test sớm, mình sẽ post ngay trong cộng đồng để anh em cùng cập nhật chất lượng, điểm mạnh – điểm yếu của bản 3.0 lần này.\n\n💬 Nếu bạn nào test được sớm hơn, đừng ngại chia sẻ lại trong cộng đồng nhé. Mỗi case study, mỗi kinh nghiệm test của bạn đều rất giá trị cho tất cả mọi người.\n\n🚀 AI đang thay đổi từng ngày, nhưng cộng đồng là nơi giúp chúng ta cập nhật và phát triển bền vững cùng nhau.\n\nLet's go!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-02-04T16:09:57.3337Z","updatedAt":"2026-04-10T18:40:17.551336Z","upvotes":31,"comments":30,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/65b854154e3941a78c58aa86f3f2090a7669b6847e4d4019b9d6c9096b9a8570.png","thumbnailLocal":"post-thumbs/bdc80e923c45da61.png","videoIds":"","attachments":"f4d822fff0e8476d99ab4c13acea6749,dddf4685a7cb4cecb495c4f921c85183","postUrl":"https://www.skool.com/ai-ker-8924/cap-nhat-model-moi-kling-ai-30-chinh-thuc-ra-mat"}]},{"title":"Tháng 3, 2026","url":"https://www.skool.com/ai-ker-8924/classroom/977b3b50?md=3b96feeba0c2496a935f993b984d68ee","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Tham gia buổi \"},{\"type\":\"text\",\"marks\":[{\"type\":\"link\",\"attrs\":{\"class\":\"link\",\"href\":\"https://www.skool.com/ai-ker-8924/calendar\",\"rel\":\"noopener noreferrer\",\"target\":\"_blank\"}}],\"text\":\" Live thứ 6 hằng tuần \"},{\"type\":\"text\",\"text\":\"Để cập nhật tin tức mới nhất!\"}]},{\"type\":\"horizontalRule\"}]","domContent":"<div class=\"styled__EditorInnerWrapper-sc-1cnx5by-1 htfMPD\"><div class=\"styled__EditorContentWrapper-sc-1cnx5by-2 bXbSDs\"><div contenteditable=\"false\" translate=\"no\" class=\"tiptap ProseMirror skool-editor2\"><p>Tham gia buổi <a target=\"_blank\" class=\"link\" href=\"https://www.skool.com/ai-ker-8924/calendar?utm_campaign=skool_link_classroom&amp;utm_content=d2099b9572be43a39c266ef9a616e916\" title=\"https://www.skool.com/ai-ker-8924/calendar?utm_campaign=skool_link_classroom&amp;utm_content=d2099b9572be43a39c266ef9a616e916\"> Live thứ 6 hằng tuần </a>Để cập nhật tin tức mới nhất!</p><hr contenteditable=\"false\"></div></div></div>","posts":[{"id":"cb0657ad29d7404fbdaeaeaadf94660a","slug":"new-course-dropping-soon-ai-video-workflow-voi-seedance-20","title":"🎬 New Course dropping soon — AI Video Workflow với Seedance 2.0","content":"Hello cả nhà, T vừa hoàn thiện xong bộ workflow mới hoàn toàn cho Seedance 2.0.\nĐây là model đang thay đổi cách làm AI video — và mình đã research, test thật trong hơn 1 tháng để build ra quy trình làm việc rõ ràng nhất có thể cho anh em. Đúng với tinh thần không FOMO và tìm hiểu sâu vào vấn đề!\n\nVideo dưới đây mình làm full Seedance 2.0, không mix model. Giữ chất lượng cao, thay người mẫu, bối cảnh, sản phẩm matching.\nVà mình làm xong trong 1 tiếng.\nĐó là lý do mình muốn anh em học đúng workflow ngay từ đầu — thay vì tự mày mò mất hàng tuần.\nCourse sẽ có mặt trong classroom của cộng đồng sớm thôi.\n\nAnh em nào đang muốn nâng workflow AI video lên level tiếp theo — comment mục tiêu sau khi xong course này xuống dưới để mình biết anh em đang chờ nha. Mình sẽ thông báo ngay khi course live 🔥","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-31T04:30:23.518518Z","updatedAt":"2026-04-21T06:51:04.279903Z","upvotes":58,"comments":45,"thumbnailUrl":"https://image.video.skool.com/XZWLvZZlXL9Uby46PKc3AopTfETZw4c01OEEO8StZh3s/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI4NjE4NTk3LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiWFpXTHZaWmxYTDlVYnk0NlBLYzNBb3BUZkVUWnc0YzAxT0VFTzhTdFpoM3MiLCJ0aW1lIjo1LjY4OCwid2lkdGgiOjEyODB9.xr040DvBZzYNnFu_BCGYV-up3IFvUTrG2QcZ6fND8ilSkjvVjd0E66fGnRwHW1JzAHwOdMkaZWFJT8v_0UnQWZVpi4h0j4h9AZdJfPnKpcb7Fii3-wmq9tlAHUf8GyyhRgH6yBIwQivZkzTTX-O1dmvAEdZdK23Crn0UtJeYMFLf716o9_yijoVaPWdltB04CXkW-KBcmn1Fq77a8EHXSFNsT8daMXwHXsNWTE8XRwSON1G7JNV5IsX6ySk0jX-RE5nIPvKugqaTNE8msWg8UOT3R3kZcbbqhiZE_QKS7IcXDuDegR1cls8f_702t0xN9HWbXvAUue6odaI57wLLTg","thumbnailLocal":"post-thumbs/c9eff30f9809891b.png","videoIds":"181d066ea38d495c9c317c4779de193e,3c91fb65c86646dbb4ab405eea103673","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/new-course-dropping-soon-ai-video-workflow-voi-seedance-20"},{"id":"61442389db954bc5a0f1ef56d516bdc1","slug":"speaker-tai-yango-ads-live-hanoi-2026-recap","title":"🎤 Speaker tại Yango Ads Live Hanoi 2026 Recap","content":"Hello cả nhà, Vừa rồi T có Chuyến công tác Hà Nội, công việc cụ thể là\nMình được mời làm speaker tại Yango Live Ads Hanoi 2026 —\nchia sẻ về ứng dụng AI Creative trong ngành quảng cáo game.\n\nPhòng hôm đó khá đặc biệt:\nĐại diện các game studio Việt Nam ngồi cùng bàn với đoàn head Yango từ Nga \\(Cho bạn nào chưa biết Yango thì đây là một nền tảng với hệ sinh thái không lồ từ Nga, được ví như google bên khu vực Nga, Trung Đông,...\\).\n\nMình chia sẻ về cách AI đang thay đổi toàn bộ pipeline làm creative ads:\nTừ concept → visual → video — một quy trình mà trước đây cần team lớn và nhiều tuần, giờ có thể rút xuống còn vài ngày.\n\nĐiều mình thấy rõ nhất sau buổi đó:\nNgành game đang ở điểm rất thú vị — họ có nhu cầu creative khổng lồ, ngân sách ads lớn, nhưng workflow vẫn chưa bắt kịp tốc độ AI.\nĐây là khoảng trống lớn. Và người nào hiểu cả hai phía — creative lẫn AI workflow — sẽ có lợi thế rõ ràng.\nCảm ơn Yango Ads đã tạo ra không gian để những cuộc trò chuyện như thế này xảy ra. 🙏\nVới mình, đây không chỉ là một buổi talk.\nĐây là tín hiệu rằng AI Creative đang được đưa vào bàn thảo luận nghiêm túc — ở cấp độ doanh nghiệp, không chỉ trong cộng đồng creator nữa.\n\nAnh em có ai đang làm creative ads cho ngành game không?\nMình muốn nghe về workflow của anh em — drop xuống dưới nhé 👇","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-27T10:15:59.983762Z","updatedAt":"2026-04-21T06:29:23.946386Z","upvotes":36,"comments":12,"thumbnailUrl":"https://image.video.skool.com/P36Tse9heeLyOwYlpHZH5tF9Cy73ARcYzgLZgzQe7Xs/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI4MjkyOTU5LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiUDM2VHNlOWhlZUx5T3dZbHBIWkg1dEY5Q3k3M0FSY1l6Z0xaZ3pRZTdYcyIsInRpbWUiOjE0LjAzOSwid2lkdGgiOjEyODB9.iCQCzeeE2zisC6B5bCMiEOs4-6w2lPYoHP0ouIOv4EuP2sAi00r49FpVlYtdqjzxLnYBigmxMVgptiOjKPaqKkh7ctbvP44JguAyxn0fFx6FZOjW0ypUImDvKNrT-jotoGw90ypU22bUn0yBLl_4Z8jwvU_WNjnW97dwAtOD1keUEF7yOKeWuihSNcPALFI132ECfs6K1KO4mWO4ZZDXNMc7gWPCBXfEiHK7l8-t3tUPc-3kC0NPZ9fxPBGYK0Ncy5bQK8jrrVw9VU5RfWBS756oj0dvh7b0bc98aEdkvjhUgZ6cV2rkV2Xa9QNkKhyxwLNaUkkpjU7HBVePjwhTRw","thumbnailLocal":"post-thumbs/f5fb9a13150d9f74.png","videoIds":"d0c5b12ecfd4479da19a66283ea56ea0","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/speaker-tai-yango-ads-live-hanoi-2026-recap"},{"id":"6569f7a768364f1a9448fbd9d9b35d70","slug":"seedance-20-cong-cu-lam-tvc-san-pham-bang-ai-ang-gay-chu-y-lon","title":"🎬 Seedance 2.0 — Công cụ làm TVC sản phẩm bằng AI đang gây chú ý lớn","content":"ByteDance sắp ra mắt Seedance 2.0 \\(trong tháng này ở thị trường VN\\) — và thành thật mà nói, đây là một trong những bước nhảy đáng kể nhất trong AI video generation mình thấy gần đây.\n\nĐặc biệt với anh em làm TVC, quảng cáo sản phẩm.\nĐiểm mạnh đáng chú ý:\n[ul][li]Hiểu prompt ở cấp độ đạo diễn — bạn có thể ra lệnh chi tiết như góc máy, ánh sáng, chuyển động sản phẩm, và model thực thi khá chính xác[li]Physical Accuracy Engine — hình dạng sản phẩm và ánh sáng giữ ổn định xuyên suốt từng frame, không bị méo hay flicker[li]Native audio-video sync — âm thanh và hình ảnh được sinh ra cùng lúc, không cần ghép thủ công[li]Nhận đến 9 ảnh tham chiếu — đưa vào packshot, mood board, hay reference TVC là model tự pick up style\n\nNhưng có 2 điểm cần lưu ý trước khi dùng cho production:\n[ul][li]Output hiện tại là 720p — dùng được cho concept và storyboard, nhưng nếu deliver cho client thì cần upscale thêm một bước[li]Vấn đề bản quyền đang rất nóng — trước đây logo thương hiệu như Nike vẫn render được qua, nhưng sau hàng loạt vụ kiện từ MPA, Disney, Netflix, Paramount... ByteDance đã siết lại bộ lọc. Hiện tại các logo thương hiệu thực thường bị chặn. Nếu làm TVC cho brand thật, cần cẩn thận ở bước này.\n\n👉 Với mình, Seedance 2.0 hiện tại phù hợp nhất cho pre-production, pitch concept or vá các source trong tổng thể— tạo TVC demo nhanh để present ý tưởng với client trước khi vào production thật.\nTiết kiệm được rất nhiều thời gian và chi phí ở giai đoạn này.\n\nVề dài hạn, khi vấn đề bản quyền được giải quyết và resolution lên 2K — đây sẽ là công cụ thay đổi cách làm TVC sản phẩm hoàn toàn.\nAnh em trong community có ai đang test Seedance 2.0 cho project thực tế chưa? Drop thử kết quả bên dưới nhé 👇","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-22T07:18:33.803591Z","updatedAt":"2026-04-10T18:31:30.365411Z","upvotes":45,"comments":20,"thumbnailUrl":"https://image.video.skool.com/HIm011QDxdoZZJXvM0201ZqyCEu3hKaaH02RkWZT9ptOjjo/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI3ODUwMzEzLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiSEltMDExUUR4ZG9aWkpYdk0wMjAxWnF5Q0V1M2hLYWFIMDJSa1daVDlwdE9qam8iLCJ3aWR0aCI6MTI4MH0.mmxKQSQF_7Vvd8fclDAJlHSHf0OvX_O8jn09ur9ThXN2zv7dxhfze-tz1XnXntDuIoyHo0Eu32AYMnjhjBpL-4m6ScGOP21Rppb2AwYcMVAN_xVOfv4__jEhi6NEr2ASTHDgKG106nEkREXn_9zo1VWpmk1PTAIbp5MaI3ioTVHoeewiU5_Z8sAGGuuNgo1jiMUyp-7rV0j0IVJhaZiDFPUJrYgU_Y25KldeS_FS8NPMNCfVyRKbqx0ux_Exh47jTy2NTRixJs_-bZEsNLKsuH-wgcCz877bwOFQ6BONYJbv9YItyBAtFrGVYu7m8vAcx04DNxSTshol8UO0EXe1bw","thumbnailLocal":"post-thumbs/289565c6a02716a9.png","videoIds":"fec8c5c052774de3bb49838b08b9e3a6","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/seedance-20-cong-cu-lam-tvc-san-pham-bang-ai-ang-gay-chu-y-lon"},{"id":"0d71d4f487a64732afac34bcee393261","slug":"instagram-ai-worker-chinh-thuc-online-buoc-au-lam-kol-mang-ai","title":"📱 Instagram AI Worker chính thức online - Bước đầu làm KOL mảng AI!","content":"Halo anh em, mình có một tin vui cho cộng đồng hôm nay.\nTài khoản Instagram của AI Worker Community chính thức hoạt động.\nVà đây không chỉ là một tài khoản đăng bài bình thường.\nTài khoản này reach hơn 100,000 người mỗi tháng — và đang tăng trưởng đều mỗi ngày.\n\nLý do mình xây tài khoản này rất đơn giản:\n👉 Giai đoạn đầu làm creator là giai đoạn khó nhất. Bạn có sản phẩm tốt, nhưng chưa có ai biết đến bạn.\nMình từng ở giai đoạn đó và mình hiểu cảm giác đó như thế nào.\n\nVì vậy, mình mở ra cơ hội collaboration repost cho anh em trong cộng đồng.\nCách hoạt động rất đơn giản:\n\n[ol:1][li]Follow tài khoản 👉 [instagram.com/aiworkercommunity](http://instagram.com/aiworkercommunity) trước[li]Vào bất kỳ bài nào trên Instagram của bạn — bài cũ hay mới post đều được[li]Gắn hashtag #AIWorker[li]Chọn mục Collaboration ngay trong bài đó — tài khoản community sẽ nhận được và xét repost\n👉 Từ đó post của bạn sẽ nằm thẳng trên trang chủ của trang này!\n\nReach của tài khoản này sẽ giúp bài của bạn đến được nhiều người hơn — đặc biệt là những người đang quan tâm đến AI creative.\n\nĐây là cách cộng đồng AI Worker hoạt động đúng như mình luôn muốn xây:\nMọi người cùng lớn, không ai cô đơn trên hành trình.\n\nTối nay 8h mình sẽ chia sẻ thêm chi tiết trong buổi meeting.\nAnh em quan tâm thì join nhé 🙌\nKeep going AI Worker. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-20T06:10:23.919711Z","updatedAt":"2026-04-16T05:02:44.424658Z","upvotes":85,"comments":36,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/93c0056149ec431aa157743bc13bafac6bdbecc0105546c98df904790ec25620.jpg","thumbnailLocal":"post-thumbs/20371e62da29392f.jpg","videoIds":"","attachments":"d6128359fd9b4d13ad50c6a8c92a7bce","postUrl":"https://www.skool.com/ai-ker-8924/instagram-ai-worker-chinh-thuc-online-buoc-au-lam-kol-mang-ai"},{"id":"5dbd15218d164342865a426b834406a8","slug":"update-midjourney-v8-alpha-vua-ra-mat","title":"📢 Update Midjourney V8 Alpha vừa ra mắt","content":"Ngày 17/03/2026, Midjourney đã chính thức mở V8 Alpha – phiên bản thử nghiệm để cộng đồng test trước khi ra bản Stable.\n\nMình cũng đã thử nhanh bản này và có vài update cho anh em:\nNhững điểm đáng chú ý\n[ul][li]Tốc độ nhanh hơn rất nhiều \\(cảm giác khoảng 4–5 lần so với bản cũ\\)[li]Có thể render ảnh độ phân giải cao ngay từ đầu, không cần upscale nhiều bước[li]Hiểu prompt tốt hơn, đặc biệt khi dùng --raw[li]Text trong ảnh render chính xác hơn khi đặt trong dấu \" \"\nNhưng hiện tại vẫn là bản Alpha\n\nNên vẫn có một số điểm cần lưu ý:\n[ul][li]Chỉ có Fast mode, chưa có Relax[li]Một số tính năng tốn credit hơn[li]Edit ảnh chưa thực sự tốt[li]Chưa tích hợp các tính năng như omni\nSau khi test, mình thấy Midjourney V8 vẫn đang đi đúng hướng quen thuộc của họ:\n👉 tập trung mạnh vào tạo concept và cinematic art style.\nNó không phải model để edit hình mạnh như Nano Banana hay Seedream.\n\nNếu bạn làm concept art, visual idea, creative direction thì Midjourney vẫn rất thú vị để thử.\nCòn nếu bạn đang làm production, chỉnh sửa hình, quảng cáo sản phẩm thì hiện tại chưa nhất thiết phải chuyển sang V8 Alpha ngay.\n\nVì đây vẫn chỉ là bản test, nên mọi thứ có thể còn thay đổi khá nhiều trước khi ra bản chính thức.\nMình nghĩ cứ chờ thêm bản stable rồi đánh giá lại sẽ hợp lý hơn.\n\nAnh em trong cộng đồng ai đã test V8 Alpha chưa?Drop thử kết quả bên dưới nhé.","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-19T05:43:00.872401Z","updatedAt":"2026-04-10T18:31:27.501856Z","upvotes":39,"comments":18,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/9c71e6f51de84012b5e1f698054dba79cc8b2ba177864573894bef4e763a6514.png","thumbnailLocal":"post-thumbs/d48478f25b73c58f.png","videoIds":"","attachments":"55ef057efc9e4fbc87d5fe5cc1b566da,89f68cea21824ed4bdb75c1068733a79,ed40629f53054723a52c369504120a23,fbc5d20b272f493e8988a0efa3a409ea","postUrl":"https://www.skool.com/ai-ker-8924/update-midjourney-v8-alpha-vua-ra-mat"},{"id":"10af026e0a4a47d4960a279f92b23b2f","slug":"update-course-moi-ve-switchx-cua-beeble","title":"Update course mới về SWITCHX của Beeble","content":"Halo mn, T vừa update một feature rất mạnh nếu bạn đang muốn dùng AI trong VFX và production.\n\nSWITCHX cho phép bạn:\n[ul][li]thay đổi những gì bạn muốn trong video[li]hoặc giữ lại chính xác những chi tiết quan trọng như face, product, outfit, background…\n\nNói đơn giản, đây là một tool giúp bạn kiểm soát AI tốt hơn khi làm video.\n\nTrong video course mới này, mình sẽ chia sẻ:\n[ul][li]mình dùng nó như thế nào[li]workflow step by step[li]cách feature này hoạt động[li]ứng dụng thực tế[li]và pricing của tool để mọi người dễ hiểu trước khi test\nBạn nào đang muốn đi sâu hơn vào AI VFX / AI production thì nên xem course này nhé.Hy vọng nó sẽ giúp mọi người hiểu rõ hơn và ứng dụng mạnh hơn trong công việc.\n\nLink video course: [ở Đâyyy](https://www.skool.com/ai-ker-8924/classroom/6f3c9c14?md=983b203eb35a4c3fbb3a754d94adf274)","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-18T06:33:02.862588Z","updatedAt":"2026-04-10T18:31:26.875594Z","upvotes":56,"comments":27,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/b9e68eb528f24be6863280a6947b6e650be07f906a0e4752b584bb017d3af75b.png","thumbnailLocal":"post-thumbs/11c2f4e0c4a1db8d.png","videoIds":"","attachments":"b37a5016fbfa4a109bee222ec1dd24d7","postUrl":"https://www.skool.com/ai-ker-8924/update-course-moi-ve-switchx-cua-beeble"},{"id":"427e97b51a794564ba598b7b17f11cb6","slug":"winner-of-game-9-congratulations-anh-phuong","title":"🏆 Winner of Game 9 – Congratulations Anh Phương!","content":"Game 9 đã có người chiến thắng!\n\nXin chúc mừng [@Anh Phương](obj://user/543ac0874cd140a2996ee168dab08ce1) với một bài thi thật sự rất ấn tượng. Concept của bạn ấy rất mạnh và rất đẹp – hình ảnh chú ngựa được xây dựng đầy tinh tế, kết hợp cùng thông điệp sâu sắc về tinh thần Zen.\n\nĐây chính là điều mình rất thích ở bài thi này:\nKhông chỉ là hình ảnh đẹp, mà còn có ý nghĩa và câu chuyện phía sau.\n\nAnh Phương đã thực hiện bài thi rất đúng với brief của Game 9 – “The Story of the Horse”, thể hiện rõ tư duy concept và storytelling với AI Creative.\n\n🎁 Phần thưởng dành cho Anh Phương:\n\n1 tháng sử dụng bất kỳ AI web tool \\(tối đa $50\\)\n\n1 chiếc AI Worker Cap\n\nMột lần nữa, congratulations Anh Phương!\nRất vui khi thấy mọi người trong cộng đồng ngày càng nâng level concept và storytelling với AI.\n\nGame 10 mới sẽ sớm quay lại…\nAnh em AI Worker chuẩn bị nhé. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-12T06:08:02.06127Z","updatedAt":"2026-04-10T18:31:25.508425Z","upvotes":63,"comments":53,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/e306e1776b494bf08ae39c654d8e062ce9077a877af547159fd9a0010d67ad5c.jpg","thumbnailLocal":"post-thumbs/277981127b27b317.jpg","videoIds":"","attachments":"fa11b699493c4dc8b6d98b9b711ec5f0","postUrl":"https://www.skool.com/ai-ker-8924/winner-of-game-9-congratulations-anh-phuong"},{"id":"9624d592de4a48698132321ad05e5b8f","slug":"ai-worker-uoc-chu-y-tu-agency-lon","title":"AI Worker được chú ý từ Agency lớn","content":"Hôm nay mình vừa có buổi ghé thăm Dentsu Redder – Creative Agency of the Year và được trò chuyện trực tiếp với Head of AI Production của họ \\(ảnh có trong cộng đồng kk\\).\n\nĐiều làm mình rất vui là AI Worker đang được để ý như một cộng đồng sạch và có chất lượng. Các member trong cộng đồng được đánh giá có tư duy sáng tạo tốt và kỹ năng được thể hiện rõ qua từng game.\n\nĐiều này mở ra tín hiệu rất tích cực: sẽ có thêm nhiều kết nối với thị trường trong tương lai, để cộng đồng AI Worker có những cơ hội và đầu ra đúng như mong muốn ban đầu khi mình xây dựng cộng đồng này.\n\nMình luôn nói:\nChúng ta không chạy theo làn sóng AI Creative — chúng ta cưỡi trên nó.\n\nVì vậy hãy tiếp tục rèn luyện kỹ năng qua từng game, xây portfolio và chia sẻ sản phẩm của mình. Khi bạn sẵn sàng, đừng ngại lộ diện trong cộng đồng.\n\nKeep going AI Worker. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-11T09:58:15.619675Z","updatedAt":"2026-04-10T18:31:24.677737Z","upvotes":83,"comments":25,"thumbnailUrl":"https://image.video.skool.com/E6TWuovMktkuANPIi2rsRv02N3DM2Tw27Yzxw5GXMCT4/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI2OTA5NDk1LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiRTZUV3Vvdk1rdGt1QU5QSWkycnNSdjAyTjNETTJUdzI3WXp4dzVHWE1DVDQiLCJ0aW1lIjoxMC4wMjgsIndpZHRoIjoxMjgwfQ.keHjWnrNj3RvxlhjhYVUI0RGfnr2UiwJ6CJxZvCqeCsS9OpxWMKozcj1NjUvBjTm3kqSAEoD6yJkLIBYqEBUahFfnzfez7SgAp9OIfa-bL0druiMIjGxkol_UMTzhn_22R-rfQRszwCqN1QiAajHU-L_tCa8lgHoM0vKiO25OK-zwHg3VdJPODfBeAmB2x2vxxiXS6MvKfjZys5bEN6WbDOQJe793tvkqhz9GNPnXOcbVtCga2_6tSkkO-GiVTzQx2xy3Bz7elC7eBXKU6_GDvEz4ECK-y4EbsPI0BL1jEQ31ySiD5ga6svaZEuBunLLq71NlkspT7Izyoek8U4wzQ","thumbnailLocal":"post-thumbs/44798c9406fb33fe.png","videoIds":"9784fd15cb7b4bd5895f53b7df144fbc","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/ai-worker-uoc-chu-y-tu-agency-lon"},{"id":"33763d30cc3f43a69a71d4506bad7982","slug":"weekly-qa-meeting-tonight-8pm","title":"📢 Weekly Q&A Meeting – Tonight 8PM","content":"Hello mọi người,\nTối nay 8PM chúng ta sẽ có buổi Q&A Meeting đầu tiên của năm trong cộng đồng AI Worker.\nTrong buổi này mình sẽ dành 30 phút để trả lời tất cả các câu hỏi của mọi người về AI Creative.\n\nMình biết nhiều anh em đang có rất nhiều câu hỏi về:\n[ul][li]Thị trường AI Creative hiện tại[li]Xu hướng AI mới[li]Cách ứng dụng AI vào công việc và client[li]Workflow làm việc với AI\n\nVì vậy đây là cơ hội để ask anything.\n\nVới những bạn mới trong cộng đồng:\nAI Worker có Weekly Q&A Meeting mỗi tuần \\(check ở mục calendar\\), nơi mọi người có thể:\n[ul][li]Hỏi bất cứ điều gì về AI Creative[li]Cập nhật thị trường[li]Gỡ rối workflow khi làm việc với AI[li]Hiểu rõ hơn cách áp dụng AI vào công việc thực tế\n\nMục tiêu của session này là giúp mọi người đi đúng hướng trong thị trường AI Creative, không bị nhiễu thông tin và biết cách dùng AI hiệu quả hơn.\n\n⏰ Tonight – 8PM\nChuẩn bị câu hỏi sẵn nhé.See you tonight. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-06T05:16:26.087898Z","updatedAt":"2026-04-10T18:39:31.696714Z","upvotes":36,"comments":20,"thumbnailUrl":"","thumbnailLocal":null,"videoIds":"","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/weekly-qa-meeting-tonight-8pm"},{"id":"e7ff822ac120488f9d491d2077d9b9f9","slug":"update-course-ai-yourself-2026-training-lora-version-moi","title":"🔥 Update Course – AI Yourself 2026 (Training LoRA Version mới)","content":"Hello cả nhà,như mình đã chia sẻ trước đó, mình đang cập nhật lại course AI Yourself / Training LoRA cho phiên bản 2026.\n\nĐiểm thay đổi lớn nhất của bản update này là:\n👉 Độ chính xác của AI face đã cao hơn rất nhiều.\nNếu trước đây khi train LoRA, kết quả thường chỉ na ná giống, thì với workflow mới mình chia sẻ trong course, bạn có thể tạo ra AI image giống gương mặt của mình gần như tuyệt đối, dựa trên bộ reference image bạn cung cấp.\n\nĐiều này mở ra rất nhiều ứng dụng thú vị:\n[ul][li]Số hoá bản thân với AI[li]Tạo AI character cá nhân[li]Xây dựng personal visual content[li]Hoặc phát triển các AI model riêng cho project của mình\n\nHy vọng update này sẽ giúp mọi người nâng level AI Yourself lên một bước nữa.\nLink course: [https://www.skool.com/ai-ker-8924/classroom/eebb3b78?md=ae07cbc8699644efa8fcdffbda21791b](https://www.skool.com/ai-ker-8924/classroom/eebb3b78?md=ae07cbc8699644efa8fcdffbda21791b)","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-05T05:06:53.063285Z","updatedAt":"2026-04-10T18:30:10.663811Z","upvotes":75,"comments":41,"thumbnailUrl":"https://image.video.skool.com/bqsN94T1OJJeXUlOaaNkslEt2c2esJNiQiG3xYUiwks/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI2MzczNjEzLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiYnFzTjk0VDFPSkplWFVsT2FhTmtzbEV0MmMyZXNKTmlRaUczeFlVaXdrcyIsIndpZHRoIjoxMjgwfQ.JT4ewTsZeR2yn13oSRxdmhP-VINz6Mo8VUFddSKIRGvDCqf-qmGoeC4j4RsPUO7Hmj0pmeec2odESgoyGEX-6oPdflwo4LbSyDMiR6Qqq6nW3xi9qtk4nbQnPSRukeVMVA45dKk4d-_P2Pe7do5fJ-fUgmIpHEpwUgWoM3me-gZ4PbsQfNUHoKhyJsrf3W1JIbNQLK--5FibdXp3eRuXhoYkBzbh7ZIFJcuU60mmxPzo_KzQA-aEvHxZBLe2AyXbvMgu0mtANIAH5wYRz1zY6cy5oDDjJENPcytGhn0wdeXZUJ93ebLLKUj8WPF-FsOCshA0pHLoCwtkJkxfAxtv1A","thumbnailLocal":"post-thumbs/a7f09eacdf2b4857.png","videoIds":"2f993ef0180846fc97c89f996c9c97c5","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/update-course-ai-yourself-2026-training-lora-version-moi"},{"id":"d4d0b0b1014e4b5c92b3b534a7f3a66c","slug":"ai-mv-vi-sao-ang-tro-thanh-xu-huong","title":"🎬 AI MV – Vì sao đang trở thành xu hướng?","content":"Gần đây mình thấy rất nhiều người quan tâm đến việc tạo AI MV \\(music video bằng AI\\). Nhu cầu này đang tăng rất nhanh, và điều đó cũng dễ hiểu.\n\nÂm nhạc luôn có sức ảnh hưởng rất mạnh đến cảm xúc và sự sáng tạo. Khi kết hợp với AI, chúng ta có thể biến những hình ảnh trong trí tưởng tượng thành video thực sự.\n\nMình vừa thử làm một AI chorus MV cho bài Dạo Bước HongKong 1999 do bạn [@Nhon Ho](obj://user/1743bdde02a745d79dce033810337b6c) dịch sang lời Việt/add Vocal AI, và mình nhận ra một điều quan trọng:\n\n👉 Emotion là yếu tố quan trọng nhất.\n\nKhi xem một AI music video, thứ chạm đến người xem không phải chỉ là kỹ thuật, mà là cảm xúc của hình ảnh khi đi cùng âm nhạc.\n\nVì vậy khi xem nhiều AI MV ngoài thị trường, mình cảm thấy chúng ta có thể làm tốt hơn nếu tập trung vào emotion và storytelling, thay vì chỉ tạo những hình ảnh đẹp.\n\nWorkflow mình đang dùng cho AI MV:\n\n1️⃣ Idea\nNghe bài nhạc thật kỹ và để cảm xúc dẫn dắt ý tưởng.\nTừ đó xây dựng moodboard để rõ concept trong đầu \\(nhớp research tính chính xác của idea nha\\).\n\n2️⃣ Hero Image\nTừ moodboard, tạo một hero image thật chuẩn bằng AI \\(Nano Banana 2, Seedream 5, Midjourney,...\\).\nĐây sẽ là hình ảnh nền tảng cho toàn bộ MV.\n\n3️⃣ Build Concept\nTừ hero image phát triển ra các cảnh khác để tạo thành full concept của MV.\n\n4️⃣ Animation\nAnimate các cảnh bằng AI video tools.\nVideo này mình dùng Kling 3 và Seedance 2.0.\n\n5️⃣ Editing\nCắt dựng, ghép nhạc và hoàn thiện video.\n\nWorkflow này thực ra khá giống với workflow AI Creative mình đã chia sẻ trước đó. Và tất cả các step mình cũng đã có hướng dẫn trong phần classroom r ha.\n\nHy vọng nó giúp mọi người làm AI MV rõ ràng hơn và tiết kiệm thời gian hơn.\n\nAnh em trong community có ai đang thử làm AI MV không?\nDrop thử sản phẩm hoặc idea bên dưới nhé. 🎧🎬","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-04T05:16:35.971461Z","updatedAt":"2026-04-10T18:30:36.137589Z","upvotes":36,"comments":26,"thumbnailUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/786ac22d3aa2435dba8e6ae13a28cab05b4c6f52d8ba432ab66a6ab893ac9434.png","thumbnailLocal":"post-thumbs/502d7dafebfa832b.png","videoIds":"ccc84ba884814769a5087bfe8e72d49a,a6476bb2a0cd4a0a9b4c7ab10a7dc94a,35e3b58c98dd41778bc13bb7ac4e0406","attachments":"c01ab7cf6a954dacaa5fa353b14398ec","postUrl":"https://www.skool.com/ai-ker-8924/ai-mv-vi-sao-ang-tro-thanh-xu-huong"},{"id":"21a01af2bed34016b220134dae783ead","slug":"luat-ai-viet-nam-3-ieu-can-nam-long","title":"🚨 LUẬT AI VIỆT NAM: 3 ĐIỀU CẦN NẰM LÒNG","content":"Hola ae AI Workers,\nLuật AI Việt Nam đã chính thức có hiệu lực từ hôm qua \\(01/03/2026\\). Để anh em yên tâm \"cày cuốc\" xây kênh hay làm job cho nhãn hàng mà không lo bị \"gõ\", mình tóm gọn lại những điểm sát sườn nhất cho cộng đồng sáng tạo hình ảnh/video/âm thanh AI nhé!\n\n1. \"Minh bạch\" là từ khóa sống còn Bất kể bạn tạo ra một tấm ảnh đẹp, một video ảo diệu hay một bản nhạc AI, nếu nó trông/nghe giống thật thì BẮT BUỘC phải gắn nhãn.\n\nAction: Hãy thêm watermark \"AI Generated\", \"Nội dung do AI tạo\" hoặc ghi rõ trong caption, hashtag. Đừng để khán giả bị nhầm lẫn giữa người thật và AI, đó là phạm luật đấy! Tức là nếu bạn thấy video của mình rất khó nhận ra AI thì hãy chủ động viết ở caption, hashtag, or gắn mark để tránh rủi ro.\n\n2. Làm TVC cho nhãn hàng: Cẩn thận cái \"quyền\". Luật nói rõ: Sản phẩm thuần AI tạo ra thì bạn có quyền sử dụng thương mại, nhưng rất khó để đăng ký \"Quyền tác giả\" \\(Copyright\\).\n\nLưu ý: Khi làm job chuyên nghiệp, hãy làm rõ với nhãn hàng phần nào là AI, phần nào là người làm. Đặc biệt, tuyệt đối không dùng AI giả giọng hay giả mặt người nổi tiếng khi chưa có hợp đồng ký kết. Hình phạt cho \"Deepfake không phép\" giờ rất gắt.\n\n3. Trách nhiệm cuối cùng thuộc về bạn AI chỉ là công cụ. Nếu AI vô tình tạo ra nội dung vi phạm thuần phong mỹ tục hoặc sai sự thật mà bạn vẫn đăng lên, thì bạn \\(người ra lệnh - Prompt Engineer\\) là người chịu trách nhiệm trước pháp luật, chứ không phải \"con bot\".\n\n💡 LỜI KHUYÊN CHO AE \"SỐNG SÓT\" VÀ PHÁT TRIỂN\nĐừng quá lo lắng: Luật ra đời để dẹp loạn nội dung rác và Deepfake lừa đảo. Những người làm nghề nghiêm túc như anh em mình thực ra sẽ \"dễ thở\" hơn vì có hành lang pháp lý rõ ràng.\n\nHọc cách gắn nhãn tinh tế: Đừng sợ gắn nhãn AI sẽ làm mất giá trị tác phẩm. Ngược lại, nó thể hiện sự chuyên nghiệp và trung thực của một AI Creator thế hệ mới. Thêm hashtag #AIWorker vừa có tương tác vừa để mọi người nhận biết video của bạn được làm từ AI một cách tinh tế.\n\nLưu lại Prompt/Workflow: Hãy coi đây là tài liệu chứng minh \"chất xám\" của bạn trong quá trình điều khiển AI.","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-03-02T09:03:31.813761Z","updatedAt":"2026-04-10T18:31:21.496515Z","upvotes":67,"comments":38,"thumbnailUrl":"","thumbnailLocal":null,"videoIds":"","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/luat-ai-viet-nam-3-ieu-can-nam-long"}]},{"title":"Tháng 4, 2026","url":"https://www.skool.com/ai-ker-8924/classroom/977b3b50?md=eeb2e9167d2344c28a17c14ddc7f232c","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Tham gia buổi \"},{\"type\":\"text\",\"marks\":[{\"type\":\"link\",\"attrs\":{\"class\":\"link\",\"href\":\"https://www.skool.com/ai-ker-8924/calendar\",\"rel\":\"noopener noreferrer\",\"target\":\"_blank\"}}],\"text\":\" Live thứ 6 hằng tuần \"},{\"type\":\"text\",\"text\":\"Để cập nhật tin tức mới nhất!\"}]},{\"type\":\"horizontalRule\"}]","domContent":"<div class=\"styled__EditorInnerWrapper-sc-1cnx5by-1 htfMPD\"><div class=\"styled__EditorContentWrapper-sc-1cnx5by-2 bXbSDs\"><div contenteditable=\"false\" translate=\"no\" class=\"tiptap ProseMirror skool-editor2\"><p>Tham gia buổi <a target=\"_blank\" class=\"link\" href=\"https://www.skool.com/ai-ker-8924/calendar?utm_campaign=skool_link_classroom&amp;utm_content=d2099b9572be43a39c266ef9a616e916\" title=\"https://www.skool.com/ai-ker-8924/calendar?utm_campaign=skool_link_classroom&amp;utm_content=d2099b9572be43a39c266ef9a616e916\"> Live thứ 6 hằng tuần </a>Để cập nhật tin tức mới nhất!</p><hr contenteditable=\"false\"></div></div></div>","posts":[{"id":"d5c306cd4612487d841d6a6e65443a0f","slug":"chatgpt-images-20-vua-ra-mat-model-tao-hinh-ang-chu-y-nhat-ke-tu-nano-banana","title":"📢 ChatGPT Images 2.0 vừa ra mắt — model tạo hình đáng chú ý nhất kể từ Nano Banana","content":"OpenAI vừa drop ChatGPT Images 2.0 và mình đã test nhanh hôm nay. Nói thật, đây là model tạo hình mạnh nhất mình từng thấy kể từ khi Nano Banana của Google xuất hiện trên thị trường.\n\nNhững điểm đáng chú ý:\n[ul][li]Độ chi tiết cực kỳ cao — detail về texture, material, ánh sáng đều rất sạch[li]Faceswap chuẩn, giữ được đặc điểm nhân vật tốt qua nhiều shot khác nhau[li]Detail product giữ nguyên được nét nhỏ — logo, pattern, chất liệu[li]Edit hình mạnh, phù hợp cực tốt cho hero image và các lần chỉnh sửa production\n\nNhưng hiện tại giá vẫn còn là vấn đề!\n\n[ul][li]Trên Higgsfield: 12 credit cho 1 hình max quality — khá cao nếu anh em làm volume lớn[li]Trên ChatGPT: bật chế độ Thinking là có thể dùng được[li]Giá API vẫn chưa được công bố, nên phải chờ thêm mới biết cost thực sự ra sao\n\nSau khi test, mình thấy đây là một bước nhảy lớn về chất lượng model tạo hình.\n\n👉 Đặc biệt phù hợp cho hero image, product visual, và các tác vụ edit image cần độ chính xác cao.\nNếu anh em đang làm branding, quảng cáo sản phẩm, hay cần faceswap giữ nguyên nhân vật thì model này đáng để thử ngay.\n\nCá nhân mình nghĩ thị trường tạo hình AI đang bước vào giai đoạn rất thú vị. Sau Nano Banana, giờ là ChatGPT Images 2.0 — cuộc đua về độ chi tiết và khả năng edit đang nóng lên từng ngày.\nAnh em trong cộng đồng ai đã test ChatGPT Images 2.0 chưa? Drop thử kết quả bên dưới để cả nhà cùng xem nhé.","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-22T04:44:03.190177Z","updatedAt":"2026-05-07T09:54:17.671925Z","upvotes":46,"comments":22,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/c776f5dff81f404ea1448ecbda6dceab6e45fdcb37374a48b85e664c60a17e40.png","thumbnailLocal":"post-thumbs/4a311b0948288165.png","videoIds":"","attachments":"4cc7cb81948144f3808c566e52a16a59","postUrl":"https://www.skool.com/ai-ker-8924/chatgpt-images-20-vua-ra-mat-model-tao-hinh-ang-chu-y-nhat-ke-tu-nano-banana"},{"id":"04327fc0deeb4a5a9c61ed39039c282a","slug":"minh-vua-an-toi-voi-tong-giam-oc-google-viet-nam","title":"🌏 Mình vừa ăn tối với Tổng Giám đốc Google Việt Nam","content":"Mình vừa về từ 2 ngày staycation cùng Google AI 🔥\nĐược nghe về những tính năng mới nhất của Gemini — và được ngồi nói chuyện thẳng với anh Marc Woo, Tổng Giám đốc Google Việt Nam.\n\nAnh ấy nói Việt Nam không phải đang đuổi theo. Việt Nam đang có cơ hội thực sự để dẫn đầu khu vực trong AI vì chính khả năng tiếp nhận và thích nghi rất tốt tính thời đại của AI.\n\nNghe câu đó mà tự hào lắm — và càng thấy rõ lý do tại sao cộng đồng mình đang xây là đúng hướng. Và đương nhiên, T cũng đã giới thiệu cộng đồng AI Worker - một cộng đồng Sáng tạo cùng AI đến anh Marc. Và ảnh rất thích thú với cộng đồng mình 🙌\n\nMình đang edit lại toàn bộ — sẽ chia sẻ full interview với anh em sớm nhất có thể.\n\nKeep going AI Worker. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-21T12:17:25.82306Z","updatedAt":"2026-05-06T04:05:26.000786Z","upvotes":91,"comments":31,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/f9e23ae960964ce88b1fc56f8742684de9aaaca543c24a2fa558cc8671a8fb6a.png","thumbnailLocal":"post-thumbs/04a0bce37baad0a6.png","videoIds":"","attachments":"b8c3f63c2e57446b9ea028bee9a76c97,a489a9c6f808472793d00c456e475f4c","postUrl":"https://www.skool.com/ai-ker-8924/minh-vua-an-toi-voi-tong-giam-oc-google-viet-nam"},{"id":"ba52d0a1f5154abd8b4656d4e95e086a","slug":"au-tuan-nang-luong-podcast-moi-voi-head-of-production-dentsu-redder","title":"🎙️ Đầu tuần năng lượng — Podcast mới với Head of Production Dentsu Redder","content":"Halo cả nhà! Sáng thứ Hai, mình muốn mn bắt đầu tuần bằng một thứ đáng xem.\nMình vừa release podcast mới với anh Sang Ngô — Head of Production & AI Integration tại Dentsu Redder, creative agency lớn nhất Việt Nam. Người đứng sau Biti's Hunter \"Đi Để Trở Về\", \"Mang Tiền Về Cho Mẹ\" cùng Đen Vâu.\nHơn 1 tiếng nói chuyện thật về AI Production — không phải demo tool, không phải lý thuyết.\nMà là góc nhìn từ người đang thực sự thay đổi cách một agency top Việt Nam sản xuất quảng cáo bằng AI. Anh đi từ design, editor, creative planning, account, producer đến head of production — hơn 10 năm trong ngành. Khi anh nói về AI production, đó là kinh nghiệm thực chiến.\nTrong podcast này mn sẽ nghe:\n\nAI đang thay đổi quy trình sản xuất quảng cáo như thế nào\nGóc nhìn từ một tập đoàn sáng tạo Nhật Bản về AI\nTại sao AI không thay thế con người — mà thay đổi cách con người làm việc\n\nMình khuyên thật: xem hết. Những insight trong này không phải thứ bạn tìm được ở đâu khác.\n👉 Xem ngay tại classroom: [https://www.skool.com/ai-ker-8924/classroom/e5bdecf3?md=e7b3654d749646bc9fb8c512c48657d9](https://www.skool.com/ai-ker-8924/classroom/e5bdecf3?md=e7b3654d749646bc9fb8c512c48657d9)\nTuần mới, năng lượng mới. Let's go AI Worker. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-20T03:56:58.994802Z","updatedAt":"2026-05-05T07:45:34.241992Z","upvotes":39,"comments":10,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/3a3084e87bee4c7c8bbe417a049adb4dd0db05cd4c384c439cec82e4ea17625d.png","thumbnailLocal":"post-thumbs/d6618fcfa882acff.png","videoIds":"","attachments":"273524e16e6d4b93b1c2abf6620e33a3","postUrl":"https://www.skool.com/ai-ker-8924/au-tuan-nang-luong-podcast-moi-voi-head-of-production-dentsu-redder"},{"id":"709e9026af0f4b57bd9a32032e100a6f","slug":"claude-design-vua-ra-mat-va-minh-vua-test-xong","title":"📢 Claude Design vừa ra mắt — và mình vừa test xong","content":"Halo cả nhà, mặc dù tối hơi muộn của Chủ Nhật nhưng cũng cập nhật với ae về Claude Design — sản phẩm AI design đầu tiên của claude. Mình đã test ngay và có vài điểm muốn chia sẻ với anh em.\nNhững gì mình thấy thú vị:\n\n[ul][li]Workflow rất mượt — mình kết hợp brand storm với Opus 4.7 trước, rồi đưa thẳng vào Claude Design. Từ brief đến website live chỉ mất 15 phút.[li]Hiểu brand system thật sự — nó đọc được file DOCX, PPTX, ảnh, thậm chí cả codebase. Từ đó tạo ra design đúng màu sắc và hệ thống thương hiệu, không phải output generic.[li]Tính tuỳ chỉnh cao — không bị khoá trong 1 output cố định, chỉnh được từng phần.[li]Output đa dạng — website prototype, slide deck, animation, và export thẳng sang PDF, PPTX hoặc Canva.\n\nHiện tại vẫn là Research Preview:\n\nChỉ dành cho Claude Pro, Max, Team, Enterprise\nChưa mở cho general public\n\nNhận xét của mình: Claude Design không phải để thay Figma hay Canva. Nó là một bước nhảy khác — bạn không cần bắt đầu từ tool design nữa, chỉ cần một brief rõ là AI cho ra output dùng được ngay.\n\n👉 Phù hợp nhất với ai làm văn phòng, marketing, hay web design cần prototype nhanh mà không có design background.\nAnh em trong cộng đồng ai đã thử Claude Design chưa? Drop kết quả bên dưới nhé. Muốn thử thì nhớ bật VPN nhé, ở VN chưa được public. Drop kết quả bên dưới nhé.","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-19T15:38:54.186934Z","updatedAt":"2026-05-12T10:15:53.696553Z","upvotes":39,"comments":14,"thumbnailUrl":"https://image.video.skool.com/gM02L3up02NBhIJDb8FNhQVcQeDt8bGeW6iKuCFZFv01ow/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTMwMjk5NTM0LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiZ00wMkwzdXAwMk5CaElKRGI4Rk5oUVZjUWVEdDhiR2VXNmlLdUNGWkZ2MDFvdyIsIndpZHRoIjoxMjgwfQ.KXrXtAWCppJzL-DRW8PgSAJbOyVZhAezfM0UFydfRxHP1mdfWi4BgxRaDYM7KgoRDVyKTGDO9WB7zy-DSu1JjGfvXh57mHC6xLXNvaju5ov5_Rv-v2ZSr_XsXq1tUwg05PTjNXNmfv_SZ7ltINR8Hq-kj4kLlojgtpL4naERVjiI4_huaEI9vp-i7pRKYO-e0eaeQCYTNEFhCTboQcb1PFmLlBLZj_d8WBGl3nU-kyOnRt2X9pJb19amWufBeB0sj9kyZg39ixkORTUT7Xg_8XQGo49FD9vm362uSS68CuGdzqDf2_VXKF0rmxSOd1aLTszNzzXqIdLlmC8gijd-3w","thumbnailLocal":"post-thumbs/cf57507abe99a7f9.png","videoIds":"770dc6a1f5394c00b2e3fd73134f6cfb","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/claude-design-vua-ra-mat-va-minh-vua-test-xong"},{"id":"dada1b58a5f447dda9458377f6a5c039","slug":"minh-can-mn-giup-5-phut-khao-sat-cho-chuong-trinh-creative-ai","title":"Mình cần mn giúp 5 phút — Khảo sát cho chương trình Creative AI","content":"Mn ơi, mình đang trong giai đoạn chuẩn bị cho một chương trình mà mình rất tâm huyết — AIFlow.\nĐây là khóa học mình xây dựng cùng các chuyên gia trong ngành, mục tiêu là hỗ trợ cộng đồng mình đi sâu hơn vào AI creative workflow một cách có hệ thống.\n\nHiện tại mình đang ở phase khảo sát — để hiểu rõ hơn mn đang cần gì, đang ở đâu, và muốn được hỗ trợ như thế nào.\n\n👉 Mình nhờ anh em dành vài phút làm khảo sát này:\n[https://docs.google.com/forms/d/e/1FAIpQLSfs7P-MqVHPgFHJbTq4xm32KvXqC3JYMJFi9U9PATknhVACMw/viewform](https://docs.google.com/forms/d/e/1FAIpQLSfs7P-MqVHPgFHJbTq4xm32KvXqC3JYMJFi9U9PATknhVACMw/viewform)\n\n🎁 Bạn nào làm khảo sát chi tiết nhất sẽ nhận học bổng 100% cho AIFlow.\n\nMình nói thật — câu trả lời của mn sẽ ảnh hưởng trực tiếp đến nội dung và cách mình thiết kế chương trình. Nên càng chi tiết, càng giúp mình xây được thứ thực sự phù hợp với anh em.\n\nCảm ơn mn nhiều.\nChương trình này mình làm vì cộng đồng, và cần cộng đồng để làm cho đúng. 🙏","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-17T05:16:24.731069Z","updatedAt":"2026-04-23T11:42:40.296193Z","upvotes":38,"comments":44,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/c149485c4a5646e49cd59cf4d85e1a2e7590e3b7bf45438dad7543d7c362c584.jpg","thumbnailLocal":"post-thumbs/e774a209ff07e019.jpg","videoIds":"","attachments":"dfbd4083165943e19405d7f7c73a7fb0","postUrl":"https://www.skool.com/ai-ker-8924/minh-can-mn-giup-5-phut-khao-sat-cho-chuong-trinh-creative-ai"},{"id":"340fee3bd2a94274b6bf98e8ab1b0a87","slug":"leak-nhe-podcast-moi-ai-production-cung-anh-sang-ngo","title":"🎙️Leak nhẹ Podcast mới — AI Production cùng anh Sang Ngô","content":"Mình vừa thu xong một podcast hơn 1 tiếng với anh @Sang Ngo — Head of Production & AI Integration tại Dentsu Redder.\n\nVới ai chưa biết, Dentsu Redder là creative agency lớn nhất Việt Nam từ 2020 đến nay. Hơn 180 giải thưởng quốc tế trong 10 năm. Creative Agency of the Year. Đứng sau những chiến dịch mà chắc ai cũng từng xem: Biti's Hunter \"Đi Để Trở Về\", \"Mang Tiền Về Cho Mẹ\" cùng Đen Vâu, hay Cảm Hứng Tự Hào — Thái Cực Văn Hoá Hà Nội.\n\nAnh Sang là một trong số ít người đã đi trọn vẹn toàn bộ chuỗi sản xuất quảng cáo — từ design, editor, creative planning, account, cho đến producer và head of production. Hơn 10 năm kinh nghiệm. Không phải lý thuyết, mà là người hiểu sản xuất từ bên trong.\n\nVà điều khiến mình hào hứng nhất: anh đang dẫn dắt quá trình tái định nghĩa quy trình sản xuất quảng cáo trong kỷ nguyên AI tại một tập đoàn sáng tạo Nhật Bản.\n\n👉 Trong podcast này, mn sẽ nghe được góc nhìn rất thật từ người đang ứng dụng AI vào production ở quy mô agency lớn — không phải demo tool, mà là cách AI thay đổi cách nghĩ, cách làm, và cách vận hành một team production.\n\nPodcast hơn 1 tiếng. Mình khuyên mn nên xem hết. Vì những insight trong này không phải thứ bạn tìm được trên YouTube hay blog. Đây là kinh nghiệm thực chiến từ người đứng giữa ý tưởng và thực tế — và làm cho khoảng cách đó biến mất.\n\nPodcast sẽ ra mắt sớm thôi. Stay tuned.\n\nCó dịp khá duyên là mình và anh Sang sẽ cùng xuất hiện tại Future Fest — sự kiện của Van Lang Education Group tại Hà Nội, ngày 24–25/04/2026. Hơn 100 chuyên gia từ nhiều ngành.\n\nGiữa tuần thông báo anh em vậy thoi kkk, Podcast đang trong quá trình xử lý nhá","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-16T05:10:11.014631Z","updatedAt":"2026-05-07T09:55:09.644983Z","upvotes":46,"comments":19,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/cf7118a7393b498a957bbb8423359b090871402b880344de847d8af5b26c2b33.png","thumbnailLocal":"post-thumbs/994dc785634ea5f6.png","videoIds":"","attachments":"5c9ccf534f7140fda89dadf4f880649e,942fc13ffc35469fb673c09c8ea1332f,3fc29afd4c154301854e33282d18a596","postUrl":"https://www.skool.com/ai-ker-8924/leak-nhe-podcast-moi-ai-production-cung-anh-sang-ngo"},{"id":"96d266e4444e4481b00282038b76b28d","slug":"seedance-2-sap-len-1080p","title":"📢 Seedance 2 sắp lên 1080p","content":"Halo cả nhà, đầu tuần thông báo tin mật ngắn gọn cho ae! Cuối tháng 4 này, Seedance 2 sẽ ra bản 1080p — nâng chất lượng output lên một mức đáng kể so với hiện tại \\(tất cả đã đc lên plan, việc drop ra thị trường ntn hay có dời không còn phụ thuộc vào nhiều thứ\\)\n\nVà Seedance 3 cũng đang trong quá trình training ^^ quái vật thật sự sắp tới r","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-14T03:04:37.4854Z","updatedAt":"2026-05-04T08:45:38.830383Z","upvotes":34,"comments":14,"thumbnailUrl":"","thumbnailLocal":null,"videoIds":"","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/seedance-2-sap-len-1080p"},{"id":"ce447fbb961b49b7b6fddbafa9b0ddc4","slug":"samsung-workshop-vao-chu-nhat-nay-moi-nguoi-i-khong","title":"Samsung workshop vào Chủ nhật này, mọi người đi khong 👋","content":"Halo cả nhà, Samsung có một workshop nhỏ về Galaxy AI — và mình được mời làm khách mời.\nLần này mình sẽ cầm theo vài chiếc AI Worker Cap gửi tặng cho member nào may mắn có mặt hôm đó. Ai đến thì biết 👀\nVà nếu anh em còn nhớ — lần trước ở sự kiện Samsung, một member trong community đã trúng Galaxy Buds về nhà. Lần này cũng có cơ hội đó nha, 100% người tham dự nhận Voucher 1 triệu + bốc thăm trúng Buds3 Pro và các quà khác từ Thế Giới Di Động.\nMình sẽ chia sẻ ở đó về cách dùng Galaxy AI thực tế:\nCircle to Search 3.0\nTrợ lý Ghi âm tóm tắt cuộc họp\nNow Nudge sắp lịch tự động\nGemini Live luyện thuyết trình\n\n📍 Paper & I Cafe — 152 Nam Kỳ Khởi Nghĩa, TP.HCM\n🗓 9:30–11:30, Chủ nhật 19/04\nĐăng ký tại đây, free nhé:\n👉 [https://forms.gle/knjtKa5vPEb5XWXw6](https://forms.gle/knjtKa5vPEb5XWXw6)\nDrop tên bên dưới nếu anh em đăng ký, mình note lại để còn nhận ra nhau hôm đó 😄","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-13T14:26:06.243574Z","updatedAt":"2026-04-16T13:18:51.427534Z","upvotes":26,"comments":19,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/0090753524b04c76991b1b80c4962c12155788db385e4dd19e82165b29a5dd9f.png","thumbnailLocal":"post-thumbs/580f15363c56fa13.png","videoIds":"","attachments":"046f7ae1d69b48aeb852624d054b596e","postUrl":"https://www.skool.com/ai-ker-8924/samsung-workshop-vao-chu-nhat-nay-moi-nguoi-i-khong"},{"id":"839eccf9b2054f7aa9d71bce23ff937a","slug":"thi-truong-ang-phan-hoi","title":"💡 THỊ TRƯỜNG ĐANG PHẢN HỒI","content":"Hôm nay mình dạy demo cho các bạn học sinh lớp 12 tại Văn Lang Global School.\nKhông phải workshop ngoài kia — mà là chương trình chính quy của trường.\nVà điều mình ấn tượng nhất: nhà trường đã tích hợp AI Creative vào chương trình đào tạo. Họ coi đây là kỹ năng bắt buộc cho lao động tương lai, không phải kỹ năng tự chọn.\n\nĐiều này làm mình nhớ đến [@Duy Thành](obj://user/3fe307513c44480d988ca9eed67bb59a) — một anh em trong cộng đồng mình.\nHồi trước, Thành từng mang sản phẩm AI lên thuyết trình. Và khi mọi người biết đó là AI, phản ứng không mấy tích cực.\nBây giờ — đại học phải chủ động trang bị AI creative cho học sinh.\nThành không đi sai. Thành chỉ đi nhanh hơn thị trường một bước.\n👉 Và đó là điều AI Worker luôn tin tưởng từ đầu.\n\nChúng ta không phải người đang thử nghiệm AI cho vui.\nChúng ta đang xây nền tảng cho một ngành sẽ cần rất nhiều người có tư duy và kỹ năng — đúng lúc thị trường bắt đầu nhận ra điều đó.\n\nNói đến đây — mình đang lên kế hoạch cho buổi off cộng đồng vào tháng 4 này.\nCó rất nhiều biến động thị trường thú vị muốn nói chuyện trực tiếp với anh em hơn.\nMn có sẵn sàng gặp mặt không? Comment bên dưới để mình biết nhé. 🙋\nKeep going AI Worker. 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-11T06:57:51.656584Z","updatedAt":"2026-04-14T06:57:24.716564Z","upvotes":29,"comments":20,"thumbnailUrl":"https://image.video.skool.com/lo01LqQ01eHb01LL5G8m01nHgWwBQYXRBafQcR1WOhgDUQc/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI5NTc3MDcxLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoibG8wMUxxUTAxZUhiMDFMTDVHOG0wMW5IZ1d3QlFZWFJCYWZRY1IxV09oZ0RVUWMiLCJ3aWR0aCI6MTI4MH0.b1NNksI0AGIDUvz2MbwyQIpbOu0C2atX-g2icJ6bIo2XV0bdBzaYJrPZ52U6VbARIHv0tENTzHPSyRV74P4rNd-cjSo9a8mAtZVPzP8n2FsWHoezEPKX06HjVhZz7-EzGSHMnncs4V_U7iLPWZyXfOQSxcsNObx_p6GVrDoih8Lfu_yLhVj0P2Po4LC2boALREQumGqmGcKudHx5ETzjkrUPGqN4edZUqqWQAbm6WUAx0T7FRcWY9WO7uHIoD71-ltKY34bFNzqzHsMEqm7j1hyb39mDGx_5iHLRj4Catr_rgdAPRXsfIWQsh15WDKUgZBPAzfGkMLMjvjUCbH2I1w","thumbnailLocal":"post-thumbs/0f6c3656513c94d3.png","videoIds":"ebdeb2e20a17468fa912c9b89d3f0fb2,9693061927264ea69d584c3144c7b46f,1a96ae642b164c34a3a89a1fa720ca21,378d9839526843ac884c9d164adef37a","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/thi-truong-ang-phan-hoi"},{"id":"2ee4e28f566e4bfc9aca06a6dd9e2d1e","slug":"trien-lam-ai-art-va-thay-ai-ang-i-xa-hon-minh-nghi","title":"💫 Triển lãm AI Art — và thấy AI đang đi xa hơn mình nghĩ","content":"Halo cả nhà, T vừa được mời tham dự buổi trưng bày AIgorithm của Orès Collective — một collective sáng tạo quốc tế chuyên khám phá giao điểm giữa AI và nghệ thuật.\nHọ tập hợp hơn 30 nghệ sĩ quốc tế, cùng tạo ra các tác phẩm hoàn toàn bằng AI — từ visual installation, live performance cho đến các tác phẩm interactive và generative art.\nKhông phải AI để làm quảng cáo. Không phải AI để bán hàng.\nMà là AI như một ngôn ngữ nghệ thuật thật sự.\n\nĐiều mình thấy ấn tượng nhất không phải là kỹ thuật — mà là cách triển lãm này đặt câu hỏi:\n👉 Khi AI có thể tạo ra nghệ thuật, thì vai trò của con người là gì?\nCâu trả lời không đơn giản. Nhưng nhìn vào từng tác phẩm, mình thấy rõ một điều: AI không thay thế góc nhìn của người sáng tạo — nó khuếch đại nó.\nĐây là lý do mình vẫn nói: taste quan trọng hơn technique.\n\nTriển lãm AIgorithm đang mở cửa tham quan miễn phí tại Café des Stagiaires trong suốt tháng 4 này.\n📍 Café des Stagiaires, TP.HCM\n🕓 4h – 8h PM | Nguyên tháng 4\nAi ở Sài Gòn mà chưa ghé thì nên đến một lần — không phải để học tool, mà để nhìn AI dưới một góc khác.\nSau HCMC, triển lãm sẽ tiếp tục đến Shanghai và Paris.\nMình thấy vui vì Sài Gòn là một trong những điểm đầu tiên. 🙌","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-07T06:01:40.122464Z","updatedAt":"2026-04-14T06:27:16.281203Z","upvotes":35,"comments":20,"thumbnailUrl":"https://image.video.skool.com/9sBOQA9OcrVDA4JTYm5myOSyjnDK00pLB48IfWm6qfGU/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI5MjI4MTAwLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiOXNCT1FBOU9jclZEQTRKVFltNW15T1N5am5ESzAwcExCNDhJZldtNnFmR1UiLCJ3aWR0aCI6MTI4MH0.PFiKju4Wz6xDj3rjeJhfec-ePZ5O01hdpG_a5PO3vWipe2sGQKHYw6ZebXAvLFOi1f-5olqG3vUU1onn_4mdKyrtIJkkjd-YxsNz7yJFMlqeCu1QQtTDjcNWy3f0Wa9QFgNql83EJ-of9BQnsN8EGT3a8ZzQdXQXWEplGHV2cKA10KCKBnuI8yK8O8XQqrzyQd_WprUakSozBSm4DuUmxAJNMY7cQxXIS_WSbwerWzTVA24QzCqJpLGt-Z38SF8aEwEj5wL_F2yhtLHb2HR23E8h2vUwo2wEXRMSzUKdVwDBsWh5F0QfbcDjtyfNJCT9tXL0B7eNr5Uw4E5iUs4LSQ","thumbnailLocal":"post-thumbs/cba647bb9e9ba1bf.png","videoIds":"571fb6022ece465bbd3c6932771cd1b8","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/trien-lam-ai-art-va-thay-ai-ang-i-xa-hon-minh-nghi"},{"id":"05fe879a9d034bef872ba40a39871401","slug":"recap-buoi-trai-nghiem-samsung-galaxy-s26-ultra","title":"Recap buổi trải nghiệm Samsung Galaxy S26 Ultra","content":"Hôm thứ 4 vừa rồi \\(4/4\\), mình có dẫn một buổi trải nghiệm AI trên Samsung Galaxy S26 Ultra cho anh em.\nVà điều làm mình vui nhất không phải là được gặp các bạn trong cộng đồng ngoài đời thật.\nAi cũng sáng sủa, năng lượng tốt, và có tinh thần học hỏi AI rất nghiêm túc. Mình cảm nhận được điều đó rõ ràng qua cách mn đặt câu hỏi [@Lê Thoại](obj://user/7fcbf1cf1f3a4cc38ff1cd327530220d) [@Kelbin Pham](obj://user/3d13dd152a1244418818f4ee036f773a) [@Ngô Vũ Ngọc Hải](obj://user/0500fc5cfcfb443e80571cceda3ddf2e) [@Đinh Đăng khoa](obj://user/c5f3ee164167441c9d98373e1855f658) [@Stephan Duong](obj://user/26a23def50f14bfc9263cc6275c6f37e) win được con tai nghe Buds 4 \\(còn ai nữa không biết tên trong cộng đồng của bạn\\).\n\nNói thật là chương trình xoay quanh AI ứng dụng cơ bản trên điện thoại — nhưng rất nhiều câu hỏi của anh em đã vượt xa khuôn khổ đó. Hỏi về data training AI, hỏi về ứng dụng AI trong dự án của mình,... Mình khá bất ngờ kkk\n\nĐó chính là thứ mình luôn muốn thấy ở AI Worker:\n👉 Không chỉ biết dùng tool — mà biết đặt câu hỏi đúng.\nCảm ơn mn đã đến. Hy vọng sẽ có thêm nhiều dịp để gặp nhau ngoài đời, không chỉ qua màn hình.\nKeep going AI Worker. 🚀\n\nP/s: Thank u [@Lê Thoại](obj://user/7fcbf1cf1f3a4cc38ff1cd327530220d) đã hỗ trợ source kkk 🙌","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-06T05:52:42.577618Z","updatedAt":"2026-04-19T15:43:22.657018Z","upvotes":43,"comments":17,"thumbnailUrl":"https://image.video.skool.com/vNwljOcqXwllRNYxmIOd7LgSjB3yLEzEbzYtZ3z0101uo/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTI5MTQ4NDc1LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoidk53bGpPY3FYd2xsUk5ZeG1JT2Q3TGdTakIzeUxFekViell0WjN6MDEwMXVvIiwidGltZSI6MS44MTQsIndpZHRoIjoxMjgwfQ.eTqgddjd3taOsS-eC_YGHtv07C9tGFE2TkJM5fCizmsLMXT6zxQKncaYZMgJ0EbRy4KSjlQWBj_r5uH_aAS2xh_bUA1nsj2OR-jVTGNWL0u6IpnsNGK1Xem3uv_NY35rfAwTLhU8Fxh1f3FTm8V7u_HZ6gl6bLoiVp2W3gu17kugp7EhF3Sr9VUFqtQek3hkQFtWPbzVC-e6mo-hXIDw1O7yyI_qCXsGiismyyuMXEYZsbqJv  Đang ở Thượng Hải và không tắt được \"radar AI\" 😄","content":"Sau một thời gian dài chạy công tác liên tục khắp VN, mình quyết định bay qua Thượng Hải nghỉ lễ một chút.\n\nVừa đặt chân xuống sân bay — chưa kịp uống ly cà phê đầu tiên — đã thấy ngay hàng loạt biển quảng cáo, digital signage, TVC màn hình lớn chạy dọc hành lang.\nLàm bằng AI. Chất lượng thật sự rất tốt. Và để nguyên watermark AI nhỏ ở góc màn hình — không giấu, không xấu hổ gì cả.\nMình đứng nhìn một lúc khá lâu. Không phải vì choáng ngợp — mà vì thấy thú vị.\nỞ đây người ta không bàn \"AI có làm được không nữa.\" Họ đang chạy thật, ở sân bay quốc tế, tiếp cận hàng triệu người mỗi ngày.\n\nThôi mình sẽ tiếp tục explore Thượng Hải và update thêm cho anh em nếu thấy gì hay ho nữa nhé 😄\nChúc cả nhà AI Worker có kỳ nghỉ lễ thật vui, thật nhiều năng lượng — dù đang ở đâu! 🎉🔥","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-26T12:21:20.333222Z","updatedAt":"2026-05-06T09:17:34.990886Z","upvotes":33,"comments":8,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/30bbe232584740218acec44276d9433e11afa52e48b64fa194c7a766df91d4da.jpg","thumbnailLocal":"post-thumbs/6122c9cf9cafe2e9.jpg","videoIds":"","attachments":"6c2260ddf0124f1d96a7eee052f12f12","postUrl":"https://www.skool.com/ai-ker-8924/ang-o-thuong-hai-va-khong-tat-uoc-radar-ai"},{"id":"e0e3a140425a4c32a967b60335147614","slug":"hang-chau-update-tiep-tu-chuyen-i-cua-minh","title":"🚄 Hàng Châu — update tiếp từ chuyến đi của mình 😁","content":"Halo cả nhà, update tiếp với ae tình hình đi xem anh hàng xóm xây dựng AI ntn nhá.\nHôm qua rời Thượng Hải, ghé Hàng Châu. Nếu Thượng Hải cho mình thấy AI đang \"hiển thị\" ra ngoài \\(mấy cái billboard mình kể ở post trước\\), thì Hàng Châu lại cho thấy cái gốc hơn.\n\nThành phố này nổi tiếng với cái tên \"Lục Tiểu Long\" — 6 startup công nghệ đang làm cả thế giới chú ý: DeepSeek, Unitree Robotics, Game Science \\(Black Myth: Wukong\\), Deep Robotics, BrainCo, và Manycore Tech. AI, robot, game, giao diện não-máy tính — đủ cả. Và thú vị là cả 6 đều xuất phát từ đây.\n\nThành phố này từng đăng cai G20 năm 2016, và từ đó đến nay đầu tư vào AI không ngừng tăng. Năm nay họ có kế hoạch rót hơn 300 tỷ RMB \\(~40 tỷ USD\\) mỗi năm cho riêng ngành AI — kèm mục tiêu xây quỹ AI industry 100 tỷ RMB và đào tạo hơn 2,000 doanh nghiệp công nghệ cao mới.\n\nĐứng ở đây, nhìn về hướng trụ sở Alibaba, DeepSeek — cảm giác rất khác. Người ta không bàn \"AI có thay thế con người không\" nữa. Họ coi AI như điện nước — cắm vào là chạy.\n\nCái thực dụng đó mới là thứ mình thấy ấn tượng nhất.\nThôi mình tiếp tục đi, có gì hay sẽ update tiếp cho anh em! 😄\nLễ của mọi người đang sao rồi — vui không? 🎉","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-04-28T14:56:25.840125Z","updatedAt":"2026-05-06T09:18:19.96312Z","upvotes":30,"comments":13,"thumbnailUrl":"https://image.video.skool.com/BtjxMhCfW1PoOFaVoMeDntzLBMA8ckcxQJlxD02z8eXw/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTMxMDc0NTg1LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiQnRqeE1oQ2ZXMVBvT0ZhVm9NZURudHpMQk1BOGNrY3hRSmx4RDAyejhlWHciLCJ3aWR0aCI6MTI4MH0.mUY841OJJSUOnKapkTVsj4cWj7h8BbfFETQnNvNY5-u4-YvqY2I-wim5Jm8FeD22UiMDGgEG1JEOv4Es2E7SWVCYcbdQE2FxgRRlXGXKoN7K6MV0V0G27QzyORKC0uIQGpgGlFgAeG3fyMdnH0YrEZ5rN-buzJXzvV0oNah-T-HVjrsOjOdzTF2ebyRrt2uuWXHn1lBElrLnsGI7Nubzso3eK8zpwZZn6OCG1d1b-uLOoaHyVesFvJ-kHioKOG1b6Wwq3oXZfvJdNFoSmG-zwR_Jmu29K-DuwuCp85Anpfr6iMdCDS3eo6b1ePBtjWArbJz1G_JFVS7Dh5XGV0MlIA","thumbnailLocal":"post-thumbs/c77ec9f1cd866a83.png","videoIds":"da5e876
