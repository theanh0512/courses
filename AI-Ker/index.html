om/f/d2099b9572be43a39c266ef9a616e916/1a00fe69053942e9aa5482066e54b16876adcf05520540b6ab726c84d645d48b.png","thumbnailLocal":"post-thumbs/eeeadfa5b43b2df4.png","videoIds":"","attachments":"0ce8182e868a43ea855f1bbc3f3c4d86","postUrl":"https://www.skool.com/ai-ker-8924/new-course-update-ai-storyboard-buoc-au-e-tao-nen-tvc-ngan"},{"id":"5ec87c302fe742cea5296b335a8e9130","slug":"workshop-vml-vietnam-va-ai-ban-doanh-cua-ai-ker-xuat-hien","title":"Workshop VML Vietnam và \"Đại bản doanh\" của AI-Ker xuất hiện?","content":"Hallo cả nhà, giờ mình mới đăng nhập lại được vào cộng đồng vì sáng nay mình có cơ hội đứng với vai trò diễn giả tại buổi workshop cùng VML Vietnam – một trong những agency sáng tạo toàn cầu đang hoạt động mạnh tại Việt Nam.\nĐược chia sẻ về AI Creative với các team từ Creative, Client đến Production là một trải nghiệm cực kỳ ý nghĩa với mình, đặc biệt khi chủ đề này đang dần trở thành xu hướng không thể thiếu trong ngành.\n\n🔥 Và tin vui đây! Sau buổi workshop, chúng mình cũng đã chốt được một kế hoạch hợp tác với VML Vietnam trong thời gian tới.\nKhông gian workshop hôm nay – như bạn thấy trong video – sẽ trở thành địa điểm tổ chức buổi offline tiếp theo của AI Worker vào tháng 11 này!\n\nĐây kế hoạch sẽ là \"đại bản doanh\" dành riêng cho cộng đồng AI Worker – nơi mình tin rằng mỗi bạn có thể thoải mái chia sẻ, học hỏi và kết nối sâu hơn cùng nhau 🙌\n\n🗓 Mình sẽ thông báo thời gian cụ thể sớm, và hy vọng được gặp lại thật nhiều gương mặt quen thuộc tại buổi offline ấm cúng, gần gũi sắp tới này.\n\nCảm ơn mọi người đã luôn đồng hành.\nAI không phải tương lai – mà là thực tại đang diễn ra từng ngày.\nVà chúng ta – những người dám thử, dám sáng tạo – chính là những người đang định hình nó.\n\nHẹn gặp lại sớm nhé! 💫","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-11-13T10:22:55.057602Z","updatedAt":"2025-11-18T09:09:50.49868Z","upvotes":35,"comments":50,"thumbnailUrl":"https://image.video.skool.com/7lDCq1iJxReC02AC1Hg8pwkaprNCqI1mjHFV00h9uP01B8/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTE2NzE1Nzc1LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiN2xEQ3ExaUp4UmVDMDJBQzFIZzhwd2thcHJOQ3FJMW1qSEZWMDBoOXVQMDFCOCIsInRpbWUiOjAsIndpZHRoIjoxMjgwfQ.N6BldwoVJDFV2TvFpg0cU4zyJ4TZs0rwKi2hEo6AVilki6BkMpxlD8K7XGG_Gs8jYGCi7to4USLVeBFmzElxLjCd-TonayDKv13QVmfDm9FnINQxvSCMKZrUxuUspOtZ81El9PiTBzZUCXyd32DOoIgnZNUHhYB1xpxJd3iwCNnEPPNm5_EbfqFSaGpXFj7_Ikxv5sHK1wrq8_6UAT-G-b5ilehS1WEPRo9oKmN6AlK-_gyUeJq8jqBg-wNYnFG6u38zDt8iS-Mw4k9W_dNcarXiuPclf0xT1pY0NagtMnz8X8SkhES3Gne75wxWjrAFsL3NC-r1iu9AN4hGYeyisQ","thumbnailLocal":"post-thumbs/5458003bd0428f64.png","videoIds":"5892a6d27e5b43eb943ba6974e8ee327","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/workshop-vml-vietnam-va-ai-ban-doanh-cua-ai-ker-xuat-hien"},{"id":"3b392106b5034f9c9113bf7075beaeb8","slug":"ai-era-thoi-ai-ma-ban-cang-lam-cang-fail-cang-len-trinh","title":"🔥 AI Era – Thời đại mà bạn càng làm, càng fail - càng lên trình.","content":"Gần đây, mình có cơ hội trò chuyện và làm việc cùng nhiều đơn vị lớn – từ các brand toàn cầu như Google Gemini, Meta, CapCut AI \\(Bytedance\\), đến các agency hàng đầu tại Việt Nam. Họ đều chia sẻ những góc nhìn rất rõ ràng: AI không phải là tương lai xa nữa – nó là “hiện tại” đang diễn ra mỗi ngày.\n\nHiện tại, AI đang giúp mọi người dễ dàng hơn trong việc thể hiện góc nhìn sáng tạo. Dù bạn là marketer, designer, editor hay filmmaker… bạn đều có thể “đạo diễn” được trí tưởng tượng của mình – không cần kỹ thuật cao siêu, chỉ cần bắt đầu thử.\n\nNhưng AI dễ không có nghĩa là con người không còn giá trị. Ngược lại, khi mọi thứ dễ tiếp cận hơn, thì thứ duy nhất còn lại là “tư duy sáng tạo” của bạn.\n\nMình biết, có những người còn sợ AI, còn nghi ngờ… nhưng thời gian sẽ trả lời. Bạn không cần phải thích AI, nhưng nếu bạn không dùng – bạn sẽ rất khó để bắt kịp trong tương lai.\n\n📌 Cách đây 6 tháng, mình thử mọi model – kết quả ban đầu dở tệ, xấu, không có gì hay ho. Nhưng mình không bỏ. Mỗi lần thử – mình hiểu hơn AI có thể làm được gì. Hiểu hơn workflow nào phù hợp. Và từ đó – hiểu hơn và lên trình nhanh chóng trong việ ứng dụng AI.\n\n✨ Đây là lý do vì sao cộng đồng AI Worker tổ chức game, bài tập, worksho – không phải để tìm người giỏi, mà để ai cũng dám thử, dám sai, dám làm \\(và chắc chắn không ai phán xét bài post của bạn - vì chúng ta đều biết, bạn đang trên hành trình của mình\\)\n\n🧠 Tư duy cốt lõi của thời đại này là:\n“Làm nhiều – sai nhiều – học nhanh.”\nThử, sai, làm lại – rồi một ngày bạn sẽ giỏi hơn chính bạn bây giờ rất xa.\n\n💬 Và như Jess Wiseman từng nói trên TEDx:\n\n“Năng lực kỹ thuật \\(technical execution\\) không còn là đặc điểm hiếm hoi nhất nữa. Những gì thực sự phân biệt chúng ta không phải là tài năng, kỹ năng, hay thậm chí là ý tưởng, mà là sự sẵn lòng thất bại đủ nhanh, đủ thường xuyên và đủ cởi mở.”\n\nHãy tận dụng thời đại này, vì mọi công cụ đã sẵn sàng \\(và nó sẽ càng tốt hơn nữa\\).\nVấn đề chỉ là: Bạn có dám bắt đầu không?\n\nP/s: Bên dưới là hình ảnh AI đầu tiên \\(Midjourney\\) - Video AI đầu tiên \\(LoRA - Kling 1.6\\) - Và Video AI gần đây nhất \\(hôm qua\\). Nếu được thì bạn cũng show hành trình của bạn ở dưới cmt nhé, cùng ngắm nhìn lại bạn đã đi được bao xa 🙌","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-11-11T08:06:06.677763Z","updatedAt":"2025-11-27T00:48:51.262009Z","upvotes":40,"comments":27,"thumbnailUrl":"https://image.video.skool.com/PmLxmcgq6qvoSzdjijYliaj27JUGnE2eesmRKn02vq9g/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTE2NjE0NjA2LCJraWQiOiJPVjIwMH /assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/4bc8c048bbc5445bb109420923c860c0279bb53c7c7c4a4d9da09bb44924b4ca.png","thumbnailLocal":"post-thumbs/9033d5f50766fe5f.png","videoIds":"","attachments":"a3a0e802a22949d58aa98f891db8534a","postUrl":"https://www.skool.com/ai-ker-8924/cap-nhat-moi-cho-course-ai-yourself"},{"id":"671697a959b74c43b10505d6a63651c5","slug":"chia-se-tu-buoi-meet-voi-vml-vietnam","title":"Chia sẻ từ buổi meet với VML Vietnam ✨","content":"Mình Vừa có buổi gặp gỡ & trò chuyện cùng VML Vietnam – một trong những Global Creative Agency hàng đầu thế giới!\n\nVML là agency thuộc WPP – tập đoàn truyền thông lớn nhất toàn cầu, với hàng trăm văn phòng ở khắp nơi và đang là đối tác chiến lược của nhiều thương hiệu lớn. Lần này, mình có cơ hội chia sẻ về hướng đi mới của AI Creative và nghe thêm về nhu cầu thực tế từ thị trường. Rất nhiều góc nhìn hay ho đang chờ được bật mí 🎬 Và màn collab tạo thêm nhiều cơ hội cho chính cộng đồng AI-Ker chúng ta sắp tới ♥️\n\nTrong video là anh Bảo \\(Head Strategy của VML - định cư tại Pháp nhưng vừa về Việt Nam để đồng hành\\) và anh Việt \\(Creative Director - CD của VML\\). Ngoài ra, Toàn cũng có cơ hội được gặp chị Hà \\(CEO của VML\\). Thật sự ấn tượng và choáng ngợp trước không gian làm việc vô cùng sáng tạo của VML, đặc biệt là những tầm nhìn lớn lao từ các anh chị 🥰\n\nMong muốn của T là kết nối và mang lại giá trị cho cộng đồng AI-Ker cũng như thị trường AI Creative tại Việt Nam. T đang trên hành trình đó - cùng mọi người. Keep Going mn ơiiii!\n\n🤩 Nếu buổi meet offline tới của cộng đồng mình tổ chức ở đây – trụ sở VML Việt Nam – thì bạn thấy sao?","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-11-06T08:24:37.77474Z","updatedAt":"2025-11-14T04:34:56.781459Z","upvotes":38,"comments":34,"thumbnailUrl":"https://ima a9ff44bb.jpg","createdAt":"2025-11-03T07:59:16.777424Z","updatedAt":"2025-11-14T10:34:43.907214Z","upvotes":74,"comments":86,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/30ede1955d2242f1a63e0067f75ce02603e33444cd314ac2a22218a41d17c5ed.png","thumbnailLocal":"post-thumbs/981536fb9330cc23.png","videoIds":"","attachments":"e1b072d514704fdab0d09cb497df04ac","postUrl":"https://www.skool.com/ai-ker-8924/ai-ker-community-at-moc-2000-thanh-vien"}]},{"title":"Tháng 11, 2025 PART 2","url":"https://www.skool.com/ai-ker-8924/classroom/977b3b50?md=8eda8fa97917472dbe0f829bacbc6198","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Tham gia buổi \"},{\"type\":\"text\",\"marks\":[{\"type\":\"link\",\"attrs\":{\"class\":\"link\",\"href\":\"https://www.skool.com/ai-ker-8924/calendar\",\"rel\":\"noopener noreferrer\",\"target\":\"_blank\"}}],\"text\":\" Live thứ 7 hằng tuần \"},{\"type\":\"text\",\"text\":\"Để cập nhật tin tức mới nhất!\"}]},{\"type\":\"horizontalRule\"}]","domContent":"<div class=\"styled__EditorInnerWrapper-sc-1cnx5by-1 htfMPD\"><div class=\"styled__EditorContentWrapper-sc-1cnx5by-2 bXbSDs\"><div contenteditable=\"false\" translate=\"no\" class=\"tiptap ProseMirror skool-editor2\"><p>Tham gia buổi <a target=\"_blank\" class=\"link\" href=\"https://www.skool.com/ai-ker-8924/calendar?utm_campaign=skool_link_classroom&amp;utm_content=d2099b9572be43a39c266ef9a616e916\" title=\"https://www.skool.com/ai-ker-8924/calendar?utm_campaign=skool_link_classroom&amp;utm_content=d2099b9572be43a39c266ef9a616e916\"> Live thứ 7 hằng tuần </a>Để cập nhật tin tức mới nhất!</p><hr contenteditable=\"false\"></div></div></div>","posts":[{"id":"440913474e624b73a9b3108da817c075","slug":"metaai-workshop-cong-ong-chuyen-gia-ai-viet-nam","title":"Meta.AI workshop & cộng đồng chuyên gia AI Việt Nam","content":"🔥 Hôm qua mình vừa có buổi gặp gỡ & kết nối với nhiều chuyên gia AI hàng đầu tại Việt Nam – những người đã từng mang sản phẩm AI của mình ra tận bảo tàng AI tại Mỹ, Hàn Quốc,... và làm việc với khách hàng thật trong thế giới thật.\n\nNghe thì tưởng xa xôi, nhưng thực ra AI Creative đang gần hơn bao giờ hết. Và mình đã tranh thủ kết nối với các anh chị, chúng ta sẽ có một series podcast đặc biệt ngay trong cộng đồng AI Worker – nơi các anh chị chia sẻ cách họ làm việc với AI, đưa hình ảnh thành sản phẩm thật, và kể câu chuyện bằng AI ra sao.\n\n✨ Người thật, việc thật – nên chắc chắn sẽ truyền cảm hứng rất lớn cho những bạn đang bắt đầu hoặc muốn đi xa hơn trong hành trình với AI.\n\n📌 Và đừng quên, tối nay lúc 19:00, mình sẽ host một buổi meeting online nho nhỏ để chia sẻ thêm về chủ đề này và mở rộng câu chuyện về \"AI bước ra thế giới thật\".","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-11-29T07:44:46.876125Z","updatedAt":"2025-12-06T10:20:53.344306Z","upvotes":42,"comments":29,"thumbnailUrl":"https://image.video.skool.com/YkYwEPkd6ipLlUTnA5pYXkr89d5vme02XXC8a6aB88bI/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTE4MDg4Njg2LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiWWtZd0VQa2Q2aXBMbFVUbkE1cFlYa3I4OWQ1dm1lMDJYWEM4YTZhQjg4YkkiLCJ0aW1lIjoxLjAwNywid2lkdGgiOjEyODB9.FK863zjWClHIWuUEKhbYcNAZAWlc9go8Jbr8tZmr2RK5yDiRDvsZqWvd1a3CgyHciV6i014pPmbOddmAu_vU5aTgyR1RRwfyesSI23QJbsnLUG2UIwpntJHn0CtAsd4Ib_DCbIWnPg1780B1ovcNDF6WpMKsyf2FylwkQJptnZ0cwEW3IE3sVXr00EJd897Ua2mByddSiVhj7oSAongrlJ6dipr_CF9LDhUhMgHXXEmMWUu00DuI6VO8UXSD46qMj05Pyei9lm3Nj5aIo9jeeKf_WygptYVa_d0-3oxwAl-H8gYNDSrtVzpZeQTxtHdkjfEQ-SRLcH-wAy-PKmT0zQ","thumbnailLocal":"post-thumbs/39029cb98c27963a.png","videoIds":"39086c5af0b3402386da8f0b60ae7baf,5eeb606c94594c70ae6140aa521a4084","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/metaai-workshop-cong-ong-chuyen-gia-ai-viet-nam"},{"id":"f8f4fa8ef12a4ac1ae10745033789960","slug":"hoan-thien-buc-tranh-ai-ker-ver-1-mo-course-ai-yourself-cho-tat-ca","title":"Hoàn thiện bức tranh AI-Ker ver 1 + Mở Course AI YOURSELF cho tất cả","content":"Halo cả nhà, Game 4 - AI YOURSELF vẫn đang diễn ra tới hết tháng này!\nMình sẽ tổng hợp ảnh art mà mn tham gia để up lên Big Picture của cộng đồng – bộ sưu tập AI chân dung đỉnh nhất của AI-Ker ✨ Rồi từ đó có thể add vào \"đại bản doanh\" của chúng ta!\n\nĐể mn có mặt đầy đủ trong cái bảng \"vàng\" này thì mình chính thức mở Course AI Yourself cho toàn bộ cộng đồng, để ai cũng có thể tạo nên bộ đôi ảnh chân dung + ảnh nghệ thuật của chính mình bằng AI.\n\n👉 Course đã có sẵn trong phần Classroom – vào học liền nha.\n\nAi muốn thách đấu ai trong nhóm – tag tên họ vào bài thi của mình, rủ nhau chơi tới bến 😎 ví dụ: [@Truc Tran](obj://user/79e4be6dfa68413584d03e0ac35c1578) [@Nguyen Lam](obj://user/e6745e49d63e428e9aef8a8f74e5163a) [@Nguyen Le](obj://user/b3ccbf4d82ac45668cb1a62b68816a89) [@Khải Phạm](obj://user/fac5db566ffb4a1ea622702479217939) [@Nguyễn Nam](obj://user/758cfb65352f426ca57cf19478008890) [@Lê Thoại](obj://user/7fcbf1cf1f3a4cc38ff1cd327530220d) [@Duy Thành](obj://user/3fe307513c44480d988ca9eed67bb59a),... @AI-ker - thách mấy người join game 4 😆\n\nLet's glow up – AI hóa bản thân thật chất để thế giới AI biết bạn là ai 💥","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-11-27T07:46:34.371173Z","updatedAt":"2025-12-04T04:43:08.101235Z","upvotes":32,"comments":30,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/b569be23e68f4618af08dde455b010d9b4b666923cf140c5b8f39f12cc6ccd4a.png","thumbnailLocal":"post-thumbs/743343d23ea69b28.png","videoIds":"","attachments":"f8238b1f799f48c6a6dba0a2d4c4893d","postUrl":"https://www.skool.com/ai-ker-8924/hoan-thien-buc-tranh-ai-ker-ver-1-mo-course-ai-yourself-cho-tat-ca"},{"id":"c47da8f15d18415c838e53c013391214","slug":"ai-2026-buc-tranh-ngan-han-va-nhung-buoc-nhay-dai-hoi","title":"🤖 AI 2026: Bức tranh ngắn hạn và những bước nhảy dài hơi","content":"Tuần này, mình có cơ hội trò chuyện với nhiều anh em top-tier trên thế giới về AI Creative \\(Benjamin Benichou, Rourke,...\\) – những người đang thực sự xây dựng nên tương lai của ngành này.\n\nVà một điều rõ ràng: chỉ trong 6 tháng qua, thế giới AI Image đã \"tiến hoá\" siêu nhanh. Từ những hình ảnh đơn giản, giờ đây bạn có thể dùng AI để thay đổi sản phẩm, thay model, kiểm soát từng chi tiết nhỏ… thứ mà cách đây 1 năm trước phải dùng đến comfyUI để kiểm soát rất phức tạp. Và Nano Banana Pro ra mắt làm cho thị trường AI hình ảnh phát triển ở mức có thể đưa ra thị trường được!\n\n💥 Nhưng mọi chuyện chưa dừng ở đó…\n\nTrong 6 tháng tới, AI Video sẽ là cuộc chơi mới! Bạn có thể chọn từng chi tiết trong video và thay đổi dễ dàng như khi chỉnh ảnh. Những từ khoá như: tracking point, AI tracking, motion editing bằng prompt… đang dần thành hiện thực.\n\nVà mình được \"hint\" rằng có thể ngay tuần này hoặc tuần sau, Kling sẽ tung update khủng đầu tiên về tính năng này. Sau đó, sẽ có hàng loạt đối thủ khác cùng vào cuộc. Một cuộc đua mới chính thức bắt đầu ở thị trường AI Image\n\n🎯 Vậy nên mình muốn viết bài này để nhắc nhở anh em một điều:\n👉 Đây là thời điểm vàng để cập nhật nhanh – để đón đầu, không bị bỏ lại.\n👉 Và AI-Ker tồn tại chính vì lý do đó – để anh em luôn UPDATE cùng thị trường GLOBAL. Việt Nam không được tụt lại với trend AI thế giới!\n\n🗓 Tối thứ 7, trong buổi meet onl cộng đồng, mình sẽ nói sâu hơn về tương lai gần của AI Creative.\nNếu bạn có dự đoán gì cho AI 2026, đặc biệt là AI Video – hãy comment dưới bài này nhé, cùng nhau phân tích 📌\n\nSee you!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d sự tập trung vào thị trường Việt Nam trong thời gian tới.\nTrong tuần này, T sẽ tiếp tục gặp gỡ, trao đổi, update cho mn và hy vọng AI-Ker sẽ trở thành một trong những cộng đồng tiên phong về update, sản phẩm và demo từ [Meta.ai](http://Meta.ai) tại Việt Nam.\n🚀 Nếu bạn là AI artist, AI creative designer, filmmaker hay marketer sử dụng AI – hãy tiếp tục phát triển, chia sẻ những tác phẩm chất lượng nhé. Tất cả đang cho thấy tín hiệu chúng ta sắp được chứng kiến sự chuyển mình của một kỷ nguyên AI mới.\n\nKeep Going - Keep Creative with AI Creative ✊","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-11-25T06:13:08.772681Z","updatedAt":"2025-11-27T11:28:19.984627Z","upvotes":38,"comments":47,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/e62d76258a6d41eabd599cef154714967ee207b89d844656ac0f4db29b7aedbc.png","thumbnailLocal":"post-thumbs/c35c9f95a2877867.png","videoIds":"","attachments":"bb9381950263449fa24d78735bba68e2,095d985385594aaa974988576f4247a2,4ae16606e725462b93d0d761408a66ba","postUrl":"https://www.skool.com/ai-ker-8924/gap-go-metaai-va-inh-huong-ai-ker-trong-tuong-lai"},{"id":"45ca17dda13749468095e0f7b221468a","slug":"chuc-mung-nguoi-chien-thang-game-3-techcombank-x-ai-worker","title":"🎉 CHÚC MỪNG NGƯỜI CHIẾN THẮNG GAME 3 – TECHCOMBANK x AI WORKER 🎉","content":"Xin chúc mừng [@Nguyen Lam](obj://user/e6745e49d63e428e9aef8a8f74e5163a) sau bao nhiều Game lọt top thì cuối cùng đã trở thành quán quân của Game 3 với sản phẩm AI TVC cho Techcombank! 🎬\n🏆 Phần thưởng: $100 tiền mặt + gói đăng ký bất kỳ công cụ AI \\(tối đa $50\\)\n\nCảm ơn Lâm đã đầu tư nghiêm túc và dành nhiều thời gian cho sản phẩm lần này – rất đáng ghi nhận truyền cảm hứng và được đánh giá cao từ client💪\n\n👏 Và gửi lời cảm ơn đến các thành viên đã tham gia và cống hiến những video chất lượng trong game 3:\n[@Hanh Nguyen](obj://user/e755eb8b4f3d4b509ca8ecdd17110e2b) – [@Nguyen Le](obj://user/b3ccbf4d82ac45668cb1a62b68816a89) – [@Lê Thoại](obj://user/7fcbf1cf1f3a4cc38ff1cd327530220d) - [@Khải Phạm](obj://user/fac5db566ffb4a1ea622702479217939) - [@Nguyễn Nam](obj://user/758cfb65352f426ca57cf19478008890) đã rất đầu tư và có những sản phẩm tuyệt với 👏👏👏 T tin rằng qua game này, các bạn đã có những bước tiến đáng kể, từ việc tích lũy kinh nghiệm làm việc với client thực tế khi ứng dụng AI, đến việc nâng cao kỹ năng dựng TVC, quy trình làm việc, storyboard,... Hy vọng rằng trong các game tiếp theo, các bạn sẽ tiếp tục phát huy và thể hiện sự tiến bộ của mình ❤️\n\nHẹn gặp cả nhà Game 4 \\(sớm thôi\\) game sẽ dễ hơn xíu ha \\(hoặc không :V\\) Hi vọng mn join thật mạnh mẽ để level up bản thân với AI Creative nhé!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-11-22T05:05:53.032748Z","updatedAt":"2025-12-02T16:30:20.046606Z","upvotes":35,"comments":38,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/b4f3cc0df6074e6fb94af4fbd722fef87326621f361b4aaa99dd98c203fbb094.png","thumbnailLocal":"post-thumbs/67a90ebcf8530c7a.png","videoIds":"","attachments":"0fdc68d78a9948088730825a5bdf1e2f","postUrl":"https://www.skool.com/ai-ker-8924/chuc-mung-nguoi-chien-thang-game-3-techcombank-x-ai-worker"},{"id":"07c384f45f054e7b822ce0848f563258","slug":"update-tong-quan-nano-banana-pro","title":"🚨 UPDATE TỔNG QUAN NANO BANANA PRO","content":"Mình vừa đăng 1 video ngắn chia sẻ nhanh về những tính năng cực mạnh của model mới từ Google – Nano Banana Pro \\(Gemini 3 Image\\). Không chỉ dừng lại ở việc tạo ảnh đẹp, model này đang đi xa hơn với khả năng tư duy hình ảnh, giữ nhân vật liên tục, chỉnh sửa nhiều lượt như nói chuyện với designer thật sự, và cả truy cập Google Search theo thời gian thực để hiểu rõ ngữ cảnh.\n\n🧠 Tối nay, trong buổi gặp gỡ offline, tụi mình sẽ cùng mổ xẻ sâu hơn về model này – từ cách ứng dụng thực tế, đến các workflow phù hợp cho anh em AI Creative. Ai đã test rồi hoặc có câu hỏi, nhớ mang theo để cùng chia sẻ nhé!\n\n📍Thời gian: 19h30 tại At the Edge \\(đã có ghim thông tin ở đầu trang - hoặc mục calendar\\)\n📍Recap: Mình sẽ cố gắng recap lại cho mọi người không đến được, nên đừng lo!\n\nCác bạn nghĩ sao về model mới này? Và đại trà hoá của nó ảnh hưởng tới thị trường như thế nào?","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-11-21T08:52:04.792137Z","updatedAt":"2025-12-10T15:31:10.864349Z","upvotes":30,"comments":30,"thumbnailUrl":"https://image.video.skool.com/FAxZ8gt2UbAP1m9El1sueEM8qIEcKIRytgJtzrEF2SA/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTE3NDAxNTI0LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiRkF4WjhndDJVYkFQMW05RWwxc3VlRU04cUlFY0tJUnl0Z0p0enJFRjJTQSIsInRpbWUiOjEuNDY3LCJ3aWR0aCI6MTI4MH0.AMJXbmhUfFuurJ0S-RvKS8RMFKBVZW-EdCUloCbvBC2pxyUmQ8HN7Qvrr-Jgob7WBxpMaIYi9NnaAO79Wv1TmzD8UEVkny2v1R7eVSL7so_te6TvsQkuZ57LxNiNjwKsCoRnkU07UtJzyZok9RDrbGdb2c1RGMyOHUFCZb6Rt9bqpEqp485VpIUud7AYZG2dGLZF2qDsK6ePpK_n-nIokmMsweAK3D0Zwznp-jeC3Bdy_9lNb5QrYCY9XVwdelmBVSQDjYeUlogctzb9mpMCZkv95twqZKPr_phLYwL1OXYp59Ct9SCchDbmrW0M6KTsz5so5bQ4qjFavcbcQ9FnZA","thumbnailLocal":"post-thumbs/58b9cbc31fc21647.png","videoIds":"a86e2e412d0c431b8231ab2ef8eb683b","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/update-tong-quan-nano-banana-pro"},{"id":"e3ff42e8262a4303bdb9c67b7323286e","slug":"update-moi-course-heygen-basic-guide-a-uoc-cap-nhat","title":"🔥 UPDATE MỚI: Course HeyGen Basic Guide đã được cập nhật!","content":"Hello cả nhà, Mình vừa cập nhật Course Heygen với loạt tính năng mạnh mẽ:\n✨ Nhân bản bản thân \\(AI Twin\\) - Làm video không cần tự quay video nữa\n🎙️ Lipsync mượt mà bản V4\n🌍 Nói video đa ngôn ngữ như người bản xứ \\(có Tiếng Việt\\)\nVà T đã ứng dụng vào video thực tế của mình\n\nNếu bạn đang cân nhắc xuống tiền dùng Heygen bản trả phí, thì nên xem qua video này trước — để biết nó có thực sự phù hợp với nhu cầu của bạn không.\n\n👉 Xem tại lớp học AI-Ker: [https://www.skool.com/ai-ker-8924/classroom](https://www.skool.com/ai-ker-8924/classroom)","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-11-20T10:17:49.8966Z","updatedAt":"2025-11-27T13:56:05.470052Z","upvotes":33,"comments":19,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/b0b4077972b54faa816db3d52a96dc9170e8b383d20d4b5db254e2ae8df1dede.png","thumbnailLocal":"post-thumbs/4fc138d085a4c0f3.png","videoIds":"","attachments":"0eeecd784a124c4c96920b83da30551a","postUrl":"https://www.skool.com/ai-ker-8924/update-moi-course-heygen-basic-guide-a-uoc-cap-nhat"}]},{"title":"Tháng 12, 2025","url":"https://www.skool.com/ai-ker-8924/classroom/977b3b50?md=99d259ec7a4447c0b0361761aa8516aa","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Tham gia buổi \"},{\"type\":\"text\",\"marks\":[{\"type\":\"link\",\"attrs\":{\"class\":\"link\",\"href\":\"https://www.skool.com/ai-ker-8924/calendar\",\"rel\":\"noopener noreferrer\",\"target\":\"_blank\"}}],\"text\":\" Live thứ 7 hằng tuần \"},{\"type\":\"text\",\"text\":\"Để cập nhật tin tức mới nhất!\"}]},{\"type\":\"horizontalRule\"}]","domContent":"<div class=\"styled__EditorInnerWrapper-sc-1cnx5by-1 htfMPD\"><div class=\"styled__EditorContentWrapper-sc-1cnx5by-2 bXbSDs\"><div contenteditable=\"false\" translate=\"no\" class=\"tiptap ProseMirror skool-editor2\"><p>Tham gia buổi <a target=\"_blank\" class=\"link\" href=\"https://www.skool.com/ai-ker-8924/calendar?utm_campaign=skool_link_classroom&amp;utm_content=d2099b9572be43a39c266ef9a616e916\" title=\"https://www.skool.com/ai-ker-8924/calendar?utm_campaign=skool_link_classroom&amp;utm_content=d2099b9572be43a39c266ef9a616e916\"> Live thứ 7 hằng tuần </a>Để cập nhật tin tức mới nhất!</p><hr contenteditable=\"false\"></div></div></div>","posts":[{"id":"c476dee254ec402097df99e18f5bc25d","slug":"gioi-thieu-speaker-2-anh-thai-anh-tu-nuoc-uc","title":"GIỚI THIỆU SPEAKER #2: anh Thái Anh Nguyễn","content":"Halo cả nhà, Sắp tới AI-Woker được tiếp đón một người anh mà mình thực sự ngưỡng mộ trong cộng đồng AI sáng tạo 🥰\n\nTừ 2010, anh theo học tại Đức ngành Cơ khí cho xe tự động – và đến 2015 đã tốt nghiệp với đồ án về Computer Vision, một trong những nền tảng quan trọng của AI ngày nay 🤯\n\nTừ năm 2016, Thái Anh trở thành Creative Director, đồng sáng lập agency thiết kế Vi-Design tại Frankfurt, cộng tác cùng nhiều brand F&B, mỹ phẩm tại châu Âu. Sau đó, anh tham gia viết nội dung game cho Axie Infinity – một bước chuyển rất thú vị giữa công nghệ, game và sáng tạo toàn cầu!\n\n📌 Hiện tại, anh đang sống tại Đức, làm việc với các thương hiệu lớn và ứng dụng AI vào visual sáng tạo – từ ý tưởng đến sản phẩm thực tế.\nĐặc biệt là dự án [COMEMO.VN](http://COMEMO.VN) - thư viện lưu trữ kí ức tập thể với giá trị rất nhân văn về việc giữ gìn văn hoá.\n\nBuổi trò chuyện sắp tới sẽ là một nguồn cảm hứng cực lớn cho anh em AI-Worker đang muốn phát triển sự nghiệp một cách nghiêm túc. Và những góc nhìn rất sâu sắc của anh trong việc phát triển ở thời đại AI này. Đừng bỏ lỡ! 👀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-17T13:57:59.963887Z","updatedAt":"2025-12-23T05:57:01.32566Z","upvotes":28,"comments":29,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/3382c3eaaa08495d9b3e9682e6cfba6771d1a99fff6847e39e18be61c42dc3e6.png","thumbnailLocal":"post-thumbs/1a9120d8ed9b7820.png","videoIds":"","attachments":"f2e48767dbc345cda208d3c3ec35dcdc,540897cac39f4a388b3cbc437eb007ed,4385a561a6174e7ca3ab9110e7f1a8a4,ce2d91ee792c405ca09e94ea7627714f,96d93a820d7747d995ca62cf97c59d82,931438ccf72845a0bf8dc6971dccf81d,9022302fc056412abe8863fa8283342e,1b95c3bfacc54840bed97fd9f6cf4e61","postUrl":"https://www.skool.com/ai-ker-8924/gioi-thieu-speaker-2-anh-thai-anh-tu-nuoc-uc"},{"id":"6015682d506849699bbcea7a77ff0a5c","slug":"vua-cap-nhat-course-moi-ai-creative-workflow-basic-guild","title":"🔥 Vừa cập nhật Course mới: “AI Creative Workflow Basic Guild”","content":"Hello mọi người, gần đây có khá nhiều bạn mới join chưa biết bắt đầu từ đâu nên:\nToàn vừa up một video cực kỳ nền tảng và quan trọng cho tất cả ai đang muốn dùng AI trong công việc sáng tạo.\n\nĐó là Course về Workflow AI Creative, giúp bạn hiểu rõ, mapping cách giao tiếp với AI, từ text → image, image → video... và cách kết hợp các công cụ để tạo ra quy trình làm việc hiệu quả.\n\nTrong thời đại AI hiện tại, kỹ năng giao tiếp với AI \\(talk with AI\\) là một trong những skill quan trọng nhất.\n\n📌 Xem ngay video này trong mục classroom - WORKFLOW AI CREATIVE.\nOr link: [https://www.skool.com/ai-ker-8924/classroom/049462ce?md=c7fe1e37183d4481b30f5527d843c9ce](https://www.skool.com/ai-ker-8924/classroom/c11e3e83?md=11a4561239b748b497c25bb0f58288c4)\n\nvà đảm bảo bạn xem đầy đủ – vì đây là nền tảng giúp bạn đi xa hơn với AI creative.","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-16T07:05:11.434792Z","updatedAt":"2026-04-22T05:01: s":35,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/a806f7ced8f84cc28ec430c7fd4066b2a0b21ec1e3f841e08dee504b703a30a8.png","thumbnailLocal":"post-thumbs/8c479785cd5e720c.png","videoIds":"","attachments":"74605828999946a8b5aad01862643147","postUrl":"https://www.skool.com/ai-ker-8924/meta-chinh-thuc-bat-tay-voi-elevenlabs"},{"id":"7c368de395c44310b059d047dbea650b","slug":"interview-1-jiuhan-nguoi-that-viec-that-lam-ai-that","title":"🎙️ Interview #1: JIUHAN – Người thật, việc thật, làm AI thật!","content":"Halo cả nhà, TaiOn mình vừa ra mắt video đầu tiên của chuỗi interview trong cộng đồng – và vị khách mời lần này là chị Jiu Han [@Jiu Han](obj://user/1682b827e28e41c49fee3a493b974d41), một AI Creator với profile cực khét 🔥\n\nTrong video này, tụi mình deep dive vào chủ đề:\n👉 Làm sao đưa AI Creative từ Việt Nam ra quốc tế?\n\\(Jiu Han đã từng mang tác phẩm AI đến triển lãm tại bảo tàng ở Mỹ, Đài Loan – không đùa đâu!\\)\n👉 Chia sẻ kinh nghiệm làm job AI thật với khách hàng thật. Từ mindset, quy trình đến phản hồi thực tế.\n\n🎯 Đây là những thứ rất \"real\" – không lý thuyết suông, mà là chia sẻ từ một người đang làm nghề mỗi ngày.\n\nVà video này mới chỉ là mở màn cho series phỏng vấn những người đang thực sự làm việc trong ngành AI Creative. Cộng đồng mình sẽ còn rất nhiều nội dung chất lượng như thế để mọi người cùng học hỏi & phát triển.\n\n👉 Xem interview tại đây: [https://www.skool.com/ai-ker-8924/classroom/e5bdecf3?md=e0fedb9f02ce4adfa285693afa19acf4](https://www.skool.com/ai-ker-8924/classroom/e5bdecf3?md=e0fedb9f02ce4adfa285693afa19acf4)\nhoặc vào mục Classroom - Interview AI Industry\n\nEnjoy và tiếp tục cùng nhau xây cộng đồng AI Creative thật vững! 🚀","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-14T06:04:10.9794Z","updatedAt":"2026-01-05T15:48:13.007095Z","upvotes":37,"comments":41,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/d42f01e871de4a4b87bde7e8fe6af166295ef3d583f24d3bab9a5023ea7fc196.png","thumbnailLocal":"post-thumbs/a9f2ce3e97fedd0c.png","videoIds":"","attachments":"97726de4fe794d56bb1fcfa5bf974fb3,10cddac9a5b54bceab8fdfb7de814ffc","postUrl":"https://www.skool.com/ai-ker-8924/interview-1-jiuhan-nguoi-that-viec-that-lam-ai-that"},{"id":"b7d1d941a1144b5f968996bb700f5fc6","slug":"khao-sat-nhanh-ai-a-san-sang-nhan-job-ai-creative-that","title":"📣 [KHẢO SÁT NHANH] Ai đã sẵn sàng nhận job AI Creative thật?","content":"Hello cả nhà. Toàn vừa tạo một form khảo sát nhỏ để tìm hiểu ai trong cộng đồng đã sẵn sàng nhận job thật với AI Creative.\nNếu bạn đã sẵn sàng, chỉ cần điền thông tin vào form – mình sẽ lưu lại để ưu tiên khi có dự án phù hợp từ nền tảng hoặc đối tác.\n\n✅ Đây là cơ hội thật, job thật, yêu cầu skill thật.\nCộng đồng mình không chỉ học, mà còn hành và make money từ AI \\(thực tế\\)\n📝 Link [https://forms.gle/3QaPBpkczxL4emog7](https://forms.gle/3QaPBpkczxL4emog7)\n\nTự tin cứ lên sàn nhé kkk, chỉ vậy thoi, hẹn cả nhà meet tối nay 20h","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-13T09:28:18.00811Z","updatedAt":"2025-12-17T13:22:33.450601Z","upvotes":22,"comments":20,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/f6078b6c2e024c1fb170f8109050bfc6129f650fd6b34ec5bdbc8909f44c5887.png","thumbnailLocal":"post-thumbs/bacee64bc92f5c51.png","videoIds":"","attachments":"3ce36f2cfd2e4a528bae6c4699c5e642","postUrl":"https://www.skool.com/ai-ker-8924/khao-sat-nhanh-ai-a-san-sang-nhan-job-ai-creative-that"},{"id":"522d485998494563ad0a835d4c1fe3a5","slug":"new-course-ai-creative-the-first-job","title":"📢 [NEW COURSE] AI CREATIVE: THE FIRST JOB","content":"Hello anh em,\nMình vừa cập nhật course mới trong Classroom:\n👉 AI Creative: The First Job\nTrong course này, mình sẽ chia sẻ:\n[ul][li]Toàn cảnh thị trường AI Creative tại Việt Nam \\(góc nhìn cá nhân, đã trải qua các dự án thật\\)[li]Làm sao để có job đầu tiên từ chính kỹ năng AI của bạn[li]Và điều quan trọng nhất: bạn nên bắt đầu từ đâu để tạo “cú cắn đầu tiên” \\(first paid job\\)\n\n🎯 Đây là nội dung rất quan trọng dành cho những bạn muốn thật sự đi lâu và đi xa với ngành này, không chỉ học chơi cho vui.\n\n⏳ Hãy dành thời gian xem video trong course này.\nMình tin nó sẽ là kim chỉ nam cho rất nhiều bạn đang muốn phát triển và có job từ AI trong năm 2025.\n\n[https://www.skool.com/ai-ker-8924/classroom/c868a09c?md=eaffe68961af4500962f0e91213526ec](https://www.skool.com/ai-ker-8924/classroom/c868a09c?md=eaffe68961af4500962f0e91213526ec)","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-12T11:38:25.279025Z","updatedAt":"2025-12-16T15:38:02.591234Z","upvotes":29,"comments":30,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/e03c7da0898648b49dc95c8e1038f1f864337b3efc7849a1870d12fbf1ef3b87.png","thumbnailLocal":"post-thumbs/81fe8fc0845a7873.png","videoIds":"","attachments":"b1051da5c4674ead9b87d6e55f6114be","postUrl":"https://www.skool.com/ai-ker-8924/new-course-ai-creative-the-first-job"},{"id":"236c99274a2647ceae83bad1def6927b","slug":"ai-creative-jobs-a-xuat-hien-o-viet-nam","title":"📣 AI CREATIVE JOBS - ĐÃ XUẤT HIỆN Ở VIỆT NAM!","content":"Vừa rồi mình bắt đầu thấy các job tuyển dụng AI Production Editor, AI Creative tại thị trường. Đây chính xác là vị trí mà chúng ta đã cùng nhau học và thảo luận trong cộng đồng thời gian qua.\n\nVà mình chỉ muốn nói: Thị trường đang thật sự bắt đầu rồi đó anh em!\n🔥 Job yêu cầu không cao, nhưng đúng \"chất\" AI Worker:\n[ul][li]Sử dụng các công cụ AI để sản xuất video[li]Có tư duy open-mind, chịu học và thử[li]Không cần quá chuyên nghiệp, nhưng cần tinh thần sáng tạo\n\n💡 Điều đáng nói: vị trí này tuy mới ở Việt Nam, nhưng mình đã được các công ty từ Hàn Quốc, Mỹ gửi lời mời tương tự cách đây 6 tháng cho tới tận bây giờ. Họ tìm những người biết dùng AI để tạo ra sản phẩm thực tế.\n\nVậy nên mình chỉ muốn nhắn:\n👉 Giờ là lúc để build portfolio! \\(bất cứ nền tảng nào, từ mxh, behance, linkin, web, slide,...\\)\n👉 Ai chưa tham gia Game 5 - CocaCola TVC thì nên bắt đầu ngay - đây là nguyên liệu hoàn hảo cho portfolio của bạn!\n👉 Tất cả những sản phẩm bạn làm ra bây giờ đều có thể là bước đệm cho sự nghiệp AI Creative. Và TaiOn/AI-Ker sẽ đồng hành cùng các bạn!\n\n🛠️ Mình sẽ cập nhật thêm một Course: AI Video trong môi trường làm việc thật \\(Market AI Work\\) cho các bạn chuẩn bị bước vào ngành này. Và đương nhiên là những kinh nghiệm của chính TaiOn trong ngành!\n\nAi quan tâm chủ đề này thì comment bên dưới nhé, Và ai đã sẵn sàng với sự nghiệp AI Creative, đã có portfolio rồi có thể share link, để mn cùng học hỏi lẫn nhau!!!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-12T06:40:31.683578Z","updatedAt":"2025-12-17T13:23:31.623907Z","upvotes":29,"comments":28,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/ad62a46300f54636a7486144675afed11155ec4d77cc48469fa119d607dc67c4.png","thumbnailLocal":"post-thumbs/9d52dcae48419661.png","videoIds":"","attachments":"5ceb9643cc334616a0b6e23ac2ad40a5,086a8bf80ee847ceaa971f3a97f275fd,10e28a266d944128b7f41e3d25ea0b0b","postUrl":"https://www.skool.com/ai-ker-8924/ai-creative-jobs-a-xuat-hien-o-viet-nam"},{"id":"add1640d6f4749ad9aa02ea1afad5661","slug":"update-new-course-kling-o1-guild","title":"🚨 UPDATE NEW COURSE: KLING O1 GUILD","content":"Halo cả nhà, như đã hứa khuya hôm qua, TaiOn vừa post course mới \"Kling O1 GUILD\" - cùng mn xem qua những khả năng của model AI video mạnh mẽ này - cũng như các ứng dụng về phần AI VFX \\(kĩ năng giá trị cao của AI Creative\\).\n\nTháng 12/2025 xu hướng làm Video AI đang chuyển dịch mạnh sang chất lượng điện ảnh \\(Cinematic\\), và tính nhất quán, kiểm soát cao. Video này sẽ giúp mọi người:\n✅ Hiểu về Model AI Video mới Kling O1 \\(AI Edit Video\\)\n✅ Nắm vững tư duy Video-to-Video: Biến video quay thường thành VFX .\n✅ Kiểm soát chi tiết \\(Control\\): Giữ chuẩn chuyển động gốc nhưng thay đổi hoàn toàn style, bối cảnh & ánh sáng.\n✅ Tối ưu quy trình \\(Workflow\\) để sản xuất video nhanh, gọn mà không cần máy cấu hình khủng.\n\n👉 Vào xem ngay để không bị tối cổ nhé! [Link đây](https://www.skool.com/ai-ker-8924/classroom/260c4e54?md=4876ed4c70f24ccda9ef4720e61ce95c)","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-09T11:29:22.554653Z","updatedAt":"2025-12-17T14:33:45.445665Z","upvotes":29,"comments":32,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/b8dafc353b974a13847a5fe070a46b91194e05ab79334de8ae247544ef9684a5.png","thumbnailLocal":"post-thumbs/a44db19721d68fcd.png","videoIds":"","attachments":"75ff26ad85114721bc056475df9feeac","postUrl":"https://www.skool.com/ai-ker-8924/update-new-course-kling-o1-guild"},{"id":"ab60ed6a12c1422e8bcfa5ac5b10287d","slug":"update-luc-nua-em-ai-cgi-ang-mo-ra-mot-nganh-hoan-toan-moi","title":"Update lúc nửa đêm - AI CGI đang mở ra một ngành hoàn toàn mới? 🎬✨","content":"Hello mọi người,\nT biết giờ là nửa đêm rồi, nhưng T vừa test thử một quy trình CGI bằng AI và... thật sự crazy! Rất hào hứng để sớm share workflow với mn 😳\n\nTrước đây, CGI \\(Computer Generated Imagery\\) là thứ chỉ dành cho phim bom tấn, cần đội ngũ lớn, thiết bị khủng, ngân sách đốt tiền.\nNhưng giờ T chỉ cần laptop thôi – đã có thể fit ánh sáng, setup concept, render các cảnh CGI đúng ý một cách mượt mà!\n\nT biết vẫn còn hơi sớm để gọi đây là “cuộc cách mạng”, nhưng thật sự cảm thấy ngành CGI bằng AI sẽ mở ra một nhánh thị trường cực kỳ thú vị trong tương lai gần.\n\n📌 À, trong vài ngày tới T sẽ tham gia chia sẻ tại sự kiện CapCut AI \\(nếu ai cũng tham gia thì hẹn gặp nhau nhé\\). Sau khi kết thúc, T sẽ update lại các module mới trong classroom, đặc biệt tập trung vào chủ đề:\n\n👉 Cách kiếm tiền từ ngành AI Creative\n\\(Người trong nghề, thị trường, khách hàng, sản phẩm số...\\)\n\nBạn nào thấy hứng thú với chủ đề này thì comment hoặc thả 👍 bên dưới nhé, T sẽ ưu tiên chia sẻ sớm hơn! or bạn có bất kì chủ đề nào muốn cùng mổ sẻ thì cứ cmt","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-08T17:14:48.244609Z","updatedAt":"2025-12-11T06:14:22.557287Z","upvotes":37,"comments":37,"thumbnailUrl":"https://image.video.skool.com/02CTonPmxa7hBp7K01eL02wWmk01w82fqZUxey01kE9ubsa8/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTE4OTAwNzA0LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiMDJDVG9uUG14YTdoQnA3SzAxZUwwMndXbWswMXc4MmZxWlV4ZXkwMWtFOXVic2E4Iiwid2lkdGgiOjEyODB9.KMrBRGksfj87OCW9SAq6hnYkjb5R41Q_Nvq11rN1G3f9PJ4M_GeOJOCK4ZDTJ2C44MuzLn65Kprb2GoOvriMZayzHIEtTCrM9xct4RO3N4bNbgeYrUJLl23pZOXGMXYKZXmeKMSSg5-A4wvL6pdYMQ5XFryhDAWhdo2P5iV3nkCx4Wm1REX21TwWdyCTnCp5uDfgMoXUUhRZmki-oxVmrfaMKWJ9ummkhhvzurbnIJfBzPXcLU9-R-dAel-16RXQ7WtPB5Mw7lxJD1z1PvzjtQde_k0M8B_QjaLACLbqSrwMKezLkwDu17SVwCTfq4MBDFWl-cs-GQhBpd9Gknzprg","thumbnailLocal":"post-thumbs/5c5b7d7a99480b1c.png","videoIds":"24081605ee6e45b0b83809843ddbcc13","attachments":"24008efa5dbc48b2a40fd9075011fa30","postUrl":"https://www.skool.com/ai-ker-8924/update-luc-nua-em-ai-cgi-ang-mo-ra-mot-nganh-hoan-toan-moi"},{"id":"806ea55dc898427e810b23648141f952","slug":"update-new-course-toan-canh-thi-truong-ai-image-122025","title":"🚨UPDATE NEW COURSE: TOÀN CẢNH THỊ TRƯỜNG AI IMAGE","content":"Halo cả nhà, TaiOn vừa post course mới Mapping lại toàn bộ thị trường AI Image hiện nay.\n\nTháng 12/2025 có quá nhiều model mới, anh em dễ bị loạn không biết dùng cái nào. Video này sẽ giúp mọi người:\n✅ Nhìn rõ bức tranh toàn cảnh & xu hướng \\(Trend\\).\n✅ Chỉ mặt điểm tên: Đâu là AI mạnh nhất \\(The Strongest\\) lúc này.\n✅ Có góc nhìn mới \\(New Point of View\\) để chọn công cụ chuẩn xác nhất.\n\n👉 Vào xem ngay để không bị tối cổ nhé! [https://www.skool.com/ai-ker-8924/classroom/23a1026a?md=1b24d39215eb4469bea1139ae0157336](https://www.skool.com/ai-ker-8924/classroom/23a1026a?md=1b24d39215eb4469bea1139ae0157336)\n\n🔥 LỊCH TỐI NAY: WEEKLY MEETING Tối nay chúng ta vẫn họp như thường lệ. Tuy nhiên, mình chỉ có đúng 30 phút để Q&A với mọi người thôi \\(do ngay sau đó mình phải có lịch thu Podcast mới cho cộng đồng chúng ta\\).\n\nAnh em tranh thủ vào đúng giờ, có câu hỏi gì về bài học mới thì mang vào hỏi luôn nhé! See ya! 👋","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-06T10:20:23.776343Z","updatedAt":"2025-12-26T10:06:05.894457Z","upvotes":35,"comments":28,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/92053d00d1574563bfcf46a352d4570c06f299f44c254349a2c96a8086308fa1.png","thumbnailLocal":"post-thumbs/99d0c5f88237ba19.png","videoIds":"","attachments":"d28c4e11292a4e719ad9f50b8d5aa704","postUrl":"https://www.skool.com/ai-ker-8924/update-new-course-toan-canh-thi-truong-ai-image-122025"},{"id":"77051cdcd54846b594c668eeb55947f9","slug":"anh-gia-kling-26-update-moi-nhat-cua-model-video-ai","title":"🎬 Đánh giá Kling 2.6 — Update mới nhất của model Video AI ","content":"Halo cả nha, đúng dịp T về quê thì thị trường AI update liên tù tì, giờ mới có thgian chia sẻ sơ bộ về cảm nhận của mình về các model mới. Kling AI vừa update model Kling 2.6 — và kết quả là… có thứ rất ổn và có cả thứ cần cân nhắc. Mọi người đọc qua phần phân tích cơ bản nhé.\n\n✅ Điểm mạnh\n\nGiữ được chất hình ảnh & vibe nghệ thuật: Da người, ánh sáng, texture — nhìn tự nhiên hơn nhiều so với một số model video AI khác. Nếu trước bạn từng thấy video AI da dẻ “giả” lộ liễu, với Kling 2.6 bạn sẽ ít gặp hơn. Đương nhiên là ảnh đầu vào phải đủ tốt - thì nó sẽ giữ hình ảnh đó xuyên suốt video đó tốt hơn so với các model AI trước đây!\n\nCamera control & khung hình: Góc máy, chuyển cảnh, bố cục… hỗ trợ rất ổn, giúp video nhìn pro hơn.\n\nChất lượng video ổn, độ phân giải tốt \\(1080p\\) - mức tiêu chuẩn trước giờ của Kling\n\n⚠️ Những điểm cần lưu ý\n\nLipsync & giọng nói: Đôi khi lệch khá rõ, hoặc giọng hơi “máy móc”, thiếu tự nhiên. Nếu nhân vật mở miệng nhiều, nên cân nhắc. Và tiếng Việt không được hỗ trợ, lipsync tiếng Việt xưa tới nay luôn bị thử thách rồi, nên là có lẽ cũng chưa thể kì vọng nhiều trong giai đoạn này của AI video trực tiếp.\n\nSố lượng voice còn ít, ít biến hóa — nên nếu bạn làm nhiều video khác nhau, dễ thấy trùng lặp.\n\nĐôi mắt nhân vật đôi lúc thiếu cảm xúc, “đờ” — ảnh hưởng đến độ sống động của video.\n\n🧩 Tổng quan\n\nKling 2.6 phù hợp nếu bạn tập trung vào visual chất lượng, phong cách nghệ thuật, muốn video lên “mood” hơn là hoàn hảo lip-sync.\nNếu bạn cần video có nói, nhiều biểu cảm, giọng nói mượt mà — vẫn nên cân nhắc, hoặc chuẩn bị tâm lý chỉnh sửa thủ công thêm.\n\nNote: Dĩ nhiên model chỉ mới xuất xưởng nên cũng sẽ cần thời gian để hoàn thiện hơn, và T cũng chỉ mới test trong thgian ngắn, nếu có phát hiện gì mới sẽ tiếp tục sharing cho cả nhà AI Worker.\n\nVề lại SG t sẽ sớm update các course tiếp theo về dòng chảy AI Visual, mn chờ xem chi tiết nhé 🙌","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-04T01:19:38.682983Z","updatedAt":"2025-12-15T01:34:40.116113Z","upvotes":43,"comments":15,"thumbnailUrl":"https://image.video.skool.com/Y7iLtURIyRGBFicyzUWuBhZJi11xIAhmlXVGYkuWcQw/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTE4NDk4NjkzLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiWTdpTHRVUkl5UkdCRmljeXpVV3VCaFpKaTExeElBaG1sWFZHWWt1V2NRdyIsIndpZHRoIjoxMjgwfQ.Rn8e0Osmf29Xc28DV1rDGLQ93_hgFJkfBbiYIzxGtQFlyaD7P5y8zzCUcQ3BlzYQfHN4QyDbyP5EKKX0yomIL5Z0R20sxFJtIAD5eesyl4k89ek2XciPv63jJLgv4hK4i_7om3JvVdTpqpuzk_o57vI-F6btAv-HJJ2ybZGFusCa8aUvSb44mbxoOz7we_mE1IdRn2Q597edZl7O7j53sqsZUwVk0kMpRvfsBbx2gL4foxrtKw4-9Ly1x9nkoilwz4rxKveMjX0aToYJVIWxVKeGFt6KiYVOxBPHRm8TwrduAyjeWGEuHWOv7vBLMEJV1YNxySkO8Lzq5k6i4KhM2w","thumbnailLocal":"post-thumbs/63d35286cbb4506b.png","videoIds":"77ae6a4603d24ffca2d5fb2a3a2211d6,6142667adb314669a55b3afdbe4275a5","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/anh-gia-kling-26-update-moi-nhat-cua-model-video-ai"}]},{"title":"Tháng 12, 2025 PART 2","url":"https://www.skool.com/ai-ker-8924/classroom/977b3b50?md=e68339b101ea4bafabc769a86eb51e62","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Tham gia buổi \"},{\"type\":\"text\",\"marks\":[{\"type\":\"link\",\"attrs\":{\"class\":\"link\",\"href\":\"https://www.skool.com/ai-ker-8924/calendar\",\"rel\":\"noopener noreferrer\",\"target\":\"_blank\"}}],\"text\":\" Live thứ 7 hằng tuần \"},{\"type\":\"text\",\"text\":\"Để cập nhật tin tức mới nhất!\"}]},{\"type\":\"horizontalRule\"}]","domContent":"<div class=\"styled__EditorInnerWrapper-sc-1cnx5by-1 htfMPD\"><div class=\"styled__EditorContentWrapper-sc-1cnx5by-2 bXbSDs\"><div contenteditable=\"false\" translate=\"no\" class=\"tiptap ProseMirror skool-editor2\"><p>Tham gia buổi <a target=\"_blank\" class=\"link\" href=\"https://www.skool.com/ai-ker-8924/calendar?utm_campaign=skool_link_classroom&amp;utm_content=d2099b9572be43a39c266ef9a616e916\" title=\"https://www.skool.com/ai-ker-8924/calendar?utm_campaign=skool_link_classroom&amp;utm_content=d2099b9572be43a39c266ef9a616e916\"> Live thứ 7 hằng tuần </a>Để cập nhật tin tức mới nhất!</p><hr contenteditable=\"false\"></div></div></div>","posts":[{"id":"f588ec3ba2a24c64890dd9a2afface36","slug":"cam-on-ai-worker-va-cam-on-nam-2025","title":"CẢM ƠN AI-WORKER VÀ CẢM ƠN NĂM 2025","content":"Thật lòng mà nói, 2025 là một năm đầy biến động – không chỉ với thế giới AI Creative mà cả với chính mình. Một năm mình học được rất nhiều, thay đổi rất nhiều, và cũng may mắn có được những điều mà trước đây chưa từng dám nghĩ tới.\nVà nếu phải chọn ra điều tuyệt vời nhất mình đạt được trong năm nay, thì chắc chắn đó là: kết nối được với cộng đồng AI-Worker.\n\nMình gặp rất nhiều người giỏi – thông minh, sáng tạo và cực kỳ chịu khó với AI.\nChính sự chia sẻ, tương tác, và năng lượng của mọi người đã truyền cảm hứng để mình cố gắng hơn mỗi ngày.\nTừ đó, mình làm được nhiều thứ hơn – và dần hiểu rõ con đường mình đang đi với AI Creative.\n\nVậy nên, ở thời điểm cuối năm, mình chỉ muốn nói một điều:\nCảm ơn mọi người – cảm ơn AI-Worker.\n\nHy vọng 2026, cộng đồng mình sẽ tiếp tục phát triển – không chỉ đông hơn mà còn chất lượng hơn.\nMỗi người một hướng đi khác nhau, nhưng mình tin rằng nếu còn đồng hành với nhau – giá trị sẽ còn lớn hơn nữa.\n\nHappy New Year 2026 – hẹn gặp mọi người ở chặng đường mới!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-31T12:44:00.373294Z","updatedAt":"2026-01-15T17:14:42.591535Z","upvotes":36,"comments":41,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/3d76db01f567455d97014a82cd4f360c4e3e2dd22ba84146b3646192b765977b.png","thumbnailLocal":"post-thumbs/ce6e511e03f66951.png","videoIds":"","attachments":"b800094c194642b49d4bc3b2f6a01063,cb3e9c9b351440cab985bb88af40102f,47115be263844f7db0b4d0bc20155113","postUrl":"https://www.skool.com/ai-ker-8924/cam-on-ai-worker-va-cam-on-nam-2025"},{"id":"b8e297f3c65a44c9883ede4c10cef8ad","slug":"interview-3-lamvinh-head-of-ai-stuido-phibious","title":"🔥 INTERVIEW #3 : LAMVINH - HEAD OF AI STUIDO PHIBIOUS","content":"Hello cả nhà, Toàn rất vui vì lại săn đón được một người anh rất đặc biệt chia sẻ về thị trường AI Creative với cộng đồng AI-Worker của chúng ta sắp tới.\n\nĐó là anh Lâm Vinh, Head of AI Studio tại Phibious và cũng là một Commercial Film Director! Chắc chắn mn ít nhiều đã từng thấy TVC ảnh làm rồi kkk\n\n👀 Không chỉ là người đứng sau những TVC nổi bật, anh Vinh còn là một trong những người ứng dụng AI vào ngành Creative từ rất sớm. Hiện tại, anh đang trực tiếp đưa AI vào các chiến dịch thật ngoài thị trường, nên những gì tụi mình chuẩn bị được nghe tới đây sẽ không phải lý thuyết – mà là case thực tế, kinh nghiệm thực chiến.\n\n🎥 Vậy nên nếu bạn đang tò mò về cách AI đang thật sự đi vào ngành sáng tạo thế nào, cách các agency lớn đang vận hành AI trong quy trình ra sao – thì đừng bỏ qua buổi interview này.\nCực kỳ giá trị cho anh em AI-Ker đang muốn tiến xa hơn!\n\n⏳ Bật mí là video sẽ sớm lên sóng . Ai hóng giống T không?\nComment bên dưới nếu bạn có câu hỏi muốn gửi đến anh Vinh để tụi mình đưa vào buổi trò chuyện luôn nè!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-26T05:10:24.53641Z","updatedAt":"2026-01-08T05:03:03.291315Z","upvotes":33,"comments":38,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/c8f803ee8499496aaca444c338e61857e0570627384a499e967e670848558281.png","thumbnailLocal":"post-thumbs/7df167a1537818f0.png","videoIds":"","attachments":"d93f0168568248d59fd3747a7ee50778,00fc609cea31421996053593220ffd6b,e36306aab4534694a1a83ebc49ce33e4,79035fd4db7444ebb50994528aa4710a,51124b8bcf224d32aead5bca3a47d261,e675f544de8641908c374d3ad1da09ea,5085e27638ee4dbeb199acf8bc1f2cd7,a6d6e1b745a74b82804fbe3ddf60abb3","postUrl":"https://www.skool.com/ai-ker-8924/interview-3-lamvinh-head-of-ai-stuido-phibious"},{"id":"1e178347d0cd4e26a7e96170ba194674","slug":"ai-motion-control-tinh-nang-ai-video-cuc-manh-trong-nganh-sang-tao","title":"A.I Motion Control - Tính năng AI video cực mạnh trong ngành sáng tạo 🎥🤖","content":"Halo cả nhà, gần đây TaiOn đang test rất kỹ tính năng AI Motion Control của Kling 2.6 mới vừa ra mắt và thực sự phải chia sẻ ngay với mọi người vì tiềm năng của nó quá lớn.\nThật ra tính năng sao chép hành động này không mới, trước đó Runway hay Wan 2.2 cũng đã nhen nhóm làm tính năng này, nhưng phải thú thật là độ chính xác \\(motion match\\) và độ ổn định chi tiết \\(texture\\) chưa thực sự \"đã\". Nhưng với Kling 2.6 hiện tại, anh em có thể thấy trong clip demo của mình: nó giữ được từ cái nhíu mày, cử chỉ tay cho đến góc máy \\(camera movement\\) cực kỳ mượt mà.\n\n💡 Tại sao đây sẽ là xu hướng lớn? Nó sẽ len lỏi vào cực nhiều ngách trong thị trường Creative:\n\n[ul][li]Filmmaking: Một diễn viên có thể đóng thế cho... quái vật, người ngoài hành tinh, hoặc thậm chí đóng 1 lúc 5 vai khác nhau trong cùng 1 khung hình.\n\n[ul][li]Affiliate & Bán hàng: Anh em làm video review có thể thay đổi background, trang phục, hoặc style video chỉ từ 1 source quay gốc để A/B testing quảng cáo cực nhanh.\n\n[ul][li]Style Transfer: Biến video người thật thành Anime, 3D, Cyberpunk... mà không bị \"giật giật\" hay méo hình.\n\nVà với quan sát của T khi được nghe chia sẻ từ Rourke hay các top AI Creator thì tính năng này không phải là một trend nhất thời, các AI Video model đang đầu tư phát triển rất mạnh mẽ vì tiềm năng to lớn của nó.\n\nĐương nhiên, \"hàng nóng\" thì không thể thiếu phần anh em mình. TaiOn sẽ sớm lên một bài hướng dẫn chi tiết \\(hoặc video tutorial\\) về cách kiểm soát con Kling này cho cộng đồng chúng ta.\n\nCả nhà nghĩ sao về tính năng này? Cmt ở dưới nhé, ừng quên cuối tuần này chúng ta có buổi meet onl nha cả nhà kkk","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-25T09:44:02.262731Z","updatedAt":"2025-12-27T12:35:58.298722Z","upvotes":20,"comments":22,"thumbnailUrl":"https://image.video.skool.com/Iw8dG2W9P00HVekQyXpTMDHFcriDBiL02E5GQoLSyhY3Q/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTIwMzQyMjQyLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiSXc4ZEcyVzlQMDBIVmVrUXlYcFRNREhGY3JpREJpTDAyRTVHUW9MU3loWTNRIiwid2lkdGgiOjEyODB9.FfP81fjrZ4zQE3dyWn7lCNUI3pKDpvmpnvOpHkSr7a1jn9wvDW5ZU4QPyJHBe-8xgex8GrAGsN4Owq1QiJN9RxRaBbqMNtgotTab9WRBkzqCBs4nivRE-Rl4IjwzbXEvb_XxWmO_YnpD9IW2CjYN4_EiLJNnD2sTL4XNIWJRsFHH4Z_Om41NU4M1GWD-CnTBh_isCQoHlnBpBlthL3It9dus_Krr1gJymO-EP8dlWxoFm90w9Bs-igcKoYPrBiFQ_zU9QBw_eegIk1m1TR-xEUSlyqPsOzHDiFODq7qhea9CQ_8-TIK_o_Fv5LAenZLZZoxRWbYe6uoKN3IK6TrWRQ","thumbnailLocal":"post-thumbs/7c6a7772098ce785.png","videoIds":"72979dfdf1ef43129d71e0cb056eb339,45ed33a562834f72a5d9d82f21fdb32a,4e3a8968aeb44bfabb32208158281961","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/ai-motion-control-tinh-nang-ai-video-cuc-manh-trong-nganh-sang-tao"},{"id":"f238642d7e1b420da0c2ad550a7541c6","slug":"merry-christmas-ca-nha-ai-worker-oi","title":"🎄 Merry Christmas cả nhà AI-Worker ơi!","content":"T vừa có dịp trải nghiệm vài dự án với AI Cinema Studio của Higgsfield, và thật sự là bất ngờ vì nó dễ dùng hơn mình nghĩ rất nhiều. Giao diện thân thiện, chất ảnh dễ kiểm soát – rất hợp với anh em nào đang muốn tối ưu visual trong video mà không cần setup gì quá phức tạp. Video bên dưới là một ví dụ mình dùng Cinema Studio.\n\n📌 Sắp tới T sẽ chia sẻ cụ thể trong mục Classroom cách T đang ứng dụng tính năng này như thế nào – đảm bảo là dễ hiểu, ai cũng dùng được nha. Hóng không? kkk\n\nNhưng mà... hôm nay là Giáng sinh 🎁 nên nhẹ nhàng lại tí.\nChúc mọi người một ngày thật ấm áp, chill bên gia đình và người thân.\nCảm ơn vì đã luôn đồng hành cùng cộng đồng AI-Worker trong suốt thời gian qua.\n\nMerry Christmas! 💫\n– From T, with love.","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2025-12-24T10:56:02.598702Z","updatedAt":"2026-01-08T05:02:57.505042Z","upvotes":33,"comments":30,"thumbnailUrl":"https://image.video.skool.com/eT5B2EnWInjeL1MJxdq9QlchJyMnHQjXTL02iGcconRs/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTIwMjYwMTYyLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiZVQ1QjJFbldJbmplTDFNSnhkcTlRbGNoSnlNbkhRalhUTDAyaUdjY29uUnMiLCJ0aW1lIjoyOC4xMjgsIndpZHRoIjoxMjgwfQ.vRS23nB5RyWskGiKrNU4xyJHIKrfsFCR6k50BUIwSvdF1wZXWzTkiiucrZLhe25fgs_rF8e4ukBvwRZO5MostnpCYQs5hG1VrR50mHgVm3Ro-6KwJ0vjTLXZ0KBT1pxV8P_Xsb_5hRME0mW0v-9eOuuXBQd94KkzLjR_d9eJMKJ08qw6jaXLbsNzqpV838UTMY_2bKBGVr4uxXxEkWrRbK3QDg4uvsBGAGZ63ydqWmh6T6qdSMs9RfT9DJL-m2uitpnlD7QIMw7mgD0FbrjhNg92hDVv8JdokVAai1LSOxCSK-nvRaOjR3zLwdVQhrpzmpJbzDhNNZcon2RZrl8mIA","thumbnailLocal":"post-thumbs/c2559640a89510c3.png","videoIds":"891e6fb69ef042dd9388b0bf2cddf24a","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/merry-christmas-ca-nha sâu \\(Ray 3.14\\)\n\n📍Tối nay 19h00, tụi mình sẽ cùng thảo luận những cập nhật này trong buổi Meeting Online.\nBạn nào có thắc mắc hay cần tư vấn gì, cứ đặt câu hỏi tự do trong buổi meeting nhé! Và ai có nón AI Worker rồi thì đừng quên đội vào để meet nha kkk\n\n🎮 Ngoài ra, Game 8 – Tết Video Challenge vẫn đang diễn ra.\nNếu bạn đang phân vân cách làm video cảm xúc hoặc chưa rõ yêu cầu game, đừng ngại hỏi.\n\n⏰ Hẹn gặp mọi người tối nay!\nCùng nhau cập nhật kiến thức và tiến bộ với AI Creative! 💥","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-01-31T06:54:47.42019Z","updatedAt":"2026-04-10T18:40:28.793219Z","upvotes":30,"comments":13,"thumbnailUrl":"https://image.video.skool.com/qFqdX4ynE7zPeYYsxxYgGVNZhmIlGxLb3AApbkVym3o/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTIzNTI4ODg3LCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoicUZxZFg0eW5FN3pQZVlZc3h4WWdHVk5aaG1JbEd4TGIzQUFwYmtWeW0zbyIsIndpZHRoIjoxMjgwfQ.1weuTVGhzAHuHkgftJ3Gnu3Zaxf2rjefYd0RtPl4VsIbERNqJMBi8pTqvMn1l9XDcutEAY1SAe5nnD9o1VSOtwx8uHDNkLqWjxK229Ztrb8_Oji2bbuMevMuIaTFjQN9U6VthXK1t9JLp6Fng-DDY8sc8tBWhOmXq02V2XrCH71EUo7S1a8HD6FbjJgMOH167VcX81lMv7KyyPeDqE7YQMlLIawNaa3BQA8ZP2Gx_Xuu0mvB08J1cgpVUIQa_v9h6YGOGv72DmG2BqjJaMFrkNYV6H3EyJNsK6TjNTpjx8TW4wT9zTvlxcOP6CZEREYrTWd98QQRqxqNAU4JwhaVxw","thumbnailLocal":"post-thumbs/0c4ca90e263390ab.png","videoIds":"696e31a27b0649599fd711058222f10d","attachments":"30adcbd66e9c4b30af27353b1e506da0","postUrl":"https://www.skool.com/ai-ker-8924/cap-nhat-cong-ong-toi-nay-meet-online-tuan"},{"id":"957260415c2442c6bb62f97163b9522a","slug":"concept-la-vua-cong-cu-ai-chi-la-tuong","title":"CONCEPT LÀ VUA, CÔNG CỤ AI CHỈ LÀ TƯỚNG","content":"Giữa một thời đại mà ai cũng có thể tạo ra cả nghìn bức ảnh đẹp chỉ trong tích tắc, Toàn nhận ra rằng kỹ năng sử dụng công cụ không còn là thứ quyết định thắng thua nữa. Chính Concept \\(Tư duy ý tưởng\\) mới là thứ giúp bạn tách mình ra khỏi đám đông.\n\nAI có thể cho bạn vô vàn hình ảnh, nhưng hình ảnh chưa chắc đã mang lại ý nghĩa. Khi cái đẹp trở nên đại trà, thứ xa xỉ nhất chính là Sự Nhất Quán trong tư duy.\n\nVới dự án lần này, Toàn không bắt đầu bằng một dòng prompt vô hồn. Toàn bắt đầu bằng một câu hỏi: \"Nếu AI lạc vào dòng chảy văn hóa Việt, nó sẽ tồn tại dưới hình hài nào?\" Và câu trả lời của Toàn là cuộc giao thoa giữa: 🔸 Cố đô Huế – đại diện cho ký ức. 🔸 Mặt nạ kim loại – đại diện cho trí tuệ nhân tạo lạnh lùng. 🔸 Dải lụa đỏ – sợi dây xuyên suốt giữ cho quá khứ không bị đứt gãy.\n\nQuy trình làm việc của Toàn thực ra rất thủ công trong tư duy: Định hình trang phục \\(Áo ngũ thân\\), chọn nhân vật \\(TaiOn\\), chốt bối cảnh \\(hoàng hôn Cố đô\\)... rồi mới để AI tham gia ở bước cuối cùng. Với Toàn, AI chỉ là công cụ để hiện thực hóa những gì đã được sắp đặt kỹ lưỡng trong đầu.\n\nThế nên, thay vì hỏi \"AI làm được gì?\", bạn hãy thử tự hỏi \"Concept của mình là gì?\". Nếu bạn muốn dùng AI để kiến tạo một thế giới riêng, hãy bắt đầu từ ý tưởng, đừng chỉ tập trung vào những câu lệnh, hãy tôi rèn tư duy hình ảnh.\nCác bạn nghĩ sao? mn có muốn 1 video break down step by step cách T thực hiện 1 dự án trên không?","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-01-22T07:32:43.320376Z","updatedAt":"2026-04-10T18:40:39.251887Z","upvotes":56,"comments":37,"thumbnailUrl":"https://image.video.skool.com/XWO01K5026XjVsCvn8cTqfRitM3BBgiKQsrTXf6taQFb00/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTIyNzUzNTYzLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiWFdPMDFLNTAyNlhqVnNDdm44Y1 rker.","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-01-20T05:52:58.961744Z","updatedAt":"2026-02-22T14:21:24.561572Z","upvotes":55,"comments":11,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/d60f4cdd1ca142628106da867b153a13f7465dab33994e2b98e63137e056e22d.jpg","thumbnailLocal":"post-thumbs/cc560a90cd0d5da0.jpg","videoIds":"","attachments":"624dbbf677e4483eb9e0d3a6adbe75c7,05cf55f42199480b8cfb62a65680a951","postUrl":"https://www.skool.com/ai-ker-8924/buoi-gap-nho-y-tuong-lon-ai-worker-ket-noi"},{"id":"88a5b4a0d6544d3490fbed59da288bd7","slug":"update-1-ngay-cung-phibious-ai-studio-cac-speaker-cu","title":"UPDATE 1 NGÀY CÙNG PHIBIOUS AI STUDIO & CÁC SPEAKER CŨ","content":"Hôm nay T có dịp gặp lại các speaker cũ & team Phibious AI Studio — đặc biệt là anh Thái Anh Nguyễn vừa từ Đức trở về Việt Nam trong kỳ nghỉ tết lần này✈️. Cuộc trò chuyện lần này thực sự thú vị và mở mang nhiều góc nhìn mới.\n\nChủ đề chính xuyên suốt trong cả hai buổi gặp hôm nay đều xoay quanh một vấn đề lớn: GIÁO DỤC TRONG KỶ NGUYÊN AI.\n\nTất cả đều đồng ý rằng nếu muốn thị trường AI Creative ở Việt Nam phát triển mạnh mẽ và bền vững, thì việc giáo dục cần được thực hiện song song nhiều phía như:\n\nKhách hàng \\(client\\)\n\nNgười làm nghề \\(worker\\)\n\nVà thế hệ mới \\(student\\)\n\nKhi cả thị trường cùng hiểu – cùng phát triển – cùng sáng tạo, AI mới thật sự trở thành công cụ giá trị, chứ không phải là “mốt nhất thời”.\n\n💡 Ngoài ra, team Phibious AI Studio cũng đang tìm kiếm các bạn trẻ tiềm năng trong mảng AI Creative. Vậy nên nếu bạn đang học, đang luyện tập – đừng bỏ cuộc!\n\nHãy tiếp tục học hỏi – rèn tư duy – và thể hiện bản thân qua các game thực chiến như Game 7 đang diễn ra. Đây là cách tốt nhất để:\n\nXây dựng portfolio\n\nPhát triển kỹ năng\n\nVà tạo ra giá trị thực tế cho dự án & công ty bạn mơ ước\n\n👉 Chúc mọi người tiếp tục giữ lửa sáng tạo & tận dụng cơ hội thời đại AI này thật tốt!","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-01-14T16:15:52.307298Z","updatedAt":"2026-02-22T14:21:25.474319Z","upvotes":39,"comments":20,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/f649e50bc9714913b02a31e901b7aac40df341bf891f47c1962784dc8c0b992f.jpg","thumbnailLocal":"post-thumbs/ec90a485ff15add8.jpg","videoIds":"","attachments":"99bfae1102204821b8a4511269a7a149,2ede390ccbc540ebaeadcdbef68f9e2d,22eb968eafa9455b8c7ffc2d4a4d2947","postUrl":"https://www.skool.com/ai-ker-8924/update-1-ngay-cung-phibious-ai-studio-cac-speaker-cu"},{"id":"aa8194ba9fe642bfa97c881b1799f96d","slug":"update-lesson-moi-workflow-train-ai-voi-transparent-glass-car","title":"Update lesson mới: Workflow train AI với transparent glass car 📣","content":"T vừa hoàn tất một lesson mới trong AI advertising – nơi T hướng dẫn từng bước quy trình train AI để tạo hiệu ứng “transparent glass car” như đã nói trước đó.\nĐây là cách ứng dụng AI không chỉ để tạo hình, mà còn để kiểm soát chuyển động, bố cục, layering… rất hữu ích cho các chiến dịch quảng cáo tiếp theo.\n\n🎯 Mình rất muốn mọi người thử nghiệm rồi post kết quả trong cộng đồng để tụi mình học chung và so sánh workflow của mỗi người. Đây là một kỹ năng rất cool – và thực tế ứng dụng được trong nhiều project.\n\nLink: [Lesson](https://www.skool.com/ai-ker-8924/classroom/38519dbf?md=d66ccee90b5c4bcfae863e37b871fbb8)\n\n*Và một điều nữa… hôm nay là birthday của mình 🎂 \\(cho phép chia sẻ xíu xíu kkk\\)\nMình là người số 9, Sứ mệnh của mình là vì cộng đồng \\(theo thần số học\\) và bản thân mình cũng thấy điều đó đúng với mình, mình luôn muốn tạo ra giá trị, ảnh hưởng đến với cộng đồng.\nVà cộng đồng AI Worker – chính là một trong những giá trị đó của mình.\n\nVì vậy, nên nhân ngày sinh nhật, điều mình muốn làm nhất đó chính là tiếp tục trao giá trị bằng video hướng dẫn này, mong cả nhà enjoy và nhận được nhiều từ nó.\n\nHy vọng năm tuổi mới này mình sẽ mang đến nhiều giá trị hơn nữa cho cộng đồng – đặc biệt là về AI Creative 🙌","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-01-05T06:24:03.492698Z","updatedAt":"2026-02-22T14:21:28.752245Z","upvotes":65,"comments":75,"thumbnailUrl":"https://assets.skool.com/f/d2099b9572be43a39c266ef9a616e916/150bbc64464446c8ba579d19cca187e0fdc11c8901dc4f3d8f0640f51c93bbe4.png","thumbnailLocal":"post-thumbs/9562f377ca073d86.png","videoIds":"","attachments":"ffb99fd7036348e5a9fbfc712564e0b8","postUrl":"https://www.skool.com/ai-ker-8924/update-lesson-moi-workflow-train-ai-voi-transparent-glass-car"},{"id":"eaa44436ceed4d959940219a17a76827","slug":"motion-control-xu-huong-ung-dung-ai-video-moi","title":"MOTION CONTROL: XU HƯỚNG ỨNG DỤNG AI VIDEO MỚI","content":"Hello cả nhà, mn đã thử tính năng AI Motion Control chưa? Đây chính xác là mảnh ghép còn thiếu để chúng ta chuyển từ \"dùng AI tạo ảnh động\" sang \"làm phim thực thụ\". Và chắc chắn sẽ có nhiều người kiếm tiền tươi từ nó!\n\n🚀 Lợi ích cốt lõi mang lại:\n[ol:1][li]Chính xác tuyệt đối: Bắt nhân vật thực hiện đúng 100% hành động bạn muốn \\(nhảy, đánh võ, diễn xuất\\) – không còn cảnh \"AI tự biên tự diễn\" sai lệch.[li]Bắt trend siêu tốc: Dễ dàng tạo video đu trend TikTok/Reels với nhân vật ảo mà không cần tốn công quay dựng phức tạp.[li]Nhất quán: Giữ vững được character trong các chuỗi hành động dài, điều kiện tiên quyết để làm phim hoặc xây dựng KOL ảo.\n💡 Năm 2026 sẽ là năm của sự \"Kiểm soát\". Và Video Course step by step sẽ sớm có mặt trong AI-Ker \\(mai or mốt\\)\n\n🔥 QUAN TRỌNG: CUỘC HẸN TỐI NAY \\(02/01\\)\nĐừng quên chúng ta có buổi Meeting Online \"xông đất\" đầu năm vào tối nay!\n[ul][li]⏰ Thời gian: 19:00 - 19:30 \\(Gói gọn trong 30 phút\\).[li]🎯 Nội dung: Bàn luận về các Key Trend AI năm nay và Giải đáp mọi thắc mắc của anh em! See u ","author":"Toan Thai","authorAvatarUrl":"https://assets.skool.com/f/a57a72ce96b440c3b68e374dbc47854a/8d955a6b86d9445fa40f71cc2a97385cc5a369a7dd234b48a312cd9a8c61460a-sm.jpg","authorAvatarLocal":"post-thumbs/d95acc42a9ff44bb.jpg","createdAt":"2026-01-02T11:33:49.192796Z","updatedAt":"2026-02-22T14:21:30.67824Z","upvotes":33,"comments":32,"thumbnailUrl":"https://image.video.skool.com/Zf1i6T00r3vA01QXWBrGuNTWgMLoIFwgCpIeEd02jFE02P4/thumbnail.png?token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJ0IiwiZXhwIjo0OTIxMDQ3MDYxLCJraWQiOiJPVjIwMHZ6SWZuZFVCNHdXdTAxbDRjb0hrYTVQQUd3TlYwMEtZSkJrQkppVlFrIiwic3ViIjoiWmYxaTZUMDByM3ZBMDFRWFdCckd1TlRXZ01Mb0lGd2dDcEllRWQwMmpGRTAyUDQiLCJ3aWR0aCI6MTI4MH0.Ct2zhZoPMkWuRIAJ-krGt8pBU_De8_dFI-QEbScC7SUwkMg8yPBthvfWMDhgu2R4HJp9duLIWSMNNR6fbscJ5Pv-4tkVKddNxpS4bbomhcWM6y32PtmkmGNef31s12wdY4_OAU8RhDskouAHEWna7mngmvYzq0_HYCC_piT8Jq2ccLiwrO0w2qE7J5FVAGCFzT2Z6eS80fINYQPfLcqYybDs5ZfAs-VRP8nhDKYnno9FrPHWSHFtmNpYGPsb6LpXcoxq6j4vdla3uR0PKxohELCcs9vymcjOA7LFDiOeEorGLRy_Yj52noaqlPmALVljjTyP636ebZHJL33D5Ditfw","thumbnailLocal":"post-thumbs/58d77bd49032441c.png","videoIds":"44dbf55a635845bb8b4e5b972c233109","attachments":"","postUrl":"https://www.skool.com/ai-ker-8924/motion-control-xu-huong-ung-dung-ai-video-moi"}]},{"title":"Tháng 2, 2026","url":"https://www.skool.com/ai-ker-8924/classroom/977b3b50?md=fe7188d0c7964fe09a10962e63b7c91e","videos":[],"documents":[],"textContent":"[v2][{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Tham gia buổi \"},{\"type\":\"text\",\"marks\":[{\"type\":\"link\",\"attrs\":{\"class\":\"link\",\"href\":\"https://www.skool.com/ai-ker-8924/calendar\",\"rel\":\"noopener noreferrer\",\"target\":\"_blank\"}}],\"text\":\" Live th
